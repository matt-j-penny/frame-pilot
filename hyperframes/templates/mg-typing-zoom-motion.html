<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Typing Zoom Motion</title>
  <script src="vendor/gsap.min.js"></script>
  <style>
    :root {
      --field: #fafaf8;
      --paper: #ffffff;
      --ink: #2f302e;
      --muted: #858581;
      --line: #d7d7d4;
      --coral: #da7655;
      --black: #080808;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      overflow: hidden;
      background: var(--field);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    .scene-bg {
      position: absolute;
      inset: 0;
      background: var(--field);
    }

    #ui-clip {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #world {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .greeting {
      position: absolute;
      top: 170px;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .sunburst {
      position: relative;
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
    }

    .sunburst i {
      position: absolute;
      top: 22px;
      left: 0;
      width: 48px;
      height: 4px;
      border-radius: 999px;
      background: var(--coral);
      transform: rotate(calc(var(--n) * 22.5deg));
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 64px;
      font-weight: 400;
      line-height: .95;
      letter-spacing: -3px;
      white-space: nowrap;
    }

    .workspace {
      position: absolute;
      left: 435px;
      top: 330px;
      width: 1050px;
    }

    .composer {
      position: relative;
      height: 190px;
      padding: 34px 36px 28px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 31px;
      background: var(--paper);
      box-shadow: 0 10px 30px rgba(43, 43, 37, .06);
    }

    .prompt-viewport {
      position: absolute;
      top: 34px;
      left: 36px;
      right: 36px;
      height: 32px;
      overflow: hidden;
      white-space: nowrap;
      font-size: 25px;
      line-height: 1;
      letter-spacing: -.7px;
    }

    #placeholder {
      position: absolute;
      inset: 0 auto auto 0;
      color: var(--muted);
    }

    #placeholder strong { color: #5f5f5b; font-weight: 700; }

    #typed-line {
      position: relative;
      display: inline-block;
      height: 28px;
      color: var(--ink);
      white-space: nowrap;
    }

    .word {
      display: inline-block;
      transform-origin: 50% 60%;
    }

    .char {
      display: inline-block;
      opacity: 0;
    }

    .space { width: .31em; }

    #caret {
      position: absolute;
      top: 1px;
      left: 0;
      width: 3px;
      height: .9em;
      border-radius: 2px;
      background: var(--coral);
      opacity: 0;
      transform-origin: 50% 50%;
    }

    .composer-row {
      position: absolute;
      right: 36px;
      bottom: 31px;
      left: 40px;
      display: flex;
      align-items: center;
    }

    .plus {
      border: 0;
      padding: 0;
      background: transparent;
      color: #111;
      font: 300 32px/1 Arial, sans-serif;
    }

    .composer-controls {
      display: flex;
      align-items: center;
      gap: 42px;
      margin-left: auto;
      color: var(--black);
      font-size: 22px;
    }

    .model, .round-icon { display: flex; align-items: center; }
    .model { gap: 13px; }
    .model .weight { color: #777772; }

    .chevron {
      width: 11px;
      height: 11px;
      border-right: 1.5px solid #777;
      border-bottom: 1.5px solid #777;
      transform: rotate(45deg) translateY(-3px);
    }

    .round-icon { gap: 43px; }

    .mic {
      position: relative;
      width: 17px;
      height: 26px;
      border: 2px solid #111;
      border-radius: 12px;
    }

    .mic::before {
      content: "";
      position: absolute;
      left: -6px;
      top: 10px;
      width: 25px;
      height: 15px;
      border: 2px solid #111;
      border-top: 0;
      border-radius: 0 0 18px 18px;
    }

    .mic::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 25px;
      width: 2px;
      height: 7px;
      background: #111;
      box-shadow: -6px 8px 0 -1px #111, 6px 8px 0 -1px #111;
    }

    .wave { display: flex; align-items: center; gap: 4px; height: 29px; }
    .wave i { width: 2px; height: var(--h); border-radius: 3px; background: #111; }

    .quick-actions {
      display: flex;
      justify-content: center;
      gap: 11px;
      margin-top: 20px;
    }

    .quick-actions button {
      display: flex;
      align-items: center;
      height: 50px;
      padding: 0 13px;
      border: 2px solid #e1e1de;
      border-radius: 11px;
      background: var(--paper);
      color: #111;
      box-shadow: 0 2px 4px rgba(0,0,0,.07);
      font: 21px/1 Arial, sans-serif;
      white-space: nowrap;
    }

    .quick-actions .ico {
      width: 25px;
      margin-right: 7px;
      color: var(--muted);
      text-align: center;
      font-size: 25px;
    }

    .quick-actions .drive { color: #168b45; }
    .quick-actions .calendar { color: #1a73e8; }
  </style>
</head>
<body>
  <div data-hf-id="hf-pa6n" id="stage" data-composition-id="typing-zoom-motion" data-start="0" data-duration="8" data-fps="30" data-width="1920" data-height="1080">
    <div data-hf-id="hf-8rns" class="scene-bg"></div>
    <div data-hf-id="hf-nnpt" id="ui-clip" class="clip" data-start="0" data-duration="8" data-track-index="1" data-layout-allow-overflow="true">
      <main data-hf-id="hf-mnin" id="world">
        <header data-hf-id="hf-5zr1" class="greeting">
          <span data-hf-id="hf-ym9e" class="sunburst" aria-hidden="true">
            <i data-hf-id="hf-80kh" style="--n:0"></i><i data-hf-id="hf-78wo" style="--n:1"></i><i data-hf-id="hf-fwsj" style="--n:2"></i><i data-hf-id="hf-byoi" style="--n:3"></i>
            <i data-hf-id="hf-t6yt" style="--n:4"></i><i data-hf-id="hf-sfb0" style="--n:5"></i><i data-hf-id="hf-3asn" style="--n:6"></i><i data-hf-id="hf-zcom" style="--n:7"></i>
          </span>
          <h1 data-hf-id="hf-oznk">Afternoon, Matt</h1>
        </header>

        <section data-hf-id="hf-rx48" class="workspace" aria-label="Assistant prompt">
          <div data-hf-id="hf-cydq" class="composer">
            <div data-hf-id="hf-t17h" class="prompt-viewport">
              <div data-hf-id="hf-m1f7" id="placeholder">Type <strong data-hf-id="hf-repr">/</strong> for skills</div>
              <div data-hf-id="hf-vk7f" id="typed-line" aria-label="Plan a bold launch for tomorrow"></div>
              <span data-hf-id="hf-9blk" id="caret" aria-hidden="true"></span>
            </div>
            <div data-hf-id="hf-hj2h" class="composer-row">
              <button data-hf-id="hf-nltf" class="plus" aria-label="Add attachment">+</button>
              <div data-hf-id="hf-r6r9" class="composer-controls">
                <div data-hf-id="hf-wobj" class="model"><span data-hf-id="hf-7s95">Sonnet 5</span><span data-hf-id="hf-98e2" class="weight">Medium</span><span data-hf-id="hf-6h7y" class="chevron"></span></div>
                <div data-hf-id="hf-1iq2" class="round-icon">
                  <span data-hf-id="hf-k2h7" class="mic" aria-label="Microphone"></span>
                  <span data-hf-id="hf-9uc4" class="wave" aria-label="Voice mode">
                    <i data-hf-id="hf-njr4" style="--h:12px"></i><i data-hf-id="hf-s3jn" style="--h:24px"></i><i data-hf-id="hf-8out" style="--h:31px"></i><i data-hf-id="hf-50ke" style="--h:21px"></i><i data-hf-id="hf-fdva" style="--h:29px"></i><i data-hf-id="hf-46kz" style="--h:24px"></i><i data-hf-id="hf-5khz" style="--h:15px"></i>
                  </span>
                </div>
              </div>
            </div>
          </div>

          <nav data-hf-id="hf-gxlw" class="quick-actions" aria-label="Quick actions">
            <button data-hf-id="hf-g508"><span data-hf-id="hf-uvwe" class="ico">✎</span>Write</button>
            <button data-hf-id="hf-o1y9"><span data-hf-id="hf-1lmh" class="ico">◇</span>Learn</button>
            <button data-hf-id="hf-1ghk"><span data-hf-id="hf-3xye" class="ico">‹/›</span>Code</button>
            <button data-hf-id="hf-fbk1"><span data-hf-id="hf-x6ve" class="ico drive">▲</span>From Drive</button>
            <button data-hf-id="hf-cog9"><span data-hf-id="hf-jlp3" class="ico calendar">▣</span>From Calendar</button>
          </nav>
        </section>
      </main>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};

    const copy = "Plan a bold launch for tomorrow";
    const words = copy.split(" ");
    const typedLine = document.getElementById("typed-line");
    const chars = [];
    let globalIndex = 0;

    words.forEach((word, wordIndex) => {
      const wordSpan = document.createElement("span");
      wordSpan.className = "word";
      wordSpan.id = `word-${word.toLowerCase()}`;
      for (const letter of word) {
        const char = document.createElement("span");
        char.className = "char";
        char.textContent = letter;
        char.dataset.index = String(globalIndex++);
        wordSpan.appendChild(char);
        chars.push(char);
      }
      typedLine.appendChild(wordSpan);
      if (wordIndex < words.length - 1) {
        const space = document.createElement("span");
        space.className = "char space";
        space.innerHTML = "&nbsp;";
        space.dataset.index = String(globalIndex++);
        typedLine.appendChild(space);
        chars.push(space);
      }
    });

    const caret = document.getElementById("caret");
    const origin = typedLine.getBoundingClientRect().left;
    const caretPositions = [0];
    chars.forEach((char) => caretPositions.push(char.getBoundingClientRect().right - origin + 4));

    const tl = gsap.timeline({ paused: true });
    gsap.set(chars, { opacity: 0 });
    gsap.set(caret, { opacity: 0, x: 0 });
    gsap.set("#word-bold", { scale: 1 });

    tl.to("#placeholder", { opacity: 0, duration: .18, ease: "power2.out" }, .5)
      .to("#world", { scale: 3.2, x: 960, y: 505, duration: .55, ease: "power2.inOut" }, .55)
      .to(caret, { opacity: 1, duration: .06, ease: "power1.out" }, 1.1);

    const milestones = [
      { start: 1.18, end: 1.41, count: 4 },
      { start: 1.45, end: 1.55, count: 6 },
      { start: 1.59, end: 1.81, count: 11 },
      { start: 1.87, end: 2.21, count: 18 },
      { start: 2.21, end: 2.26, count: 19 },
      { start: 2.30, end: 2.49, count: 22 },
      { start: 2.55, end: 3.01, count: 31 }
    ];

    let priorCount = 0;
    milestones.forEach((segment) => {
      const additions = segment.count - priorCount;
      for (let i = 0; i < additions; i++) {
        const index = priorCount + i;
        const at = additions === 1
          ? segment.end
          : segment.start + ((segment.end - segment.start) * i / (additions - 1));
        tl.to(chars[index], { opacity: 1, duration: .045, ease: "power1.out" }, at)
          .to(caret, { x: caretPositions[index + 1], duration: .065, ease: "power1.out" }, at);
      }
      priorCount = segment.count;
    });

    tl.to("#world", { x: 250, duration: 1.83, ease: "power1.inOut" }, 1.18)
      .to("#word-bold", { scale: 1.03, duration: .1, ease: "power2.out" }, 1.81)
      .to("#word-bold", { scale: 1, duration: .12, ease: "power2.inOut" }, 1.92)
      .to("#world", { scale: 1.15, x: -70, y: 35, duration: 1, ease: "power2.inOut" }, 5.8)
      .to("#world", { scale: 1.1, opacity: 0, duration: .6, ease: "power2.in" }, 7.4);

    window.__timelines["typing-zoom-motion"] = tl;
    tl.seek(0);
  </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var timelines=window.__timelines||{};var ids=Object.keys(timelines);if(!ids.length){setTimeout(play,150);return;}ids.forEach(function(id){var timeline=timelines[id];timeline.eventCallback("onComplete",function(){setTimeout(play,1200)});timeline.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
