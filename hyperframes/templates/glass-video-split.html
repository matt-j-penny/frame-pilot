<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f5f3ee;
        font-family: "Satoshi", Arial, sans-serif;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f5f3ee;
      }

      .clip {
        position: absolute;
      }

      #mesh {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }

      .glass-panel {
        position: absolute;
        top: 80px;
        left: 120px;
        width: 1035px;
        height: 920px;
        padding: 40px 48px;
        border-radius: 34px;
        background: rgba(255, 255, 255, 0.035);
        backdrop-filter: blur(7px) saturate(130%);
        -webkit-backdrop-filter: blur(7px) saturate(130%);
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow:
          0 18px 60px rgba(76, 29, 149, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.24);
        z-index: 2;
        color: #17121f;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .eyebrow {
        font-family: "Satoshi", Arial, sans-serif;
        font-size: 24px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0;
        color: #7c3aed;
        text-transform: uppercase;
        margin-bottom: 28px;
      }

      .glass-title {
        max-width: 850px;
        font-family: "Cabinet Grotesk", "Satoshi", Arial, sans-serif;
        font-size: 78px;
        font-weight: 800;
        line-height: 0.98;
        letter-spacing: 0;
        color: #17121f;
        margin-bottom: 50px;
      }

      .point-list {
        display: grid;
        gap: 22px;
      }

      .point {
        display: grid;
        grid-template-columns: 54px 1fr;
        align-items: center;
        gap: 18px;
      }

      .point-marker {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(124, 58, 237, 0.12);
        border: 1px solid rgba(124, 58, 237, 0.28);
        color: #7c3aed;
        font-size: 25px;
        font-weight: 800;
        line-height: 1;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }

      .point-text {
        font-size: 38px;
        font-weight: 700;
        line-height: 1.12;
        letter-spacing: 0;
        color: rgba(23, 18, 31, 0.88);
      }

      .phone-frame {
        position: absolute;
        top: 80px;
        left: 1282.5px;
        width: 517.5px;
        height: 920px;
        overflow: hidden;
        border-radius: 44px;
        background: #000;
        box-shadow:
          0 34px 90px rgba(34, 12, 84, 0.24),
          0 14px 34px rgba(26, 15, 46, 0.2),
          inset 0 0 0 1px rgba(255, 255, 255, 0.16);
        z-index: 3;
      }

      .source-video {
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        background: #000;
      }

      .edit-overlay-layer {
        pointer-events: none;
        inset: 0;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32.1"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="mesh" aria-hidden="true"></canvas>

      <div id="glass-panel" class="glass-panel">
        <div id="eyebrow" class="eyebrow">Intro Cut Test</div>
        <div id="glass-title" class="glass-title">Turn a raw clip into a polished short.</div>
        <div class="point-list">
          <div id="point-1" class="point">
            <div class="point-marker">1</div>
            <div class="point-text">Crop the speaker into a vertical frame.</div>
          </div>
          <div id="point-2" class="point">
            <div class="point-marker">2</div>
            <div class="point-text">Keep the background clean and premium.</div>
          </div>
          <div id="point-3" class="point">
            <div class="point-marker">3</div>
            <div class="point-text">Add room for captions, notes, or prompts.</div>
          </div>
        </div>
      </div>

      <div id="phone-frame" class="phone-frame">
        <video
          id="source-video"
          class="clip source-video"
          src="assets/placeholder-video.mp4"
          poster="assets/talking-head-placeholder.png"
          data-start="0"
          data-duration="32.1"
          data-track-index="1"
          muted
          playsinline
          preload="auto"
        ></video>
      </div>
      <audio
        id="source-audio"
        class="clip"
        src="assets/placeholder-video.mp4"
        data-start="0"
        data-duration="32.1"
        data-track-index="2"
        preload="auto"
      ></audio>

      <div
        id="edit-overlay-layer"
        class="clip edit-overlay-layer"
        data-start="0"
        data-duration="32.1"
        data-track-index="3"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CLIP_DURATION = 32.1;
      const tl = gsap.timeline({ paused: true });
      const splitFrame = {
        top: 80,
        left: 1282.5,
        width: 517.5,
        height: 920,
        borderRadius: 44,
        boxShadow:
          "0 34px 90px rgba(34, 12, 84, 0.24), 0 14px 34px rgba(26, 15, 46, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.16)",
      };

      gsap.set("#phone-frame", {
        top: 0,
        left: 0,
        width: 1920,
        height: 1080,
        borderRadius: 0,
        boxShadow: "0 0 0 rgba(0, 0, 0, 0)",
      });
      gsap.set("#glass-panel", { autoAlpha: 0, x: -36 });
      gsap.set("#eyebrow, #glass-title, #point-1, #point-2, #point-3", { opacity: 0, y: 24 });
      gsap.set("#point-1 .point-marker, #point-2 .point-marker, #point-3 .point-marker", { scale: 0.72 });

      tl.to(
        "#phone-frame",
        {
          ...splitFrame,
          duration: 0.95,
          ease: "expo.inOut",
        },
        2.0,
      );
      tl.to("#glass-panel", { autoAlpha: 1, x: 0, duration: 0.58, ease: "power2.out" }, 2.48);
      tl.to("#eyebrow", { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" }, 2.78);
      tl.to("#glass-title", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.94);
      tl.to(
        "#point-1, #point-2, #point-3",
        { opacity: 1, y: 0, duration: 0.44, stagger: 0.16, ease: "power2.out" },
        3.34,
      );
      tl.to(
        "#point-1 .point-marker, #point-2 .point-marker, #point-3 .point-marker",
        { scale: 1, duration: 0.42, stagger: 0.16, ease: "back.out(1.8)" },
        3.34,
      );
      tl.to("#glass-panel", { autoAlpha: 0, x: -36, duration: 0.48, ease: "power2.in" }, 12.4);
      tl.to(
        "#phone-frame",
        {
          top: 0,
          left: 0,
          width: 1920,
          height: 1080,
          borderRadius: 0,
          boxShadow: "0 0 0 rgba(0, 0, 0, 0)",
          duration: 0.95,
          ease: "expo.inOut",
        },
        12.72,
      );

      window.__timelines["main"] = tl;

      (() => {
        const canvas = document.getElementById("mesh");
        const ctx = canvas.getContext("2d");
        const W = 1920;
        const H = 1080;
        const dpr = window.devicePixelRatio || 1;
        const target = 80;
        const cols = Math.ceil(W / target) + 2;
        const rows = Math.ceil(H / target) + 2;
        const cellW = W / (cols - 2);
        const cellH = H / (rows - 2);
        const points = [];
        const edges = [];
        let seed = 7421;

        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        function rand(min, max) {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return min + (seed / 4294967296) * (max - min);
        }

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const baseX = (c - 1) * cellW;
            const baseY = (r - 1) * cellH;
            const px = baseX + rand(-cellW * 0.35, cellW * 0.35);
            const py = baseY + rand(-cellH * 0.35, cellH * 0.35);
            const field =
              Math.sin(px * 0.0042 + 1.3) * Math.cos(py * 0.0051 - 0.7) +
              Math.sin(px * 0.0019 - 0.4) * Math.cos(py * 0.0023 + 2.1) * 0.8;
            let tier = 0;
            if (field > 0.85) tier = 2;
            else if (field > 0.25) tier = 1;
            points.push({
              x0: px,
              y0: py,
              phaseX: rand(0, Math.PI * 2),
              phaseY: rand(0, Math.PI * 2),
              ampX: rand(12, 34),
              ampY: rand(10, 30),
              freq: rand(0.85, 1.75),
              tier,
            });
          }
        }

        const idx = (c, r) => r * cols + c;
        const seen = new Set();
        function addEdge(a, b) {
          const key = a < b ? a + ":" + b : b + ":" + a;
          if (seen.has(key)) return;
          seen.add(key);
          const tier = Math.min(points[a].tier, points[b].tier);
          const thickness = tier === 2 ? rand(2.4, 3.2) : tier === 1 ? rand(1.2, 1.7) : rand(0.4, 0.8);
          edges.push({
            a,
            b,
            thickness,
            tier,
            weightPhase: rand(0, Math.PI * 2),
            weightFreq: rand(0.35, 0.9),
            weightBias: rand(-0.15, 0.15),
            pulsePhase: rand(0, Math.PI * 2),
            pulseFreq: rand(0.9, 2.1),
            pulseAmp: rand(0.22, 0.68),
          });
        }

        for (let r = 0; r < rows - 1; r++) {
          for (let c = 0; c < cols - 1; c++) {
            const tlp = idx(c, r);
            const trp = idx(c + 1, r);
            const blp = idx(c, r + 1);
            const brp = idx(c + 1, r + 1);
            addEdge(tlp, trp);
            addEdge(trp, brp);
            addEdge(tlp, brp);
            addEdge(brp, blp);
            addEdge(blp, tlp);
          }
        }
        edges.sort((a, b) => a.thickness - b.thickness);

        const purple = { r: 124, g: 58, b: 237 };

        function drawMesh(t) {
          ctx.clearRect(0, 0, W, H);
          const pos = points.map((point) => ({
            x: point.x0 + Math.sin(t * point.freq + point.phaseX) * point.ampX,
            y: point.y0 + Math.cos(t * point.freq + point.phaseY) * point.ampY,
          }));
          const globalPulse = 0.85 + Math.sin(t * 0.6) * 0.15;

          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          for (const edge of edges) {
            const pa = pos[edge.a];
            const pb = pos[edge.b];
            const midpointX = (pa.x + pb.x) * 0.5;
            const midpointY = (pa.y + pb.y) * 0.5;
            const driftField =
              Math.sin(midpointX * 0.006 + t * edge.weightFreq + edge.weightPhase) +
              Math.cos(midpointY * 0.007 - t * (edge.weightFreq * 1.35) + edge.weightPhase * 0.7);
            const tierLift = driftField + edge.weightBias > 0.62 ? 1.85 : driftField + edge.weightBias > 0.06 ? 1.28 : 0.72;
            const pulse = 1 + Math.sin(t * edge.pulseFreq + edge.pulsePhase) * edge.pulseAmp;
            const animatedWidth = edge.thickness * pulse * tierLift;
            const alpha = Math.min(0.95, (0.28 + animatedWidth * 0.12) * globalPulse);
            ctx.strokeStyle = `rgba(${purple.r},${purple.g},${purple.b},${alpha})`;
            ctx.lineWidth = animatedWidth;
            ctx.beginPath();
            ctx.moveTo(pa.x, pa.y);
            ctx.lineTo(pb.x, pb.y);
            ctx.stroke();
          }
        }

        drawMesh(0);
        const meshState = { time: 0 };
        tl.to(
          meshState,
          {
            time: CLIP_DURATION,
            duration: CLIP_DURATION,
            ease: "none",
            onUpdate: () => drawMesh(meshState.time),
          },
          0,
        );
      })();
    </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
