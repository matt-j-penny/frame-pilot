<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin="">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800&display=swap" rel="stylesheet">
  <script src="vendor/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }

    /* Transparent overlay — source video should be blurred in the parent composition */
    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clip { position: absolute; }

    /* REPLACE: word text below. Change font-size to fit longer words. */
    .stamp-word {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 320px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.04em;
      line-height: 1;
      text-transform: uppercase;
      text-shadow:
        0 4px 20px rgba(0,0,0,0.5),
        0 12px 60px rgba(0,0,0,0.4);
      will-change: transform, opacity;
    }

    /* Optional: red variant for negative stamps */
    .stamp-word.red  { color: #ef4444; }
    /* Optional: green variant for positive stamps */
    .stamp-word.green { color: #10b981; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="mg-wrong-stamp" data-start="0" data-duration="2" data-width="1920" data-height="1080">

    <!-- REPLACE: word text. Use class="stamp-word red" or "stamp-word green" for colour variants. -->
    <div class="stamp-word" id="stamp">WRONG</div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.set('#stamp', { opacity: 0, scale: 0.92 }, 0);
    tl.to('#stamp', { opacity: 1, scale: 1,    duration: 0.35, ease: 'power3.out',  transformOrigin: 'center center' }, 0.1);
    tl.to('#stamp', { opacity: 0, scale: 1.04, duration: 0.25, ease: 'power2.in',   transformOrigin: 'center center' }, 1.6);

    window.__timelines['mg-wrong-stamp'] = tl;
  </script>
<!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
