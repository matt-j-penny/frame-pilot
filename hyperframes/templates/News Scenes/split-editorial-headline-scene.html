<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
      .split-scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        font-family: "Cabinet Grotesk", "Satoshi", system-ui, sans-serif;
      }
      .half {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 8%;
        text-align: center;
      }
      .half.top {
        background: #000;
        color: #fff;
      }
      .half.bottom {
        background: #fff;
        color: #1a1a2e;
      }
      .headline {
        font-size: 96px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.05;
        margin: 0;
        max-width: 1680px;
      }
      .subheadline {
        font-family: "Satoshi", "Cabinet Grotesk", sans-serif;
        font-size: 52px;
        font-weight: 400;
        letter-spacing: 0.01em;
        line-height: 1.3;
        margin: 0;
        max-width: 1400px;
        color: #000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="split-editorial-headline-scene"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="split-scene" class="split-scene">
        <div class="half top">
          <h1 id="headline" class="headline">headline here</h1>
        </div>
        <div class="half bottom">
          <p id="subheadline" class="subheadline">sub headline here</p>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const CLIP_DURATION = 8;
      const tl = gsap.timeline({ paused: true });

      gsap.set("#headline", { opacity: 0, y: 48 });
      gsap.set("#subheadline", { opacity: 0, y: 36 });

      tl.to(
        "#headline",
        {
          opacity: 1,
          y: 0,
          duration: 0.95,
          ease: "power3.out",
        },
        0,
      );
      tl.to(
        "#subheadline",
        {
          opacity: 1,
          y: 0,
          duration: 0.8,
          ease: "power3.out",
        },
        0.5,
      );

      const animEnd = Math.max(0.95, 0.5 + 0.8);
      const holdDur = Math.max(0, CLIP_DURATION - animEnd);
      tl.to(
        { __hold: 0 },
        {
          __hold: 1,
          duration: holdDur,
          ease: "none",
        },
        animEnd,
      );

      window.__timelines["split-editorial-headline-scene"] = tl;
    </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
