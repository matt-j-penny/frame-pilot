<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Angled diagonal split — two-tone headline card</title>
    <script src="../vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fff;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
      .scene {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .half {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      .top {
        background: #ff8a5c;
        clip-path: polygon(0 0, 100% 0, 100% 17.65%, 0 82.35%);
      }
      .bottom {
        background: #3da9e0;
        clip-path: polygon(0 82.35%, 100% 17.65%, 100% 100%, 0 100%);
      }
      /* Match coral / blue polygons so headline sits only on orange, sub only on blue */
      .text-zone {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 10%;
        pointer-events: none;
      }
      .text-zone--top {
        clip-path: polygon(0 0, 100% 0, 100% 17.65%, 0 82.35%);
      }
      .text-zone--bottom {
        clip-path: polygon(0 82.35%, 100% 17.65%, 100% 100%, 0 100%);
      }
      .text-zone-inner {
        text-align: center;
        color: #fff;
        transform: rotate(-20deg);
        max-width: 100%;
      }
      .headline,
      .subheadline {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.35em;
      }
      .headline .word,
      .subheadline .word {
        display: inline-block;
        opacity: 0;
        transform: translateY(1.25rem);
      }
      .headline {
        font-size: clamp(2rem, 5.2vw, 5.2rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
        margin: 0;
      }
      .subheadline {
        font-size: clamp(2.25rem, 4.25vw, 4.25rem);
        font-weight: 300;
        letter-spacing: 0.01em;
        line-height: 1.3;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="angled-diagonal-split-headline-scene"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div class="scene">
        <div class="half top"></div>
        <div class="half bottom"></div>
        <div class="text-zone text-zone--top">
          <div class="text-zone-inner">
            <h1 class="headline">
              <span class="word">Headline</span>
              <span class="word">here</span>
            </h1>
          </div>
        </div>
        <div class="text-zone text-zone--bottom">
          <div class="text-zone-inner">
            <p class="subheadline">
              <span class="word">Sub</span>
              <span class="word">headline</span>
              <span class="word">here</span>
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      gsap.set(".half.top", { yPercent: -105 });
      gsap.set(".half.bottom", { yPercent: 105 });

      const CLIP_DURATION = 5;
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      tl.to(".half.top", { yPercent: 0, duration: 1.1 }, 0)
        .to(".half.bottom", { yPercent: 0, duration: 1.1 }, 0)
        .to(
          ".headline .word",
          {
            opacity: 1,
            y: 0,
            duration: 0.42,
            stagger: 0.09,
            ease: "power2.out",
          },
          "+=0.15",
        )
        .to(
          ".subheadline .word",
          {
            opacity: 0.9,
            y: 0,
            duration: 0.42,
            stagger: 0.09,
            ease: "power2.out",
          },
          "+=0.2",
        );

      const animEnd = 1.1 + 0.15 + 0.09 + 0.42 + 0.2 + 0.18 + 0.42;
      const holdDur = Math.max(0, CLIP_DURATION - animEnd);
      tl.to(
        { __hold: 0 },
        { __hold: 1, duration: holdDur, ease: "none" },
        animEnd,
      );

      window.__timelines["angled-diagonal-split-headline-scene"] = tl;
    </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
