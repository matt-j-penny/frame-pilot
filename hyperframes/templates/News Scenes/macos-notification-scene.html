<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=block"
      rel="stylesheet"
    />
    <script src="../vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
        font-family: "Inter", sans-serif;
      }

      #root {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        position: relative;
        background: #ffffff;
      }

      #root .camera-pan {
        width: 1920px;
        height: 1080px;
        position: relative;
        will-change: transform;
      }

      #root .camera-layer {
        width: 1920px;
        height: 1080px;
        position: relative;
        background: #ffffff;
        will-change: transform;
      }

      #root .notification-card {
        position: absolute;
        top: 24px;
        right: 24px;
        width: 380px;
        background: rgba(30, 30, 30, 0.82);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border-radius: 16px;
        padding: 16px;
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.4),
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.1);
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }

      #root .app-icon {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        flex-shrink: 0;
        overflow: hidden;
      }

      #root .app-icon svg {
        width: 36px;
        height: 36px;
        display: block;
      }

      #root .notification-content {
        flex: 1;
        min-width: 0;
      }

      #root .notification-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2px;
      }

      #root .app-name {
        font-size: 13px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }

      #root .time-label {
        font-size: 13px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.35);
      }

      #root .notification-title {
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        line-height: 1.3;
        margin-bottom: 2px;
      }

      #root .notification-body {
        font-size: 13px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.6);
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>
  <body>

    <script>
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });
      var pan = document.getElementById("camera-pan");
      var camera = document.getElementById("camera");
      var notification = document.getElementById("notification");

      var cx = notification.offsetLeft + notification.offsetWidth / 2;
      var cy = notification.offsetTop + notification.offsetHeight / 2;

      var margin = 48;
      var fullZoom = (1920 - margin) / 380;
      var slideX = 420 / fullZoom;

      var panX = 960 - cx;
      var panY = 540 - cy;

      gsap.set(pan, { x: panX, y: panY });
      gsap.set(camera, {
        scale: 0.36,
        transformOrigin: cx + "px " + cy + "px",
      });

      gsap.set(notification, { x: slideX, opacity: 0 });

      tl.to(
        camera,
        {
          scale: fullZoom,
          duration: 0.45,
          ease: "power4.in",
        },
        0,
      );

      tl.to(
        notification,
        {
          x: 0,
          opacity: 1,
          duration: 0.5,
          ease: "power3.out",
        },
        0.4,
      );

      tl.to(
        notification,
        {
          x: slideX,
          opacity: 0,
          duration: 0.3,
          ease: "power3.in",
        },
        4.2,
      );

      window.__timelines["macos-notification-scene"] = tl;
    </script>
