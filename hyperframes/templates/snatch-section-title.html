<!DOCTYPE html>
<html lang="en" data-composition-variables="[
    {&quot;id&quot;:&quot;title&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Section title (use | for line break)&quot;,&quot;default&quot;:&quot;Why Your Job Isn’t|Already Optional&quot;},
    {&quot;id&quot;:&quot;icon&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Icon image&quot;,&quot;default&quot;:&quot;assets/snatched/icon-chat.svg&quot;},
    {&quot;id&quot;:&quot;bgColor&quot;,&quot;type&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Background&quot;,&quot;default&quot;:&quot;#f8f6f3&quot;},
    {&quot;id&quot;:&quot;swooshColor&quot;,&quot;type&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Swoosh&quot;,&quot;default&quot;:&quot;#ece6e2&quot;},
    {&quot;id&quot;:&quot;inkColor&quot;,&quot;type&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Ink&quot;,&quot;default&quot;:&quot;#111111&quot;}
  ]">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script>
      window.__timelines = window.__timelines || {};
      if (!window.__hyperframes) {
        const decl = JSON.parse(document.documentElement.getAttribute("data-composition-variables") || "[]");
        const vals = Object.fromEntries(decl.map((d) => [d.id, d.default]));
        decl.forEach((d) => document.documentElement.style.setProperty("--" + d.id, d.default));
        window.__hyperframes = { getVariables: () => vals };
      }
    </script>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces.ttf") format("truetype"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; }
      #card { position: absolute; inset: 0; background: var(--bgColor); color: var(--inkColor); opacity: 0; }
      #swoosh { position: absolute; inset: 0; }
      #swoosh path { fill: var(--swooshColor); }
      #tile { position: absolute; left: 828px; top: 246px; width: 264px; height: 264px; border-radius: 58px; background: #fff;
        box-shadow: 0 8px 30px rgba(0,0,0,.10); display: flex; align-items: center; justify-content: center; opacity: 0; }
      #tile img { width: 62%; height: 62%; }
      #title { position: absolute; left: 0; right: 0; top: 580px; text-align: center; font-family: "Fraunces", serif;
        font-weight: 800; font-size: 118px; line-height: 1.13; letter-spacing: -0.01em; font-variation-settings: "opsz" 24, "SOFT" 50; }
      .w { display: inline-block; margin: 0 0.12em; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.2" data-width="1920" data-height="1080">
      <div id="card">
        <svg id="swoosh" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <path d="M0 760 C 420 640, 820 900, 1200 760 C 1500 650, 1700 300, 1920 220 L 1920 420 C 1700 520, 1500 880, 1150 980 C 800 1080, 400 860, 0 980 Z" />
        </svg>
        <div id="tile"><img data-var-src="icon" src="assets/snatched/icon-chat.svg" alt=""></div>
        <div id="title"></div>
      </div>
    </div>
    <script>
      const { title } = window.__hyperframes.getVariables();
      const box = document.getElementById("title");
      const words = [];
      title.split("|").forEach((line, i) => {
        if (i) box.appendChild(document.createElement("br"));
        line.trim().split(/\s+/).forEach((t) => {
          const s = document.createElement("span");
          s.className = "w";
          s.textContent = t;
          box.appendChild(s);
          words.push(s);
        });
      });
      const tilt = [-6, 4, -3, 5, -4, 3, -5, 4];

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { opacity: 0, filter: "blur(12px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, 0);
      tl.fromTo("#swoosh", { x: -80 }, { x: 0, duration: 3.2, ease: "none" }, 0);
      tl.fromTo("#tile", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(1.6)" }, 0.3);
      words.forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, y: 40, rotation: tilt[i % tilt.length], filter: "blur(10px)" },
          { opacity: 1, y: 0, rotation: 0, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, 0.4 + i * 0.07);
      });
      tl.to("#card", { y: 1080, filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, 2.75);
      window.__timelines["main"] = tl;
    </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
