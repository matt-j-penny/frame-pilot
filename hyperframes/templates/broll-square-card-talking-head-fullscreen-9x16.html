<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>B-Roll Square Card — Talking Head — Fullscreen — 9:16</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f5f5f3;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* ── FULLSCREEN: dot-grid canvas with centred square b-roll card ── */
      #broll-zone {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 96px;
        background: #f5f5f3;
        z-index: 2;
        will-change: transform, opacity;
      }

      #dot-grid {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
      }

      #broll-card-motion {
        position: relative;
        width: 820px;
        height: 820px;
        z-index: 2;
        will-change: transform;
      }

      #broll-card {
        position: relative;
        width: 820px;
        height: 820px;
        padding: 18px;
        overflow: hidden;
        border: 8px solid #7c3aed;
        border-radius: 42px;
        background: #ffffff;
        box-shadow:
          0 42px 100px rgba(76, 29, 149, 0.24),
          0 16px 36px rgba(17, 16, 21, 0.15),
          0 3px 10px rgba(17, 16, 21, 0.1);
        z-index: 2;
        will-change: transform, opacity;
      }

      #broll-card::after {
        content: "";
        position: absolute;
        inset: 18px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 25px;
        pointer-events: none;
        z-index: 2;
      }

      #broll-card video {
        position: relative;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        border-radius: 24px;
        will-change: transform;
      }

      /* ── UNDERLAY: talking head revealed after fullscreen card exits ── */
      #talking-head {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0f;
        z-index: 1;
      }

      #talking-head video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="broll-square-card-talking-head-fullscreen-9x16"
      data-start="0"
      data-duration="6.2"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- REPLACE: swap src for the b-roll clip that matches what's being said.
           Source it from `Assets/Videos & Images/` — either picked by hand, or later
           auto-selected by matching the spoken transcript against
           `Assets/Videos & Images/media-dictionary.json`. Placeholder shown for now. -->
      <div id="broll-zone" data-layout-allow-overflow>
        <svg id="dot-grid" width="1080" height="1920" aria-hidden="true"></svg>
        <div id="broll-card-motion">
          <div id="broll-card">
            <video
              id="broll-video"
              class="clip"
              src="assets/broll-ai-data-network-placeholder.mp4"
              muted
              playsinline
              preload="auto"
              data-start="0"
              data-duration="5.4"
              data-track-index="1"
            ></video>
          </div>
        </div>
      </div>

      <!-- REPLACE: swap src/poster for your own talking-head footage -->
      <div id="talking-head">
        <video
          id="source-video"
          class="clip"
          src="assets/placeholder-video.mp4"
          poster="assets/talking-head-placeholder.png"
          muted
          playsinline
          preload="auto"
          data-start="0"
          data-duration="6.2"
          data-track-index="0"
        ></video>
      </div>
    </div>

    <script>
      const svg = document.getElementById("dot-grid");
      const DOT_SPACING = 40;
      const DOT_RADIUS = 2;
      const cols = Math.ceil(1080 / DOT_SPACING) + 1;
      const rows = Math.ceil(1920 / DOT_SPACING) + 1;
      let dots = "";
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          dots += `<circle cx="${col * DOT_SPACING}" cy="${row * DOT_SPACING}" r="${DOT_RADIUS}" fill="#cccccc" opacity="0.55"/>`;
        }
      }
      svg.innerHTML = dots;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#broll-zone", { autoAlpha: 1, y: -1920 });
      gsap.set("#broll-card", { autoAlpha: 0, y: 64, scale: 0.9 });

      tl.to("#broll-zone", { autoAlpha: 1, y: 0, duration: 0.74, ease: "expo.out" }, 0.12);
      tl.to("#broll-card", { autoAlpha: 1, y: 0, scale: 1, duration: 0.72, ease: "expo.out" }, 0.28);

      // Scale the complete framed unit so the video, inset, border, and shadow expand together.
      tl.fromTo("#broll-card-motion", { scale: 1 }, { scale: 1.08, duration: 5.4, ease: "none" }, 0.28);

      // Exit the card first, then lift the fullscreen dot-grid canvas to reveal the speaker.
      const exitStart = 4.9;
      tl.to("#broll-card", { autoAlpha: 0, y: -38, scale: 0.96, duration: 0.42, ease: "power3.in" }, 4.66);
      tl.to("#broll-zone", { autoAlpha: 1, y: -1920, duration: 0.62, ease: "power3.in" }, exitStart);

      window.__timelines["broll-square-card-talking-head-fullscreen-9x16"] = tl;
    </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
