<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Lower Third Purple Outline Dot Card — One Word — 9:16</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Satoshi";
        src: url("assets/fonts/Satoshi-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }

      @font-face {
        font-family: "Cabinet Grotesk";
        src: url("assets/fonts/CabinetGrotesk-ExtraBold.woff2") format("woff2");
        font-weight: 800;
        font-style: normal;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fafafa;
      }

      #ltod-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fafafa;
      }

      #ltod-video-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #f3f0ff;
      }

      #ltod-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #ltod-card-shell {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 279px;
        height: 190px;
        z-index: 3;
        filter: drop-shadow(0 24px 42px rgba(124, 58, 237, 0.2));
        transform-origin: 50% 100%;
      }

      #ltod-card {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        align-items: center;
        padding: 20px 72px;
        border: 6px solid #7c3aed;
        border-radius: 24px;
        background: #ffffff;
      }

      #ltod-dot-grid {
        position: absolute;
        inset: -32px;
        width: calc(100% + 64px);
        height: calc(100% + 64px);
        pointer-events: none;
      }

      #ltod-copy {
        position: relative;
        z-index: 2;
        width: 100%;
        text-align: center;
        color: #1a1a2e;
      }

      #ltod-message {
        display: block;
        max-width: 790px;
        margin: 0 auto;
        font-family: "Cabinet Grotesk", sans-serif;
        font-size: 112px;
        font-weight: 800;
        line-height: 1.06;
        letter-spacing: -0.025em;
        color: #1a1a2e;
      }
    </style>
  </head>
  <body>
    <div
      id="ltod-root"
      data-composition-id="lower-third-purple-outline-dot-card-one-word-9x16"
      data-start="0"
      data-duration="5"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- REPLACE: swap src/poster for the portrait footage this lower third should sit over. -->
      <div id="ltod-video-wrap">
        <video
          id="ltod-video"
          class="clip"
          src="assets/placeholder-video.mp4"
          poster="assets/talking-head-placeholder.png"
          muted
          playsinline
          preload="auto"
          data-start="0"
          data-duration="5"
          data-track-index="0"
        ></video>
      </div>

      <div
        id="ltod-card-shell"
        class="clip"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-layout-allow-overflow
      >
        <div id="ltod-card">
          <svg id="ltod-dot-grid" aria-hidden="true"></svg>
          <div id="ltod-copy">
            <!-- REPLACE: edit MESSAGE in the script below. -->
            <span id="ltod-message"></span>
          </div>
        </div>
      </div>
    </div>

    <script>
      const MESSAGE = "CLARITY";

      document.getElementById("ltod-message").textContent = MESSAGE;

      const dotGrid = document.getElementById("ltod-dot-grid");
      const DOT_SPACING = 40;
      const DOT_RADIUS = 2;
      const GRID_WIDTH = 1080;
      const GRID_HEIGHT = 440;
      let dots = "";

      for (let row = 0; row <= Math.ceil(GRID_HEIGHT / DOT_SPACING); row++) {
        for (let col = 0; col <= Math.ceil(GRID_WIDTH / DOT_SPACING); col++) {
          dots += `<circle cx="${col * DOT_SPACING}" cy="${row * DOT_SPACING}" r="${DOT_RADIUS}" fill="#a78bfa" opacity="0.36"/>`;
        }
      }

      dotGrid.setAttribute("viewBox", `0 0 ${GRID_WIDTH} ${GRID_HEIGHT}`);
      dotGrid.innerHTML = dots;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#ltod-card-shell",
        { y: 140, scale: 0.96, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" },
        0.14
      );
      tl.fromTo(
        "#ltod-dot-grid",
        { opacity: 0, x: -20 },
        { opacity: 1, x: 0, duration: 0.38, ease: "power2.out" },
        0.24
      );
      tl.fromTo(
        "#ltod-message",
        { y: 42, opacity: 0, filter: "blur(6px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.48, ease: "power3.out" },
        0.43
      );

      tl.to(
        "#ltod-dot-grid",
        { x: 20, duration: 2.6, ease: "power2.inOut" },
        0.62
      );

      tl.to(
        "#ltod-message",
        { y: 24, opacity: 0, duration: 0.34, ease: "power2.in" },
        3.94
      );
      tl.to(
        "#ltod-card-shell",
        { y: 120, scale: 0.97, opacity: 0, duration: 0.38, ease: "power3.in" },
        4.18
      );
      tl.set("#ltod-card-shell", { opacity: 0 }, 4.56);

      window.__timelines["lower-third-purple-outline-dot-card-one-word-9x16"] = tl;
    </script>
    <!-- hf-autoplay -->
    <script>
      (function () {
        if (window.self === window.top) return;
        function play() {
          const timelines = window.__timelines || {};
          const keys = Object.keys(timelines);
          if (!keys.length) {
            setTimeout(play, 150);
            return;
          }
          keys.forEach(function (id) {
            const timeline = timelines[id];
            timeline.eventCallback("onComplete", function () {
              setTimeout(play, 1200);
            });
            timeline.restart();
          });
        }
        setTimeout(play, 200);
      })();
    </script>
  </body>
</html>
