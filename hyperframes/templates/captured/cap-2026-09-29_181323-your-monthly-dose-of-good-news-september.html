<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share of Electricity Production From Solar in June</title>
<script src="../vendor/gsap.min.js"></script>
<style>
  :root {
    --bg: #262e26;
    --green: #62f480;
    --ghost: #2f5237;
    --line: rgba(225, 235, 225, 0.85);
    --grid: rgba(225, 235, 225, 0.55);
    --text: #f4f6f2;
    --dim: rgba(244, 246, 242, 0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  #root {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    font-family: "Satoshi", "Figtree", "Outfit", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse 75% 70% at 50% 45%, #2e382e 0%, #262e26 60%, #1c221c 100%);
  }
  .scene { position: absolute; inset: 0; }

  #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }

  .title {
    position: absolute; left: 0; right: 0; top: 108px; text-align: center;
    font-size: 40px; font-weight: 700; letter-spacing: -0.2px;
  }
  .title span { display: inline-block; margin: 0 5px; }

  .frame {
    position: absolute; left: 392px; top: 234px; width: 1134px; height: 722px;
    border: 3px solid var(--line); border-radius: 14px;
  }
  .grid {
    position: absolute; left: 0; right: 0; height: 0;
    border-top: 2px dashed var(--grid);
  }

  .ylab {
    position: absolute; width: 60px; left: 330px; text-align: center;
    font-size: 20px; font-weight: 700; line-height: 1; margin-top: -10px;
  }

  .xlab {
    position: absolute; top: 974px; width: 100px; margin-left: -50px; text-align: center;
    font-size: 20px; font-weight: 700; line-height: 1.2;
  }
  .xlab .yr { display: block; }

  .bar {
    position: absolute; bottom: 126px; width: 56px; margin-left: -28px;
    transform-origin: 50% 100%;
  }
  .bar.ghost { background: var(--ghost); }
  .bar.fill { background: var(--green); }

  .callout { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .pill {
    position: absolute; height: 42px; border-radius: 11px;
    background: #fbfcfa; color: #1d231d;
    font-size: 27px; font-weight: 700; line-height: 42px; text-align: center;
    white-space: nowrap; overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .pill.v { translate: -50% -50%; }
  .pill.h { translate: 0 -50%; }
  .stem { position: absolute; background: #fbfcfa; }
  .stem.v { width: 3px; margin-left: -1.5px; transform-origin: 50% 0; }
  .stem.h { height: 3px; margin-top: -1.5px; transform-origin: 0 50%; }
  .dot {
    position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
    background: #fbfcfa; border: 3px solid #3a403a;
  }

  .logo { position: absolute; right: 44px; top: 44px; width: 76px; height: 106px; }
  .credit { position: absolute; left: 10px; bottom: 12px; font-size: 14px; font-weight: 600; letter-spacing: 0.5px; opacity: 0.85; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="15.08" data-start="0">
  <div class="scene clip" data-start="0" data-duration="15.08">

    <div id="cam">
      <div class="title" id="title">
        <span>Share</span><span>of</span><span>Electricity</span><span>Production</span><span>From</span><span>Solar</span><span>in</span><span>June</span>
      </div>

      <div class="frame" id="frame">
        <div class="grid" style="top: 90px"></div>
        <div class="grid" style="top: 216px"></div>
        <div class="grid" style="top: 341px"></div>
        <div class="grid" style="top: 467px"></div>
        <div class="grid" style="top: 593px"></div>
      </div>

      <div id="ylabels">
        <div class="ylab" style="top: 240px">%</div>
        <div class="ylab" style="top: 326px">25</div>
        <div class="ylab" style="top: 452px">20</div>
        <div class="ylab" style="top: 577px">15</div>
        <div class="ylab" style="top: 703px">10</div>
        <div class="ylab" style="top: 828px">5</div>
        <div class="ylab" style="top: 954px">0</div>
      </div>

      <div id="xlabels"></div>
      <div id="bars"></div>

      <!-- Callouts: left/top on .callout is the anchor point in chart pixels -->
      <div class="callout" id="c1" style="left: 450px; top: 0">
        <div class="pill v" style="top: 712px; width: 78px"><span class="txt">6%</span></div>
        <div class="stem v" style="top: 736px; height: 67px"></div>
        <div class="dot top" style="top: 736px"></div>
        <div class="dot bot" style="top: 803px"></div>
      </div>

      <div class="callout" id="c2" style="left: 960px; top: 0">
        <div class="pill v" style="top: 602px; width: 90px"><span class="txt">10%</span></div>
        <div class="stem v" style="top: 626px; height: 69px"></div>
        <div class="dot top" style="top: 626px"></div>
        <div class="dot bot" style="top: 695px"></div>
      </div>

      <div class="callout" id="c3" style="left: 0; top: 322px">
        <div class="pill h" style="left: 1548px; width: 92px"><span class="txt">25%</span></div>
        <div class="stem h" style="left: 1472px; width: 70px"></div>
        <div class="dot top" style="left: 1472px"></div>
        <div class="dot bot" style="left: 1542px"></div>
      </div>
    </div>

    <svg class="logo" viewBox="0 0 76 106" fill="none" stroke="#5cf07c" stroke-width="15" stroke-linecap="round">
      <path d="M58 20 C 48 10, 22 10, 16 30 C 10 50, 30 60, 48 56"/>
      <path d="M20 84 C 34 94, 58 90, 62 72 C 64 62, 58 58, 48 56"/>
    </svg>
    <div class="credit">EMBER</div>
  </div>
</div>

<script>
  // Data: June solar share (%) per year. Edit values here.
  const DATA = [
    ["2016", 6.0], ["2017", 6.0], ["2018", 6.6], ["2019", 7.9], ["2020", 8.8], ["2021", 10.3],
    ["2022", 12.9], ["2023", 17.4], ["2024", 19.0], ["2025", 23.2], ["2026", 25.0]
  ];
  const ZERO_Y = 954, UNIT = 25.12, X0 = 450, STEP = 102;

  const barsEl = document.getElementById("bars");
  const xEl = document.getElementById("xlabels");
  const ghosts = [], fills = [];
  DATA.forEach(([yr, v], i) => {
    const cx = X0 + i * STEP;
    const h = v * UNIT;
    const g = document.createElement("div");
    g.className = "bar ghost"; g.style.left = cx + "px"; g.style.height = h + "px";
    const f = document.createElement("div");
    f.className = "bar fill"; f.style.left = cx + "px"; f.style.height = h + "px";
    barsEl.append(g, f); ghosts.push(g); fills.push(f);
    const lab = document.createElement("div");
    lab.className = "xlab"; lab.style.left = cx + "px";
    lab.innerHTML = '<span class="mo">Jun</span><span class="yr">' + yr + "</span>";
    xEl.append(lab);
  });

  document.querySelectorAll(".pill .txt").forEach(t => {
    t.innerHTML = [...t.textContent].map(c => "<span class=ch>" + c + "</span>").join("");
  });

  const cam = document.getElementById("cam");
  const tl = gsap.timeline({ paused: true });

  // Title + axis labels
  tl.fromTo("#title span", { opacity: 0.12 }, { opacity: 1, duration: 0.35, stagger: 0.09, ease: "power1.out" }, 0);
  tl.fromTo(".xlab .mo", { opacity: 0.15 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
  tl.fromTo(".xlab .yr", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.15);

  // Frame grows out of the top-left corner
  tl.fromTo("#frame", { clipPath: "inset(0% 100% 100% 0%)" },
    { clipPath: "inset(0% 0% 0% 0%)", duration: 1.15, ease: "power2.out" }, 0.15);

  // Bars rise: all ghost columns + the 2016 highlight
  tl.fromTo(ghosts, { scaleY: 0 }, { scaleY: 1, duration: 2.5, stagger: 0.04, ease: "power2.inOut" }, 1.45);
  tl.fromTo(fills[0], { scaleY: 0 }, { scaleY: 1, duration: 2.5, ease: "power2.inOut" }, 1.45);
  tl.set(fills.slice(1), { scaleY: 0 }, 0);

  // Camera: hard cut to close-up on the early years
  tl.set(cam, { x: 0, y: 0, scale: 1 }, 0);
  tl.set(cam, { x: -466, y: -1260, scale: 2.25 }, 2.47);

  function callout(id, at, horizontal) {
    const c = "#" + id;
    const pill = document.querySelector(c + " .pill");
    const w = pill.style.width;
    tl.fromTo(pill, { opacity: 0 }, { opacity: 1, duration: 0.08 }, at);
    tl.fromTo(pill, { width: 8 }, { width: w, duration: 0.3, ease: "power2.out" }, at + 0.1);
    tl.fromTo(c + " .ch", { opacity: 0 }, { opacity: 1, duration: 0.12, stagger: 0.12 }, at + 0.4);
    const t2 = at + 0.8;
    tl.fromTo(c + " .dot.top", { scale: 0 }, { scale: 1, duration: 0.2, ease: "back.out(2)" }, t2);
    tl.fromTo(c + " .stem", horizontal ? { scaleX: 0 } : { scaleY: 0 },
      horizontal ? { scaleX: 1, duration: 0.4, ease: "power2.inOut" } : { scaleY: 1, duration: 0.4, ease: "power2.inOut" }, t2 + 0.05);
    tl.fromTo(c + " .dot.bot", { scale: 0 }, { scale: 1, duration: 0.2, ease: "back.out(2)" }, t2 + 0.4);
  }
  gsap.set(".pill", { opacity: 0 });
  callout("c1", 3.15, false);

  // 2017–2021 fill in while the camera eases back
  tl.to(fills.slice(1, 6), { scaleY: 1, duration: 1.9, stagger: 0.12, ease: "power2.inOut" }, 6.4);
  tl.to(cam, { x: -358, y: -726, scale: 1.73, duration: 1.5, ease: "power2.inOut" }, 6.6);
  callout("c2", 8.6, false);

  // Hard cut back to the full chart, remaining years fill
  tl.set(cam, { x: 0, y: 0, scale: 1 }, 10.38);
  tl.to(fills.slice(6), { scaleY: 1, duration: 1.9, stagger: 0.12, ease: "power2.inOut" }, 10.6);
  callout("c3", 12.3, true);

  tl.set({}, {}, 15.08);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
</script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;if(window.__hyperframes)return;function play(){var rec=window.__timelines||{};var k=Object.keys(rec);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=rec[id];if(!t||typeof t.eventCallback!=="function"||typeof t.restart!=="function")return;t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
