<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
    <script src="../vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1c2a1e;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1c2a1e;
        font-family: Inter, system-ui, sans-serif;
      }
      .clip { position: absolute; inset: 0; }

      .logo-g {
        position: absolute;
        top: 56px;
        right: 72px;
        width: 54px;
        height: 54px;
        color: #3dff6a;
      }
      .logo-g svg { width: 100%; height: 100%; display: block; }

      .report {
        position: absolute;
        left: 50%;
        top: 26%;
        width: 620px;
        margin-left: -120px;
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .doc-frame {
        width: 132px;
        height: 132px;
        border: 2px solid #3a6b45;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .doc {
        width: 72px;
        height: 92px;
        background: #e7ebe8;
        border-radius: 2px 14px 2px 2px;
        position: relative;
        overflow: hidden;
      }
      .doc .fold {
        position: absolute;
        top: 0;
        right: 0;
        border-width: 0 16px 16px 0;
        border-style: solid;
        border-color: #1c2a1e #1c2a1e transparent transparent;
      }
      .doc .line {
        position: absolute;
        left: 14px;
        right: 18px;
        height: 3px;
        background: #c5cec8;
        border-radius: 2px;
      }
      .doc .line:nth-child(2) { top: 28px; }
      .doc .line:nth-child(3) { top: 40px; }
      .doc .line:nth-child(4) { top: 52px; }
      .doc .line:nth-child(5) { top: 64px; width: 42%; }
      .report-title {
        color: #f3f6f3;
        font-size: 34px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.02em;
        max-width: 360px;
      }

      .wires {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .wires path {
        fill: none;
        stroke: #c23b3b;
        stroke-width: 2.5;
      }

      .warning {
        position: absolute;
        left: 50%;
        top: 56%;
        width: 118px;
        height: 118px;
        margin-left: -130px;
      }
      .octagon {
        width: 100%;
        height: 100%;
        background: #f4f1ea;
        clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
        display: grid;
        place-items: center;
      }
      .bang {
        color: #d12424;
        font-size: 64px;
        font-weight: 700;
        line-height: 1;
        transform: translateY(-2px);
      }

      .issues {
        position: absolute;
        left: 50%;
        top: 49%;
        margin-left: 40px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .issue {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #e24b4b;
        font-size: 28px;
        font-weight: 600;
      }
      .issue .tick {
        width: 22px;
        height: 2px;
        background: #c23b3b;
        flex-shrink: 0;
      }
      .issue .box {
        width: 8px;
        height: 8px;
        background: #c23b3b;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7.17"
      data-width="1920"
      data-height="1080"
    >
      <section class="clip" data-start="0" data-duration="7.17" data-track-index="0">
        <div class="logo-g" id="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <path d="M18 18c8-10 30-8 34 10 3 14-8 28-24 28-14 0-24-12-22-24" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
            <path d="M44 32h14" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
          </svg>
        </div>

        <svg class="wires" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <path id="wire-main" d="M 780 340 H 560 V 660 H 820" />
          <path id="wire-arm" d="M 950 660 H 1040" />
        </svg>

        <div class="report" id="report">
          <div class="doc-frame">
            <div class="doc">
              <span class="fold"></span>
              <span class="line"></span>
              <span class="line"></span>
              <span class="line"></span>
              <span class="line"></span>
            </div>
          </div>
          <div class="report-title">The Sustainable<br />Development Goals Report</div>
        </div>

        <div class="warning" id="warning">
          <div class="octagon"><span class="bang">!</span></div>
        </div>

        <div class="issues" id="issues">
          <div class="issue" id="issue0"><span class="tick"></span><span class="box"></span>Conflicts</div>
          <div class="issue" id="issue1"><span class="tick"></span><span class="box"></span>Climate change</div>
          <div class="issue" id="issue2"><span class="tick"></span><span class="box"></span>Rising debt</div>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const wires = ["#wire-main", "#wire-arm"];
      wires.forEach((sel) => {
        const path = document.querySelector(sel);
        const len = path.getTotalLength();
        path.style.strokeDasharray = String(len);
        path.style.strokeDashoffset = String(len);
      });

      tl.fromTo("#logo", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0);
      tl.fromTo("#report", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.15);
      tl.to("#wire-main", { strokeDashoffset: 0, duration: 1.15, ease: "power1.inOut" }, 0.85);
      tl.fromTo("#warning", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 1.55);
      tl.to("#wire-arm", { strokeDashoffset: 0, duration: 0.28, ease: "power1.out" }, 2.05);
      tl.fromTo("#issues .issue", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.22, ease: "power2.out" }, 2.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
