<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Cabinet Grotesk';
        src: url('assets/fonts/CabinetGrotesk-ExtraBold.woff2') format('woff2');
        font-weight: 800;
        font-style: normal;
      }
      @font-face {
        font-family: 'Satoshi';
        src: url('assets/fonts/Satoshi-Bold.woff2') format('woff2');
        font-weight: 500 700;
        font-style: normal;
      }
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f8f9fb; }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #f8f9fb;
        background-image:
          linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      #content {
        width: 100%;
        height: 100%;
        padding: 92px 160px 110px;
        display: flex;
        flex-direction: column;
        gap: 42px;
        will-change: transform, opacity;
      }
      #header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 60px;
      }
      #title {
        font-family: 'Cabinet Grotesk', sans-serif;
        font-size: 82px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.035em;
        color: #111111;
      }
      #subtitle {
        max-width: 470px;
        font-family: 'Satoshi', sans-serif;
        font-size: 28px;
        font-weight: 500;
        line-height: 1.35;
        color: #64648c;
        text-align: right;
      }
      #chart {
        position: relative;
        flex: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 72px;
        padding: 54px 70px 66px;
        border-left: 3px solid #1a1a2e;
        border-bottom: 3px solid #1a1a2e;
      }
      .guide {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: rgba(26, 26, 46, 0.1);
        transform-origin: left center;
      }
      .guide-1 { top: 25%; }
      .guide-2 { top: 50%; }
      .guide-3 { top: 75%; }
      .bar-group {
        position: relative;
        width: 190px;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 16px;
      }
      .value {
        font-family: 'Cabinet Grotesk', sans-serif;
        font-size: 42px;
        font-weight: 800;
        color: #1a1a2e;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        width: 142px;
        height: var(--height);
        min-height: 20px;
        border-radius: 20px 20px 8px 8px;
        background: #c4b5fd;
        box-shadow: 0 8px 30px rgba(124, 58, 237, 0.1);
        transform-origin: center bottom;
        will-change: transform, opacity;
      }
      .label {
        position: absolute;
        top: calc(100% + 22px);
        font-family: 'Satoshi', sans-serif;
        font-size: 26px;
        font-weight: 700;
        color: #64648c;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .winner .bar {
        background: #7c3aed;
        box-shadow:
          0 8px 30px rgba(124, 58, 237, 0.1),
          0 0 34px rgba(124, 58, 237, 0.38);
      }
      .winner .value,
      .winner .label { color: #5b21b6; }
      #winner-pill {
        position: absolute;
        top: -46px;
        left: 50%;
        padding: 10px 18px;
        border-radius: 12px;
        background: #7c3aed;
        color: #ffffff;
        font-family: 'Satoshi', sans-serif;
        font-size: 22px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        box-shadow: 0 8px 30px rgba(124, 58, 237, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="mg-rising-bar-chart-winner" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <div id="content">
        <div id="header">
          <h1 id="title">PERFORMANCE BY APPROACH</h1>
          <p id="subtitle">One option clearly pulls ahead.</p>
        </div>
        <div id="chart">
          <div class="guide guide-1"></div>
          <div class="guide guide-2"></div>
          <div class="guide guide-3"></div>

          <div class="bar-group" style="--height: 42%">
            <div class="value">42%</div><div class="bar"></div><div class="label">Option A</div>
          </div>
          <div class="bar-group" style="--height: 58%">
            <div class="value">58%</div><div class="bar"></div><div class="label">Option B</div>
          </div>
          <div class="bar-group" style="--height: 67%">
            <div class="value">67%</div><div class="bar"></div><div class="label">Option C</div>
          </div>
          <div class="bar-group winner" style="--height: 92%">
            <div id="winner-pill" data-layout-allow-overflow>Winner</div>
            <div class="value">92%</div><div class="bar"></div><div class="label">Option D</div>
          </div>
          <div class="bar-group" style="--height: 74%">
            <div class="value">74%</div><div class="bar"></div><div class="label">Option E</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set('#title', { opacity: 0, y: 24 });
      gsap.set('#subtitle', { opacity: 0, x: 28 });
      gsap.set('.guide', { scaleX: 0 });
      gsap.set('.bar', { scaleY: 0, opacity: 0.72 });
      gsap.set('.value, .label', { opacity: 0, y: 14 });
      gsap.set('#winner-pill', { opacity: 0, scale: 0.7, y: 12, xPercent: -50 });

      tl.to('#title', { opacity: 1, y: 0, duration: 0.58, ease: 'power3.out' }, 0.18);
      tl.to('#subtitle', { opacity: 1, x: 0, duration: 0.48, ease: 'power2.out' }, 0.36);
      tl.to('.guide', { scaleX: 1, duration: 0.65, stagger: 0.08, ease: 'expo.out' }, 0.48);
      tl.to('.bar', { scaleY: 1, opacity: 1, duration: 0.92, stagger: 0.18, ease: 'expo.out' }, 0.82);
      tl.to('.value, .label', { opacity: 1, y: 0, duration: 0.38, stagger: 0.06, ease: 'power2.out' }, 1.24);
      tl.to('#winner-pill', { opacity: 1, scale: 1, y: 0, duration: 0.52, ease: 'back.out(1.6)' }, 2.42);
      tl.to('.winner .bar', { scaleX: 1.06, duration: 0.34, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 2.48);

      tl.to('#content', { opacity: 0, y: -28, scale: 0.98, duration: 0.5, ease: 'power2.in' }, 6.08);

      window.__timelines['mg-rising-bar-chart-winner'] = tl;
    </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
  </body>
</html>
