        inset: 0;
        pointer-events: none;
      }

      /* REPLACE: swap the <symbol> path for any other icon mark, and #7c3aed for a different accent */
      #icon-cluster {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: 3;
      }

      .icon-item {
        position: absolute;
        display: block;
      }

      .icon-item svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .icon-item svg path {
        fill: #7c3aed;
      }

      /* ── BOTTOM HALF: talking head ── */
      #talking-head {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0f;
        z-index: 1;
      }

      #talking-head video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>

    <script>
      // Dot grid matching the Off-White Dot Grid template, sized for the 1080×864 top half
      const svg = document.getElementById("dot-grid");
      const DOT_SPACING = 40;
      const DOT_RADIUS = 2;
      const cols = Math.ceil(1080 / DOT_SPACING) + 1;
      const rows = Math.ceil(864 / DOT_SPACING) + 1;
      let dots = "";
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          dots += `<circle cx="${col * DOT_SPACING}" cy="${row * DOT_SPACING}" r="${DOT_RADIUS}" fill="#cccccc" opacity="0.5"/>`;
        }
      }
      svg.innerHTML = dots;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#graphic-zone", { autoAlpha: 1, y: -864 });
      tl.to("#graphic-zone", { autoAlpha: 1, y: 0, duration: 0.74, ease: "expo.out" }, 0.12);

      /* ── SPLIT FRAMING — REPLACE per project ──────────────────────────────
         45/55 split: the graphic covers the top 864px of the canvas; the footage shows
         through the 1080×864 window below it while the icon cluster is on screen.
         SPLIT_SCALE must stay at 1 (never below). SPLIT_SHIFT must stay within 0…864.
         Read real values with: python3 scripts/face-frame.py <video> --window 864:1920
         then add ~100–150px to the shift it returns — confirm on a real frame.
         ────────────────────────────────────────────────────────────────── */
      const SPLIT_SHIFT = 700;   /* px the footage travels down (0…864) */
      const SPLIT_SCALE = 1;     /* never below 1 — see above */

      tl.fromTo("#talking-head video", { y: 0, scale: 1 }, { y: SPLIT_SHIFT, scale: SPLIT_SCALE, duration: 0.74, ease: "expo.out" }, 0.12);

      // Icon cluster — each icon slides in from the left, eases into its rest position,
      // holds, then slides back out to the right before the graphic zone exits.
      const icons = ["#icon-1", "#icon-2", "#icon-3", "#icon-4", "#icon-5", "#icon-6", "#icon-7"];
      const iconEls = icons.map((sel) => document.querySelector(sel));

      // How far left of its own rest position each icon starts (keeps every icon off-canvas
      // to the left regardless of its final `left`/`width`, so the slide always reads as "from the left")
      const ENTER_MARGIN = 200;
      const enterStartX = iconEls.map((el) => {
        const left = parseFloat(el.style.left);
        const width = parseFloat(el.style.width);
        return -(left + width + ENTER_MARGIN);
      });

      // How far right of its own rest position each icon ends up (keeps every icon off-canvas
      // to the right regardless of its final `left`, so the exit always reads as "to the right")
      const exitStartX = iconEls.map((el) => {
        const left = parseFloat(el.style.left);
        return 1080 - left + ENTER_MARGIN;
      });

      // Fixed tilt per icon, uneven on purpose, so the cluster reads as scattered rather than grid-aligned
      const ROT = [-14, 10, -6, 18, -9, 13, -4];
      gsap.set(iconEls, { transformOrigin: "50% 50%" });
      gsap.set(iconEls, {
        x: (i) => enterStartX[i],
        rotation: (i) => ROT[i],
        scale: 0.92,
        opacity: 0,
      });

      const ENTER_START = 0.5;
      const ENTER_STAGGER = 0.09;
      const ENTER_DUR = 0.62;

      iconEls.forEach((el, i) => {
        tl.to(
          el,
          { x: 0, scale: 1, opacity: 1, duration: ENTER_DUR, ease: "expo.out" },
          ENTER_START + i * ENTER_STAGGER
        );
      });

      const lastEnterStart = ENTER_START + (iconEls.length - 1) * ENTER_STAGGER;
      const lastEnterEnd = lastEnterStart + ENTER_DUR;

      // Hold — icons stay put on screen
      const HOLD = 1.0;
      const EXIT_START = lastEnterEnd + HOLD;
      const EXIT_STAGGER = 0.07;
      const EXIT_DUR = 0.48;

      iconEls.forEach((el, i) => {
        tl.to(
          el,
          { x: exitStartX[i], scale: 0.94, opacity: 0, duration: EXIT_DUR, ease: "power2.in" },
          EXIT_START + i * EXIT_STAGGER
        );
      });

      const lastExitStart = EXIT_START + (iconEls.length - 1) * EXIT_STAGGER;
      const lastExitEnd = lastExitStart + EXIT_DUR;

      // Graphic zone slides back up and out, revealing the talking head full-screen again
      const zoneExitStart = lastExitEnd + 0.3;
      tl.to("#graphic-zone", { autoAlpha: 1, y: -864, duration: 0.62, ease: "power3.in" }, zoneExitStart);
      tl.to("#talking-head video", { y: 0, scale: 1, duration: 0.62, ease: "power3.in" }, zoneExitStart);

      window.__timelines["icon-cluster-slide-reveal-9x16"] = tl;
    </script>
