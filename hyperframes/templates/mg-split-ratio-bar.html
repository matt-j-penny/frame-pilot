<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: 'Satoshi'; src: url('assets/fonts/Satoshi-Bold.woff2') format('woff2'); font-weight: 400 700; font-style: normal; }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }

    /* Transparent overlay — layer over source video in parent composition */
    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clip { position: absolute; }
    .preview-video-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    .blur-backdrop { position: absolute; inset: 0; z-index: 1; backdrop-filter: blur(0px); background: rgba(26,26,46,0); will-change: backdrop-filter, background; }

    .panel {
      position: relative;
      z-index: 2;
      background: #f8f9fb;
      background-image:
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      border-radius: 20px;
      padding: 48px 64px 56px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.18);
      min-width: 920px;
      will-change: transform, opacity;
    }

    .panel-label {
      font-family: 'Satoshi', sans-serif;
      font-size: 24px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(0,0,0,0.45);
      margin-bottom: 28px;
      display: block;
      text-align: center;
    }

    /* REPLACE: adjust flex values to change the ratio (e.g. flex:7/flex:3 for 70/30) */
    .split-bar {
      display: flex;
      height: 72px;
      border-radius: 12px;
      overflow: hidden;
      width: 820px;
    }

    .bar-primary {
      flex: 8; /* REPLACE: numerator of ratio */
      background: #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bar-secondary {
      flex: 2; /* REPLACE: denominator complement */
      background: rgba(124,58,237,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bar-primary span,
    .bar-secondary span {
      font-family: 'Satoshi', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .bar-secondary span { color: #5b21b6; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="mg-split-ratio-bar" data-start="0" data-duration="6" data-width="1920" data-height="1080">

    <img class="preview-video-bg" data-preview-only src="assets/talking-head-placeholder.png" alt="">
    <div class="blur-backdrop" id="blur-backdrop"></div>

    <div class="panel" id="panel">
      <!-- REPLACE: label -->
      <span class="panel-label">The better approach</span>
      <div class="split-bar">
        <!-- REPLACE: label text for each segment -->
        <div class="bar-primary" id="bar-primary"><span>80% Deterministic</span></div>
        <div class="bar-secondary" id="bar-secondary"><span>20% AI</span></div>
      </div>
    </div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.to('#blur-backdrop', { backdropFilter: 'blur(16px)', backgroundColor: 'rgba(26,26,46,0.12)', duration: 0.55, ease: 'power2.out' }, 0.15);
    tl.from('#panel',        { opacity: 0, y: 36, scale: 0.94, duration: 0.5, ease: 'power3.out', transformOrigin: 'center center' }, 0.2);
    tl.from('#bar-primary',  { scaleX: 0, duration: 0.7, ease: 'expo.out', transformOrigin: 'left center' }, 1.0);
    tl.from('#bar-secondary',{ scaleX: 0, duration: 0.5, ease: 'power3.out', transformOrigin: 'left center' }, 1.9);
    tl.to('#panel',          { opacity: 0, y: -24, scale: 0.96, duration: 0.45, ease: 'power2.in', transformOrigin: 'center center' }, 5.1);
    tl.to('#blur-backdrop', { backdropFilter: 'blur(0px)', backgroundColor: 'rgba(26,26,46,0)', duration: 0.5, ease: 'power2.in' }, 5.08);

    window.__timelines['mg-split-ratio-bar'] = tl;
  </script>
<!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
