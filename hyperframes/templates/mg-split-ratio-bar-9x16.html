<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Split Ratio Bar — Dot Grid — 9:16</title>
  <script src="vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: 'Satoshi'; src: url('assets/fonts/Satoshi-Bold.woff2') format('woff2'); font-weight: 400 700; font-style: normal; }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f5f5f3; }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    /* ── TOP HALF: off-white dot grid + ratio panel ── */
    #graphic-zone {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 864px;
      overflow: hidden;
      z-index: 2;
      will-change: transform, opacity;
      background: #f5f5f3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #dot-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .panel {
      position: relative;
      z-index: 2;
      width: 900px;
      background: #ffffff;
      border: 1px solid rgba(17, 16, 21, 0.06);
      border-radius: 24px;
      padding: 64px 56px 72px;
      box-shadow: 0 24px 70px rgba(17, 16, 21, 0.10);
      will-change: transform, opacity;
    }

    /* REPLACE: label */
    .panel-label {
      font-family: 'Satoshi', sans-serif;
      font-size: 32px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(0,0,0,0.45);
      margin-bottom: 38px;
      display: block;
      text-align: center;
    }

    /* REPLACE: adjust flex values to change the ratio (e.g. flex:7/flex:3 for 70/30) */
    .split-bar {
      display: flex;
      height: 104px;
      border-radius: 14px;
      overflow: hidden;
      width: 788px;
    }

    .bar-primary {
      flex: 8; /* REPLACE: numerator of ratio */
      background: #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bar-secondary {
      flex: 2; /* REPLACE: denominator complement */
      background: rgba(124,58,237,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bar-primary span,
    .bar-secondary span {
      font-family: 'Satoshi', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .bar-secondary span { color: #5b21b6; }

    /* ── BOTTOM HALF: talking head ── */
    #talking-head {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0a0a0f;
      z-index: 1;
    }
    #talking-head video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="mg-split-ratio-bar-9x16" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-fps="30">
    <div id="graphic-zone" data-layout-allow-overflow>
      <svg id="dot-grid" width="1080" height="864"></svg>

      <div class="panel" id="panel">
        <span class="panel-label">The better approach</span>
        <div class="split-bar">
          <!-- REPLACE: label text for each segment -->
          <div class="bar-primary" id="bar-primary"><span>80% Deterministic</span></div>
          <div class="bar-secondary" id="bar-secondary"><span>20% AI</span></div>
        </div>
      </div>
    </div>

    <!-- REPLACE: swap src/poster for your own talking-head footage -->
    <div id="talking-head">
      <video
        id="source-video"
        class="clip"
        src="assets/placeholder-video.mp4"
        poster="assets/talking-head-placeholder.png"
        muted
        playsinline
        preload="auto"
        data-start="0"
        data-duration="6"
        data-track-index="0"
      ></video>
    </div>
  </div>

  <script>
    // Dot grid matching the Off-White Dot Grid template, sized for the 1080×864 top half
    const svg = document.getElementById('dot-grid');
    const DOT_SPACING = 40;
    const DOT_RADIUS = 2;
    const cols = Math.ceil(1080 / DOT_SPACING) + 1;
    const rows = Math.ceil(864 / DOT_SPACING) + 1;
    let dots = '';
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        dots += `<circle cx="${col * DOT_SPACING}" cy="${row * DOT_SPACING}" r="${DOT_RADIUS}" fill="#cccccc" opacity="0.5"/>`;
      }
    }
    svg.innerHTML = dots;

    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    gsap.set('#graphic-zone', { autoAlpha: 1, y: -864 });
    tl.to('#graphic-zone', { autoAlpha: 1, y: 0, duration: 0.78, ease: 'expo.out' }, 0.14);
    /* ── SPLIT FRAMING — REPLACE per project ──────────────────────────────
       This is a 45/55 split: the graphic covers the top 864px of the canvas; the footage shows
       through the 1080×864 window below it. SPLIT_SHIFT slides the footage
       down so the speaker's face lands inside that window.

       SPLIT_SCALE must stay at 1. Any value below 1 narrows the footage
       inside its 1080px frame and exposes bars down both sides.
       SPLIT_SHIFT must stay within 0…864, which is the range that keeps
       the window fully covered — outside it the footage pulls off an edge.

       For real footage, read both values off the actual face position:
         python3 scripts/face-frame.py <video> --window 864:1920
       ────────────────────────────────────────────────────────────────── */
    const SPLIT_SHIFT = 700;   /* px the footage travels down (0…864) */
    const SPLIT_SCALE = 1;     /* never below 1 — see above */

    tl.fromTo('#talking-head video', { y: 0, scale: 1 }, { y: SPLIT_SHIFT, scale: SPLIT_SCALE, duration: 0.78, ease: 'expo.out' }, 0.14);

    tl.from('#panel',        { opacity: 0, y: 36, scale: 0.94, duration: 0.5, ease: 'power3.out', transformOrigin: 'center center' }, 0.2);
    tl.from('#bar-primary',  { scaleX: 0, duration: 0.7, ease: 'expo.out', transformOrigin: 'left center' }, 1.0);
    tl.from('#bar-secondary',{ scaleX: 0, duration: 0.5, ease: 'power3.out', transformOrigin: 'left center' }, 1.9);
    tl.to('#panel',          { opacity: 0, y: -24, scale: 0.96, duration: 0.45, ease: 'power2.in', transformOrigin: 'center center' }, 5.1);
    tl.to('#graphic-zone', { autoAlpha: 1, y: -864, duration: 0.62, ease: 'power3.in' }, 5.24);
    tl.to('#talking-head video', { y: 0, scale: 1, duration: 0.62, ease: 'power3.in' }, 5.24);

    window.__timelines['mg-split-ratio-bar-9x16'] = tl;
  </script>
<!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
