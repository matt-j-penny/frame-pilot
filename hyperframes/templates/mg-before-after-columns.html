<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin="">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800&f[]=satoshi@400,700&display=swap" rel="stylesheet">
  <script src="vendor/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f8f9fb; }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #f8f9fb;
      background-image:
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clip { position: absolute; }

    .ba-wrap {
      display: flex;
      align-items: stretch;
      width: 100%;
      max-width: 1760px;
      padding: 0 32px;
      will-change: transform, opacity;
    }

    .ba-col {
      flex: 1;
      padding: 56px 64px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.05);
      text-align: center;
      will-change: transform, opacity;
    }

    /* REPLACE: border colour on each col to signal good/bad/neutral */
    .ba-col-a { border-top: 6px solid #ef4444; }
    .ba-col-b { border-top: 6px solid #ef4444; }

    .ba-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 28px;
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 56px;
      font-weight: 800;
      color: rgba(0,0,0,0.22);
      will-change: transform, opacity;
    }

    .ba-label {
      font-family: 'Satoshi', sans-serif;
      font-size: 28px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(0,0,0,0.45);
      margin-bottom: 20px;
      will-change: transform, opacity;
    }

    .ba-val {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 88px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      will-change: transform, opacity;
    }

    /* REPLACE: apply these to .ba-val */
    .c-red    { color: #dc2626; }
    .c-green  { color: #059669; }
    .c-purple { color: #7c3aed; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="mg-before-after-columns" data-start="0" data-duration="6" data-width="1920" data-height="1080">

    <div class="ba-wrap" id="ba-wrap">
      <div class="ba-col ba-col-a" id="col-a">
        <!-- REPLACE: label, value colour class, value text -->
        <div class="ba-label" id="a-label">Before new model</div>
        <div class="ba-val c-red" id="a-val">Struggling</div>
      </div>
      <div class="ba-arrow" id="ba-arrow">→</div>
      <div class="ba-col ba-col-b" id="col-b">
        <!-- REPLACE: label, value colour class, value text -->
        <div class="ba-label" id="b-label">After new model</div>
        <div class="ba-val c-red" id="b-val">Still struggling</div>
      </div>
    </div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.set('#col-a, #a-label, #a-val, #ba-arrow, #col-b, #b-label, #b-val', { opacity: 0, y: 24 }, 0);

    // REPLACE: timestamps to match voiceover
    tl.to('#col-a',   { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.3);
    tl.to('#a-val',   { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.3);
    tl.to('#a-label', { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 1.1);
    tl.to('#ba-arrow',{ opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 1.8);
    tl.to('#col-b',   { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 2.4);
    tl.to('#b-val',   { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 2.4);
    tl.to('#b-label', { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 3.2);
    tl.to('#ba-wrap', { opacity: 0, y: -28, scale: 0.96, duration: 0.45, ease: 'power2.in', transformOrigin: 'center center' }, 5.1);

    window.__timelines['mg-before-after-columns'] = tl;
  </script>
<!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
