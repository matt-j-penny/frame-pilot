<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Satoshi";
        src: local("Satoshi");
        font-style: normal italic;
        font-weight: 400 700;
      }

      @font-face {
        font-family: "Cabinet Grotesk";
        src: local("Cabinet Grotesk");
        font-style: normal italic;
        font-weight: 700 900;
      }

      :root {
        --navy: #f5f0ff;
        --navy-deep: #ebe3f8;
        --blue: #bda7dc;
        --text: #111015;
        --red: #b01e34;
        --red-deep: #a61730;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy-deep);
      }

      body { font-family: "Satoshi", "Inter", sans-serif; }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
      }

      .scene {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        isolation: isolate;
      }

      .smudge {
        position: absolute;
        border-radius: 999px;
        filter: blur(88px);
        opacity: 0.44;
        will-change: transform, opacity;
      }

      .smudge-one {
        width: 780px;
        height: 370px;
        left: -180px;
        top: 210px;
        background: rgba(184, 151, 222, 0.58);
        transform: rotate(-14deg);
      }

      .smudge-two {
        width: 980px;
        height: 260px;
        left: 380px;
        top: 440px;
        background: rgba(207, 188, 233, 0.54);
        filter: blur(112px);
        transform: rotate(4deg);
      }

      .smudge-three {
        width: 640px;
        height: 340px;
        right: -150px;
        bottom: 90px;
        background: rgba(164, 126, 205, 0.46);
        filter: blur(120px);
        transform: rotate(-22deg);
      }

      .smudge-four {
        width: 560px;
        height: 280px;
        left: 80px;
        bottom: -90px;
        background: rgba(216, 196, 239, 0.64);
        filter: blur(118px);
      }

      .texture {
        position: absolute;
        inset: 0;
        opacity: 0.12;
        mix-blend-mode: soft-light;
        background-image:
          radial-gradient(circle at 18% 31%, rgba(255,255,255,.26) 0 1px, transparent 1.5px),
          radial-gradient(circle at 76% 69%, rgba(255,255,255,.16) 0 1px, transparent 1.5px);
        background-size: 19px 23px, 29px 31px;
      }

      .line-glow {
        position: absolute;
        left: 170px;
        right: 150px;
        top: 451px;
        height: 176px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.42);
        filter: blur(48px);
        opacity: 0;
      }

      .scene-content {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 120px 126px;
        z-index: 3;
      }

      .quote {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 22px;
        width: 100%;
        color: var(--text);
        font-family: "Satoshi", "Inter", sans-serif;
        font-size: 80px;
        font-style: italic;
        font-weight: 500;
        letter-spacing: -0.038em;
        line-height: 1.1;
        white-space: nowrap;
        text-shadow:
          0 0 8px rgba(255, 255, 255, 0.78),
          0 0 25px rgba(255, 255, 255, 0.58),
          0 0 52px rgba(255, 255, 255, 0.38);
      }

      .word {
        position: relative;
        display: inline-block;
        z-index: 2;
        will-change: transform, opacity, filter;
      }

      .complete {
        font-family: "Cabinet Grotesk", "Satoshi", "Inter", sans-serif;
        font-weight: 800;
        letter-spacing: -0.045em;
      }

      .strategy-wrap {
        position: relative;
        display: inline-block;
        padding: 17px 22px 18px 18px;
        margin-left: -3px;
      }

      .highlight {
        position: absolute;
        z-index: 0;
        left: -7px;
        right: -16px;
        top: 4px;
        bottom: 5px;
        background: var(--red);
        box-shadow:
          0 0 30px rgba(255, 72, 87, 0.86),
          22px 0 34px rgba(255, 72, 87, 0.55),
          inset -22px 0 28px rgba(181, 31, 53, 0.28);
        transform-origin: left center;
        overflow: hidden;
      }

      .highlight::before,
      .highlight::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255, 153, 145, 0.18);
        filter: blur(16px);
        transform: translateX(-28%);
      }

      .highlight::after {
        background: rgba(255, 92, 104, 0.08);
        transform: translateX(67%);
      }

      .strategy {
        z-index: 2;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-4nyc" id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div data-hf-id="hf-kscd" id="glowing-strategy-scene" class="clip scene" data-start="0" data-duration="6" data-track-index="1">
        <div data-hf-id="hf-s1ty" id="smudge-one" class="smudge smudge-one" data-layout-allow-overflow="true"></div>
        <div data-hf-id="hf-clzr" id="smudge-two" class="smudge smudge-two"></div>
        <div data-hf-id="hf-5ty2" id="smudge-three" class="smudge smudge-three" data-layout-allow-overflow="true"></div>
        <div data-hf-id="hf-7z5c" id="smudge-four" class="smudge smudge-four" data-layout-allow-overflow="true"></div>
        <div data-hf-id="hf-3akh" class="texture"></div>
        <div data-hf-id="hf-yq2a" id="line-glow" class="line-glow"></div>

        <div data-hf-id="hf-cn5c" class="scene-content">
          <div data-hf-id="hf-34zt" id="quote" class="quote" aria-label="follow a COMPLETELY different strategy">
            <span data-hf-id="hf-qxby" id="word-follow" class="word">follow</span>
            <span data-hf-id="hf-u7ho" id="word-a" class="word">a</span>
            <span data-hf-id="hf-habx" id="word-completely" class="word complete">COMPLETELY</span>
            <span data-hf-id="hf-9r4g" id="word-different" class="word">different</span>
            <span data-hf-id="hf-iyij" id="strategy-wrap" class="strategy-wrap">
              <span data-hf-id="hf-mynl" id="strategy-highlight" class="highlight"></span>
              <span data-hf-id="hf-aw05" id="word-strategy" class="word strategy">strategy</span>
            </span>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });
      const words = [
        "#word-follow",
        "#word-a",
        "#word-completely",
        "#word-different",
        "#strategy-wrap"
      ];

      gsap.set(words, { autoAlpha: 0 });
      gsap.set("#strategy-highlight", { scaleX: 0, opacity: 0 });
      gsap.set("#glowing-strategy-scene", { autoAlpha: 1 });

      tl.from("#glowing-strategy-scene", {
        scale: 1.035,
        duration: 1.15,
        ease: "expo.out"
      }, 0);

      tl.to("#line-glow", {
        opacity: 0.9,
        duration: 0.8,
        ease: "power2.out"
      }, 0.08);

      tl.to(words, {
        autoAlpha: 1,
        duration: 0.42,
        stagger: 0.12,
        ease: "power2.out"
      }, 0.28);

      tl.from(words, {
        y: 26,
        x: -14,
        scale: 0.97,
        filter: "blur(11px)",
        duration: 1.34,
        stagger: 0.12,
        ease: "expo.out"
      }, 0.28);

      tl.to("#strategy-highlight", {
        scaleX: 1,
        opacity: 1,
        duration: 0.78,
        ease: "power3.out"
      }, 1.02);

      tl.from("#word-strategy", {
        x: 18,
        duration: 1.15,
        ease: "expo.out"
      }, 1.08);

      tl.to("#smudge-one", {
        x: 74,
        y: -24,
        scale: 1.12,
        duration: 4.2,
        ease: "sine.inOut"
      }, 0.15);

      tl.to("#smudge-two", {
        x: -66,
        scale: 1.1,
        opacity: 0.58,
        duration: 4.4,
        ease: "sine.inOut"
      }, 0.05);

      tl.to("#smudge-three", {
        x: -48,
        y: 28,
        duration: 4.5,
        ease: "sine.inOut"
      }, 0.1);

      tl.to("#line-glow", {
        scale: 1.08,
        opacity: 0.66,
        duration: 2.6,
        ease: "sine.inOut"
      }, 1.55);

      tl.to("#quote", {
        y: -7,
        duration: 2.5,
        ease: "sine.inOut"
      }, 1.6);

      tl.to("#quote", {
        y: -34,
        scale: 0.985,
        opacity: 0,
        duration: 0.62,
        ease: "power3.in"
      }, 5.08);

      tl.to("#line-glow", {
        opacity: 0,
        scale: 0.8,
        duration: 0.52,
        ease: "power2.in"
      }, 5.12);

      tl.to("#glowing-strategy-scene", {
        autoAlpha: 0,
        scale: 0.98,
        duration: 0.48,
        ease: "power2.in"
      }, 5.48);

      window.__timelines["main"] = tl;

    </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
  </body>
</html>
