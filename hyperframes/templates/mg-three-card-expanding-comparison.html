<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Three-Card Expanding Comparison</title>
  <script src="vendor/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: "Cabinet Grotesk";
      src: url("assets/fonts/CabinetGrotesk-ExtraBold.woff2") format("woff2");
      font-style: normal;
      font-weight: 800;
    }
    @font-face {
      font-family: "Satoshi";
      src: url("assets/fonts/Satoshi-Bold.woff2") format("woff2");
      font-style: normal;
      font-weight: 400 700;
    }
    :root {
      --bg: #fafafa;
      --card-deep: #1f1038;
      --card-mid: #39166d;
      --card-bright: #5b21b6;
      --text: #1a1a2e;
      --text-on-purple: #fafafa;
      --text-secondary: #e9e2f7;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
      --success: #a7f3d0;
      --success-dark: #34d399;
      --error: #fecdd3;
      --error-dark: #fb7185;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg);
    }
    body {
      color: var(--text);
      font-family: "Satoshi", sans-serif;
    }
    #tce-root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
    #tce-shell {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--bg);
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .tce-grid {
      position: absolute;
      inset: 0;
      z-index: 2;
      background-image:
        linear-gradient(rgba(26, 26, 46, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 26, 46, 0.055) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .tce-depth {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 74% 20%, rgba(124, 58, 237, 0.09), transparent 30%),
        radial-gradient(circle at 16% 42%, rgba(91, 33, 182, 0.07), transparent 34%);
      pointer-events: none;
    }
    .tce-aurora-field {
      position: absolute;
      inset: -190px -240px;
      z-index: 1;
      opacity: 0.54;
      pointer-events: none;
      will-change: transform, opacity;
      filter: blur(68px);
      background:
        radial-gradient(ellipse 64% 52% at 5% 112%, rgba(91, 33, 182, 0.78) 0%, rgba(124, 58, 237, 0.48) 28%, rgba(167, 139, 250, 0.16) 55%, transparent 82%),
        radial-gradient(ellipse 48% 60% at 45% 116%, rgba(167, 139, 250, 0.72) 0%, rgba(124, 58, 237, 0.34) 32%, rgba(91, 33, 182, 0.12) 60%, transparent 84%),
        radial-gradient(ellipse 72% 48% at 91% 110%, rgba(99, 102, 241, 0.58) 0%, rgba(124, 58, 237, 0.34) 34%, rgba(167, 139, 250, 0.10) 61%, transparent 84%);
    }
    .tce-aurora-ribbon {
      position: absolute;
      left: -280px;
      right: -280px;
      bottom: -270px;
      height: 650px;
      z-index: 1;
      opacity: 0.34;
      pointer-events: none;
      will-change: transform, opacity;
      filter: blur(92px);
      background:
        linear-gradient(
          104deg,
          transparent 2%,
          rgba(91, 33, 182, 0.20) 16%,
          rgba(124, 58, 237, 0.62) 38%,
          rgba(196, 181, 253, 0.56) 54%,
          rgba(99, 102, 241, 0.42) 72%,
          transparent 96%
        );
    }
    .tce-aurora-lobe {
      position: absolute;
      z-index: 1;
      border-radius: 50%;
      opacity: 0.36;
      pointer-events: none;
      transform-origin: 50% 82%;
      will-change: transform, opacity;
      filter: blur(76px);
    }
    #tce-lobe-one {
      left: -330px;
      bottom: -190px;
      width: 1020px;
      height: 330px;
      background: radial-gradient(ellipse at 58% 62%, rgba(91, 33, 182, 0.74) 0%, rgba(124, 58, 237, 0.40) 30%, rgba(167, 139, 250, 0.12) 58%, transparent 84%);
    }
    #tce-lobe-two {
      left: 560px;
      bottom: -390px;
      width: 760px;
      height: 610px;
      filter: blur(104px);
      background: radial-gradient(ellipse at 48% 44%, rgba(196, 181, 253, 0.72) 0%, rgba(167, 139, 250, 0.40) 27%, rgba(124, 58, 237, 0.14) 57%, transparent 84%);
    }
    #tce-lobe-three {
      right: -430px;
      bottom: -240px;
      width: 1180px;
      height: 390px;
      filter: blur(88px);
      background: radial-gradient(ellipse at 42% 58%, rgba(99, 102, 241, 0.64) 0%, rgba(124, 58, 237, 0.38) 32%, rgba(167, 139, 250, 0.10) 62%, transparent 86%);
    }
    .tce-ambient {
      position: absolute;
      width: 1060px;
      height: 560px;
      left: 430px;
      top: 590px;
      z-index: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.23) 0%, rgba(124, 58, 237, 0) 72%);
      pointer-events: none;
    }
    .tce-row {
      position: absolute;
      left: 234px;
      top: 334px;
      z-index: 3;
      width: 1452px;
      height: 412px;
      display: flex;
      gap: 64px;
      align-items: stretch;
      overflow: visible;
    }
    .tce-card {
      position: relative;
      flex: 0 0 440px;
      width: 440px;
      height: 412px;
      overflow: hidden;
      border: 2px solid rgba(196, 181, 253, 0.72);
      border-radius: 24px;
      color: var(--text-on-purple);
      background:
        radial-gradient(circle at 18% 10%, rgba(255, 255, 255, 0.08), transparent 36%),
        linear-gradient(145deg, var(--card-bright) 0%, var(--card-mid) 48%, var(--card-deep) 100%);
      box-shadow:
        0 24px 70px rgba(91, 33, 182, 0.24),
        0 10px 34px rgba(124, 58, 237, 0.17),
        inset 0 1px 0 rgba(255, 255, 255, 0.20);
      transform-origin: 50% 50%;
      will-change: transform, opacity, filter;
    }
    #tce-card-1 {
      border-color: rgba(167, 243, 208, 0.72);
    }
    #tce-card-3 {
      border-color: rgba(254, 205, 211, 0.72);
    }
    .tce-card-inner {
      width: 100%;
      height: 100%;
      padding: 54px 42px 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tce-title {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Cabinet Grotesk", sans-serif;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1;
      text-align: center;
    }
    #tce-card-1 .tce-title {
      color: var(--success);
    }
    #tce-card-3 .tce-title {
      color: var(--error);
    }
    .tce-divider {
      width: 100%;
      height: 2px;
      margin-top: 34px;
      background: rgba(255, 255, 255, 0.20);
    }
    .tce-lower {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      padding-top: 32px;
    }
    .tce-icon {
      width: 76px;
      height: 76px;
    }
    .tce-note {
      color: var(--text-secondary);
      font-size: 30px;
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>

          <article id="tce-card-1" class="tce-card" data-layout-allow-overflow="true">

                  <circle cx="40" cy="40" r="29" stroke="#a7f3d0" stroke-width="7"/>

                </svg>

            </div>
          </article>

          <article id="tce-card-2" class="tce-card" data-layout-allow-overflow="true">
            <div class="tce-card-inner">
              <h2 class="tce-title">Pays less</h2>
              <div class="tce-divider"></div>
              <div class="tce-lower">
                <svg class="tce-icon" viewBox="0 0 80 80" fill="none" aria-hidden="true">
                  <path d="M47 7 L20 43 H37 L31 73 L61 34 H44 Z" fill="#c4b5fd"/>
                </svg>
                <p class="tce-note">but move fast</p>
              </div>
            </div>
          </article>

          <article id="tce-card-3" class="tce-card" data-layout-allow-overflow="true">
            <div class="tce-card-inner">
              <h2 class="tce-title">Waste of time</h2>
              <div class="tce-divider"></div>
              <div class="tce-lower">
                <svg class="tce-icon" viewBox="0 0 80 80" fill="none" aria-hidden="true">
                  <path d="M20 20 L60 60 M60 20 L20 60" stroke="#fecdd3" stroke-width="9" stroke-linecap="round"/>
                </svg>
                <p class="tce-note">just skip these</p>
              </div>
            </div>
          </article>
        </div>
      </div>
    </section>
  </div>

  <script>
