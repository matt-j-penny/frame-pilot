<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin="">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800&display=swap" rel="stylesheet">
  <script src="vendor/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }

    /* Transparent overlay — layer over source video in parent composition */
    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    .clip { position: absolute; }

    /* Bottom-aligned word-by-word subtitle strip */
    .subtitle-track {
      position: absolute;
      bottom: 72px;
      left: 0;
      right: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      gap: 0.32em;
      padding: 0 80px;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .sub-w {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 56px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.15;
      text-shadow:
        0 2px 6px rgba(0,0,0,0.55),
        0 6px 28px rgba(0,0,0,0.45);
      will-change: transform, opacity;
    }

    /* REPLACE: use these on individual .sub-w spans for coloured accents */
    .c-purple { color: #c4b5fd; }
    .c-red    { color: #f87171; }
    .c-green  { color: #6ee7b7; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="mg-wbw-subtitle-track" data-start="0" data-duration="5" data-width="1920" data-height="1080">

    <div class="subtitle-track" id="subtitle-track">
      <!--
        REPLACE: words and colour classes.
        Each word needs its own id so it can be individually timed.
        Sync timestamps in the GSAP block below to match your transcript.
      -->
      <span class="sub-w" id="w-01">AI</span>
      <span class="sub-w" id="w-02">doesn't</span>
      <span class="sub-w" id="w-03">fix</span>
      <span class="sub-w" id="w-04">that.</span>
      <span class="sub-w" id="w-05">It</span>
      <span class="sub-w" id="w-06">just</span>
      <span class="sub-w" id="w-07">makes</span>
      <span class="sub-w" id="w-08">the</span>
      <span class="sub-w" id="w-09">confusion</span>
      <span class="sub-w" id="w-10">move</span>
      <span class="sub-w c-red" id="w-11">faster.</span>
    </div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.set('.sub-w', { opacity: 0, y: 14 }, 0);

    // REPLACE: timestamps from transcript (seconds). Each line = one word entering.
    tl.to('#w-01', { opacity: 1, y: 0, duration: 0.20, ease: 'power2.out' }, 0.15);
    tl.to('#w-02', { opacity: 1, y: 0, duration: 0.18, ease: 'power2.out' }, 0.55);
    tl.to('#w-03', { opacity: 1, y: 0, duration: 0.18, ease: 'power2.out' }, 0.85);
    tl.to('#w-04', { opacity: 1, y: 0, duration: 0.20, ease: 'power2.out' }, 1.05);
    tl.to('#w-05', { opacity: 1, y: 0, duration: 0.16, ease: 'power2.out' }, 1.4);
    tl.to('#w-06', { opacity: 1, y: 0, duration: 0.16, ease: 'power2.out' }, 1.55);
    tl.to('#w-07', { opacity: 1, y: 0, duration: 0.20, ease: 'power2.out' }, 1.65);
    tl.to('#w-08', { opacity: 1, y: 0, duration: 0.14, ease: 'power2.out' }, 2.2);
    tl.to('#w-09', { opacity: 1, y: 0, duration: 0.22, ease: 'power3.out' }, 2.45);
    tl.to('#w-10', { opacity: 1, y: 0, duration: 0.18, ease: 'power2.out' }, 3.1);
    tl.to('#w-11', { opacity: 1, y: 0, duration: 0.22, ease: 'power3.out' }, 3.35);

    // All words exit together 1s after last word
    tl.to('#subtitle-track', { opacity: 0, y: 24, duration: 0.45, ease: 'power2.in' }, 4.35);

    window.__timelines['mg-wbw-subtitle-track'] = tl;
  </script>
<!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
