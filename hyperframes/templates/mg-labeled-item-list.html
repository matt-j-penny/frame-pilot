<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin="">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <script src="vendor/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f8f9fb; }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #f8f9fb;
      background-image:
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clip { position: absolute; }

    .list-fs {
      text-align: center;
      padding: 40px 100px;
      max-width: 1100px;
      will-change: transform, opacity;
    }

    .section-label {
      font-family: 'Satoshi', sans-serif;
      font-size: 28px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #7c3aed;
      margin-bottom: 56px;
      display: block;
      will-change: transform, opacity;
    }

    .item-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 36px;
      text-align: left;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Each item: bold title + muted description, purple left border */
    .item-list li {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-left: 28px;
      border-left: 4px solid #7c3aed;
      will-change: transform, opacity;
    }

    .item-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 56px;
      font-weight: 800;
      color: #111111;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .item-desc {
      font-family: 'Satoshi', sans-serif;
      font-size: 32px;
      font-weight: 500;
      color: rgba(0,0,0,0.55);
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="mg-labeled-item-list" data-start="0" data-duration="7" data-width="1920" data-height="1080">

    <div class="list-fs" id="list-fs">
      <!-- REPLACE: section label -->
      <span class="section-label" id="list-label">AI trains on</span>
      <ul class="item-list">
        <!-- REPLACE: items — each needs an id for staggered timing -->
        <li id="li-1">
          <span class="item-title">Blog articles</span>
          <span class="item-desc">Open web — anyone can publish</span>
        </li>
        <li id="li-2">
          <span class="item-title">Reddit threads</span>
          <span class="item-desc">Unverified opinions &amp; anecdotes</span>
        </li>
        <li id="li-3">
          <span class="item-title">Social media &amp; forums</span>
          <span class="item-desc">Content literally anyone can write</span>
        </li>
      </ul>
    </div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.from('#list-label', { opacity: 0, y: 20, duration: 0.4, ease: 'power2.out' }, 0);
    // REPLACE: timestamps to match voiceover
    tl.from('#li-1', { opacity: 0, y: 28, duration: 0.5, ease: 'power3.out' }, 0.3);
    tl.from('#li-2', { opacity: 0, y: 28, duration: 0.5, ease: 'power3.out' }, 1.3);
    tl.from('#li-3', { opacity: 0, y: 28, duration: 0.5, ease: 'power3.out' }, 2.3);
    tl.to('#list-fs', { opacity: 0, y: -28, scale: 0.96, duration: 0.45, ease: 'power2.in', transformOrigin: 'center center' }, 6.1);

    window.__timelines['mg-labeled-item-list'] = tl;
  </script>
<!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
