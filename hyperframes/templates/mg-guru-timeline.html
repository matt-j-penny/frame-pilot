<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin="">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800&f[]=satoshi@400,700&display=swap" rel="stylesheet">
  <script src="vendor/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f8f9fb; }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #f8f9fb;
      background-image:
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clip { position: absolute; }

    .timeline-wrap { width: 1440px; }

    .tl-row {
      display: flex;
      align-items: center;
      margin-bottom: 44px;
    }

    .tl-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
      will-change: transform, opacity;
    }
    /* REPLACE: dot colours to match your left/right labels */
    .dot-left  { background: #10b981; }
    .dot-right { background: #ef4444; }

    .tl-line {
      flex: 1;
      height: 5px;
      /* REPLACE: gradient colours to match left/right dot colours */
      background: linear-gradient(90deg, #10b981 0%, #ef4444 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
    }

    /* REPLACE: pill label text */
    .tl-pill {
      flex-shrink: 0;
      padding: 16px 44px;
      background: #ef4444;
      border-radius: 10px;
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
      opacity: 0;
      will-change: transform, opacity;
    }

    .tl-labels {
      display: flex;
      justify-content: space-between;
    }

    .tl-label { width: 440px; will-change: transform, opacity; }
    .tl-label-right { text-align: right; }

    .tl-title {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 48px;
      font-weight: 800;
      color: #111111;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 14px;
    }

    .tl-desc {
      font-family: 'Satoshi', sans-serif;
      font-size: 26px;
      font-weight: 400;
      color: #666666;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="mg-guru-timeline" data-start="0" data-duration="7" data-width="1920" data-height="1080">

    <div class="timeline-wrap">
      <div class="tl-row">
        <div class="tl-dot dot-left"  id="dot-left"></div>
        <div class="tl-line" id="tl-line">
          <!-- REPLACE: gap pill label -->
          <div class="tl-pill" id="tl-pill">← THE GAP →</div>
        </div>
        <div class="tl-dot dot-right" id="dot-right"></div>
      </div>
      <div class="tl-labels">
        <div class="tl-label" id="label-left">
          <!-- REPLACE: left label title and description -->
          <div class="tl-title">WHAT GURUS SAY</div>
          <div class="tl-desc">Overnight transformation</div>
        </div>
        <div class="tl-label tl-label-right" id="label-right">
          <!-- REPLACE: right label title and description -->
          <div class="tl-title">REALITY</div>
          <div class="tl-desc">Months of iteration</div>
        </div>
      </div>
    </div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.set('#dot-left, #dot-right', { scale: 0, transformOrigin: 'center center' }, 0);
    tl.set('#tl-line', { scaleX: 0, transformOrigin: 'left center', opacity: 0 }, 0);
    tl.set('#label-left, #label-right', { opacity: 0, x: 0 }, 0);

    // REPLACE: timestamps to match voiceover
    tl.from('#label-left',  { opacity: 0, x: -22, duration: 0.45, ease: 'power2.out' }, 0.2);
    tl.to('#dot-left',      { scale: 1, opacity: 1, duration: 0.28, ease: 'back.out(2)', transformOrigin: 'center center' }, 0.2);
    tl.to('#tl-line',       { scaleX: 1, opacity: 1, duration: 0.75, ease: 'expo.out', transformOrigin: 'left center' }, 0.8);
    tl.from('#label-right', { opacity: 0, x: 22, duration: 0.45, ease: 'power2.out' }, 1.6);
    tl.to('#dot-right',     { scale: 1, opacity: 1, duration: 0.28, ease: 'back.out(2)', transformOrigin: 'center center' }, 1.6);
    tl.to('#tl-pill',       { opacity: 1, scale: 1, duration: 0.38, ease: 'back.out(2.2)', transformOrigin: 'center center' }, 3.2);
    // Exit
    tl.to('.timeline-wrap', { opacity: 0, y: -18, duration: 0.4, ease: 'power2.in' }, 6.2);

    window.__timelines['mg-guru-timeline'] = tl;
  </script>
<!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
