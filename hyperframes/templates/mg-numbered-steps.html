<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin="">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800&f[]=satoshi@400,600,700&display=swap" rel="stylesheet">
  <script src="vendor/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f8f9fb; }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #f8f9fb;
      background-image:
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clip { position: absolute; }

    .steps-fs {
      text-align: center;
      padding: 40px 120px;
      max-width: 1100px;
      will-change: transform, opacity;
    }

    .steps-label {
      font-family: 'Satoshi', sans-serif;
      font-size: 28px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #7c3aed;
      margin-bottom: 56px;
      display: block;
      will-change: transform, opacity;
    }

    .steps-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 32px;
      margin: 0;
      padding: 0;
      text-align: left;
    }

    .steps-list > li {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 64px;
      font-weight: 800;
      color: #111111;
      display: flex;
      align-items: flex-start;
      gap: 24px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      will-change: transform, opacity;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #7c3aed;
      flex-shrink: 0;
      margin-top: 0.45em;
    }

    /* Optional sub-items under a step */
    .item-body {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sublist {
      list-style: none;
      margin: 0;
      padding: 0 0 0 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sublist li {
      font-family: 'Satoshi', sans-serif;
      font-size: 34px;
      font-weight: 600;
      color: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      gap: 14px;
      line-height: 1.35;
      will-change: transform, opacity;
    }

    .sub-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7c3aed;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="mg-numbered-steps" data-start="0" data-duration="10" data-width="1920" data-height="1080">

    <div class="steps-fs" id="steps-fs">
      <!-- REPLACE: section label -->
      <span class="steps-label" id="steps-label">The right order</span>
      <ul class="steps-list">
        <!-- REPLACE: step text. Sub-items are optional — delete .item-body / .sublist if not needed -->
        <li id="step-1"><span class="dot"></span>1. Run it manually</li>
        <li id="step-2">
          <span class="dot"></span>
          <div class="item-body">
            <span>2. Document it</span>
            <ul class="sublist">
              <li id="sub-1"><span class="sub-dot"></span>Know what good output looks like</li>
              <li id="sub-2"><span class="sub-dot"></span>Know what a bad one looks like</li>
              <li id="sub-3"><span class="sub-dot"></span>See what might break</li>
            </ul>
          </div>
        </li>
        <li id="step-3"><span class="dot"></span>3. Then automate</li>
      </ul>
    </div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.from('#steps-label', { opacity: 0, y: 20, duration: 0.4, ease: 'power2.out' }, 0);
    // REPLACE: timestamps to match voiceover
    tl.from('#step-1',  { opacity: 0, y: 32, duration: 0.5, ease: 'power3.out' }, 0.4);
    tl.from('#step-2',  { opacity: 0, y: 32, duration: 0.5, ease: 'power3.out' }, 1.8);
    tl.from('#sub-1',   { opacity: 0, y: 24, duration: 0.4, ease: 'power3.out' }, 2.8);
    tl.from('#sub-2',   { opacity: 0, y: 24, duration: 0.4, ease: 'power3.out' }, 3.6);
    tl.from('#sub-3',   { opacity: 0, y: 24, duration: 0.4, ease: 'power3.out' }, 4.5);
    tl.from('#step-3',  { opacity: 0, y: 32, duration: 0.5, ease: 'power3.out' }, 7.0);
    tl.to('#steps-fs',  { opacity: 0, y: -28, scale: 0.96, duration: 0.45, ease: 'power2.in', transformOrigin: 'center center' }, 9.1);

    window.__timelines['mg-numbered-steps'] = tl;
  </script>
<!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
