<!DOCTYPE html>
<html lang="en" data-composition-variables="[
    {&quot;id&quot;:&quot;tag1&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Tag 1&quot;,&quot;default&quot;:&quot;Quit&quot;},
    {&quot;id&quot;:&quot;tag2&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Tag 2&quot;,&quot;default&quot;:&quot;Part-time&quot;},
    {&quot;id&quot;:&quot;tag3&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Tag 3&quot;,&quot;default&quot;:&quot;Stay full-time&quot;},
    {&quot;id&quot;:&quot;chipColor&quot;,&quot;type&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Chip color&quot;,&quot;default&quot;:&quot;#c8ebc0&quot;},
    {&quot;id&quot;:&quot;textColor&quot;,&quot;type&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Text color&quot;,&quot;default&quot;:&quot;#1f8a1f&quot;}
  ]">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script>
      window.__timelines = window.__timelines || {};
      if (!window.__hyperframes) {
        const decl = JSON.parse(document.documentElement.getAttribute("data-composition-variables") || "[]");
        const vals = Object.fromEntries(decl.map((d) => [d.id, d.default]));
        decl.forEach((d) => document.documentElement.style.setProperty("--" + d.id, d.default));
        window.__hyperframes = { getVariables: () => vals };
      }
    </script>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces.ttf") format("truetype"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; }
      #stack { position: absolute; left: 116px; top: 200px; display: flex; flex-direction: column; align-items: flex-start; gap: 92px; }
      .chip {
        background: var(--chipColor); color: var(--textColor);
        font-family: "Fraunces", serif; font-weight: 500; font-size: 72px; line-height: 1.02; text-align: center;
        padding: 22px 48px 26px; opacity: 0; border-radius: 24px; max-width: 520px; transform-origin: left center;
      }
      .preview-talking-head { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.8" data-width="1920" data-height="1080">
      <img class="preview-talking-head" data-preview-only src="assets/talking-head-placeholder.png" alt="" />
      <div id="stack">
        <div class="chip" id="c1" data-var-text="tag1">Quit</div>
        <div class="chip" id="c2" data-var-text="tag2">Part-time</div>
        <div class="chip" id="c3" data-var-text="tag3">Stay full-time</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const from = { opacity: 0, scale: 0.9, y: 10 };
      const pop = { opacity: 1, scale: 1, y: 0, duration: 0.22, ease: "power2.out" };
      tl.fromTo("#c1", from, pop, 0);
      tl.fromTo("#c2", from, pop, 0.85);
      tl.fromTo("#c3", from, pop, 4.1);
      tl.to("#stack", { opacity: 0, duration: 0.15, ease: "power1.in" }, 4.62);
      window.__timelines["main"] = tl;
    </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
