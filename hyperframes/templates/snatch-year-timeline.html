<!DOCTYPE html>
<html lang="en" data-composition-variables="[
    {&quot;id&quot;:&quot;year1&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Year 1&quot;,&quot;default&quot;:&quot;2017&quot;},
    {&quot;id&quot;:&quot;year2&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Year 2&quot;,&quot;default&quot;:&quot;2020&quot;},
    {&quot;id&quot;:&quot;year3&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Year 3&quot;,&quot;default&quot;:&quot;2026&quot;},
    {&quot;id&quot;:&quot;photo1&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Photo 1&quot;,&quot;default&quot;:&quot;assets/snatched/photo-portrait.svg&quot;},
    {&quot;id&quot;:&quot;photo2&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Photo 2&quot;,&quot;default&quot;:&quot;assets/snatched/photo-portrait.svg&quot;},
    {&quot;id&quot;:&quot;photo3&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Photo 3&quot;,&quot;default&quot;:&quot;assets/snatched/photo-portrait.svg&quot;},
    {&quot;id&quot;:&quot;bgColor&quot;,&quot;type&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Background&quot;,&quot;default&quot;:&quot;#f8f6f3&quot;},
    {&quot;id&quot;:&quot;swooshColor&quot;,&quot;type&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Swoosh&quot;,&quot;default&quot;:&quot;#ece6e2&quot;},
    {&quot;id&quot;:&quot;inkColor&quot;,&quot;type&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Ink&quot;,&quot;default&quot;:&quot;#111111&quot;}
  ]">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script>
      window.__timelines = window.__timelines || {};
      if (!window.__hyperframes) {
        const decl = JSON.parse(document.documentElement.getAttribute("data-composition-variables") || "[]");
        const vals = Object.fromEntries(decl.map((d) => [d.id, d.default]));
        decl.forEach((d) => document.documentElement.style.setProperty("--" + d.id, d.default));
        window.__hyperframes = { getVariables: () => vals };
      }
    </script>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Caveat"; src: url("assets/fonts/Caveat.ttf") format("truetype"); font-weight: 400 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bgColor); }
      #root { position: relative; width: 100%; height: 100%; background: var(--bgColor); color: var(--inkColor); }
      #swoosh { position: absolute; inset: 0; }
      #swoosh path { fill: var(--swooshColor); }
      .item { position: absolute; top: 230px; width: 330px; }
      .item img { display: block; width: 330px; height: 730px; object-fit: cover; margin-top: 6px; }
      .yr { font-family: "Caveat", cursive; font-weight: 500; font-size: 84px; line-height: 1; margin-left: 4px; }
      #i1 { left: 386px; }
      #i2 { left: 766px; }
      #i3 { left: 1146px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.2" data-width="1920" data-height="1080">
      <svg id="swoosh" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <path d="M0 980 C 600 900, 1200 500, 1920 80 L 1920 520 C 1300 760, 900 1000, 700 1080 L 0 1080 Z" />
      </svg>
      <div class="item" id="i1"><div class="yr" data-var-text="year1">2017</div><img data-var-src="photo1" src="assets/snatched/photo-portrait.svg" alt=""></div>
      <div class="item" id="i2"><div class="yr" data-var-text="year2">2020</div><img data-var-src="photo2" src="assets/snatched/photo-portrait.svg" alt=""></div>
      <div class="item" id="i3"><div class="yr" data-var-text="year3">2026</div><img data-var-src="photo3" src="assets/snatched/photo-portrait.svg" alt=""></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#swoosh", { x: -60 }, { x: 0, duration: 6.2, ease: "none" }, 0);
      [0, 1.5, 4.0].forEach((t, i) => {
        const id = `#i${i + 1}`;
        tl.fromTo(`${id} img`, { opacity: 0, x: 20, scale: 0.95 }, { opacity: 1, x: 0, scale: 1, duration: 0.25, ease: "power2.out" }, t);
        tl.fromTo(`${id} .yr`, { opacity: 0, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.35, ease: "power1.out" }, t + 0.5);
      });
      window.__timelines["main"] = tl;
    </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
