<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Horseshoe Text Overlay</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Satoshi";
        src: url("assets/fonts/Satoshi-Bold.woff2") format("woff2");
        font-style: normal;
        font-weight: 700;
        font-display: block;
      }

      :root {
        --text: #fafafa;
        --text-glow: rgba(250, 250, 250, 0.34);
        --accent-glow: rgba(124, 58, 237, 0.52);
        --shadow: rgba(8, 6, 19, 0.68);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: #080613;
      }

      #horseshoe-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        isolation: isolate;
        background: #080613;
      }

      #video-frame {
        position: absolute;
        z-index: 0;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        transform-origin: center center;
        will-change: transform;
      }

      #source-video {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .scene-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        width: 100%;
        height: 100%;
        padding: 120px 330px 118px;
        box-sizing: border-box;
      }

      .horseshoe {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        width: 100%;
        height: 350px;
      }

      .label {
        align-self: center;
        justify-self: center;
        max-width: 240px;
        margin: 0;
        color: var(--text);
        font-family: "Satoshi", sans-serif;
        font-size: 44px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.025em;
        text-align: center;
        text-wrap: balance;
        text-shadow:
          0 3px 7px var(--shadow),
          0 0 10px var(--text-glow),
          0 0 24px var(--accent-glow);
        will-change: transform, opacity;
      }

      .label-1 {
        grid-column: 1;
        grid-row: 1;
      }

      .label-2 {
        grid-column: 2;
        grid-row: 2;
      }

      .label-3 {
        grid-column: 3;
        grid-row: 3;
      }

      .label-4 {
        grid-column: 4;
        grid-row: 2;
      }

      .label-5 {
        grid-column: 5;
        grid-row: 1;
      }
    </style>
  </head>
  <body>
    <main
      id="horseshoe-root"
      data-composition-id="horseshoe-text-overlay"
      data-start="0"
      data-duration="9.5"
      data-width="1920"
      data-height="1080"
      aria-label="Five text labels arranged around a centered presenter"
    >
      <div id="video-frame">
        <!-- REPLACE: swap src with the final talking-head video. -->
        <video
          id="source-video"
          class="clip"
          src="assets/placeholder-video.mp4"
          poster="assets/talking-head-placeholder.png"
          muted
          playsinline
          preload="auto"
          data-start="0"
          data-duration="9.5"
          data-track-index="0"
        ></video>
      </div>

      <audio
        id="source-audio"
        class="clip"
        src="assets/placeholder-video.mp4"
        preload="auto"
        data-start="0"
        data-duration="9.5"
        data-track-index="2"
        data-volume="1"
      ></audio>

      <audio
        id="sfx-label-1"
        class="clip"
        src="assets/sfx/cartoony pop.m4a"
        preload="auto"
        data-start="0.68"
        data-duration="0.32"
        data-track-index="3"
        data-volume="0.14"
      ></audio>
      <audio
        id="sfx-label-2"
        class="clip"
        src="assets/sfx/cartoony pop.m4a"
        preload="auto"
        data-start="1.68"
        data-duration="0.32"
        data-track-index="3"
        data-volume="0.14"
      ></audio>
      <audio
        id="sfx-label-3"
        class="clip"
        src="assets/sfx/cartoony pop.m4a"
        preload="auto"
        data-start="2.68"
        data-duration="0.32"
        data-track-index="3"
        data-volume="0.14"
      ></audio>
      <audio
        id="sfx-label-4"
        class="clip"
        src="assets/sfx/cartoony pop.m4a"
        preload="auto"
        data-start="3.68"
        data-duration="0.32"
        data-track-index="3"
        data-volume="0.14"
      ></audio>
      <audio
        id="sfx-label-5"
        class="clip"
        src="assets/sfx/cartoony pop.m4a"
        preload="auto"
        data-start="4.68"
        data-duration="0.32"
        data-track-index="3"
        data-volume="0.14"
      ></audio>

      <section class="scene-content">
        <div class="horseshoe" aria-label="Communication formats">
          <!-- REPLACE: edit the five labels below. -->
          <p class="label label-1">public<br />speeches</p>
          <p class="label label-2">YouTube<br />videos</p>
          <p class="label label-3">sales<br />presentations</p>
          <p class="label label-4">emails</p>
          <p class="label label-5">campfire<br />stories</p>
        </div>
      </section>
    </main>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });
      const labels = gsap.utils.toArray(".label");

      // Camera: a restrained push-in that preserves the centered subject.
      tl.fromTo(
        "#video-frame",
        { scale: 1 },
        {
          scale: 1.08,
          duration: 0.92,
          ease: "expo.inOut",
          transformOrigin: "center center",
        },
        0.2,
      );

      // Build: labels arrive one by one around the presenter.
      tl.fromTo(
        ".label-1",
        { autoAlpha: 0, x: -52, y: -14, rotation: -4.5, scale: 0.9 },
        { autoAlpha: 1, x: 0, y: 0, rotation: 0, scale: 1, duration: 0.62, ease: "expo.out" },
        0.68,
      );
      tl.fromTo(
        ".label-2",
        { autoAlpha: 0, x: -32, y: 28, rotation: -3, scale: 0.92 },
        { autoAlpha: 1, x: 0, y: 0, rotation: 0, scale: 1, duration: 0.56, ease: "power3.out" },
        1.68,
      );
      tl.fromTo(
        ".label-3",
        { autoAlpha: 0, y: 44, rotation: -1.5, scale: 0.84 },
        { autoAlpha: 1, y: 0, rotation: 0, scale: 1, duration: 0.66, ease: "back.out(1.35)" },
        2.68,
      );
      tl.fromTo(
        ".label-4",
        { autoAlpha: 0, x: 32, y: 28, rotation: 3, scale: 0.92 },
        { autoAlpha: 1, x: 0, y: 0, rotation: 0, scale: 1, duration: 0.54, ease: "circ.out" },
        3.68,
      );
      tl.fromTo(
        ".label-5",
        { autoAlpha: 0, x: 52, y: -14, rotation: 4.5, scale: 0.9 },
        { autoAlpha: 1, x: 0, y: 0, rotation: 0, scale: 1, duration: 0.6, ease: "power4.out" },
        4.68,
      );

      // Breathe: each label begins moving only after it reaches its slot.
      tl.to(".label-1", { x: 4, y: -7, rotation: -0.9, duration: 1.1, repeat: 5, yoyo: true, ease: "sine.inOut" }, 1.38);
      tl.to(".label-2", { x: -4, y: 6, rotation: 0.75, duration: 0.95, repeat: 5, yoyo: true, ease: "power1.inOut" }, 2.3);
      tl.to(".label-3", { x: 3, y: -5, rotation: 0.55, duration: 1.145, repeat: 3, yoyo: true, ease: "sine.inOut" }, 3.4);
      tl.to(".label-4", { x: 4, y: 7, rotation: -0.75, duration: 0.925, repeat: 3, yoyo: true, ease: "power1.inOut" }, 4.28);
      tl.to(".label-5", { x: -4, y: -6, rotation: 0.9, duration: 0.88, repeat: 2, yoyo: true, ease: "sine.inOut" }, 5.34);

      // Resolve: clear the overlay, then return the background to 100%.
      tl.to(
        labels,
        {
          autoAlpha: 0,
          y: 30,
          scale: 0.96,
          duration: 0.44,
          stagger: 0.055,
          ease: "power3.in",
        },
        8.1,
      );
      tl.set(labels, { autoAlpha: 0 }, 8.78);
      tl.to(
        "#video-frame",
        {
          scale: 1,
          duration: 0.92,
          ease: "expo.inOut",
          transformOrigin: "center center",
        },
        8.3,
      );

      window.__timelines["horseshoe-text-overlay"] = tl;
    </script>

    <!-- hf-autoplay -->
    <script>
      (function () {
        if (window.self === window.top) return;
        function play() {
          var timelines = window.__timelines || {};
          var ids = Object.keys(timelines);
          if (!ids.length) {
            setTimeout(play, 150);
            return;
          }
          ids.forEach(function (id) {
            var timeline = timelines[id];
            timeline.eventCallback("onComplete", function () {
              setTimeout(play, 1200);
            });
            timeline.restart();
          });
        }
        setTimeout(play, 200);
      })();
    </script>
  </body>
</html>
