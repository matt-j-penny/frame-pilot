<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Perspective Ranked List — 9:16</title>
  <script src="vendor/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: "Cabinet Grotesk";
      src: url("assets/fonts/CabinetGrotesk-ExtraBold.woff2") format("woff2");
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }

    @font-face {
      font-family: "Satoshi";
      src: url("assets/fonts/Satoshi-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }

    :root {
      --prl-canvas: #fafafa;
      --prl-ink: #1a1a2e;
      --prl-accent: #7c3aed;
      --prl-accent-dark: #5b21b6;
      --prl-accent-light: #a78bfa;
      --prl-accent-pale: #ede9fe;
      --prl-white: #ffffff;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--prl-canvas);
    }

    #prl-root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    /* ── TOP HALF: ranked list ── */
    #graphic-zone {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 864px;
      overflow: hidden;
      z-index: 2;
      will-change: transform, opacity;
    }

    .prl-background {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background-color: var(--prl-canvas);
      background-image:
        linear-gradient(rgba(124, 58, 237, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 58, 237, 0.045) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .prl-glow {
      position: absolute;
      right: -110px;
      top: -180px;
      width: 720px;
      height: 720px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(167, 139, 250, 0.3) 0%,
        rgba(237, 233, 254, 0.22) 46%,
        rgba(237, 233, 254, 0) 70%
      );
      will-change: transform, opacity;
    }

    .prl-perspective-lines {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 560px;
      height: 340px;
      overflow: visible;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .prl-perspective-lines .prl-ray {
      fill: none;
      stroke: var(--prl-accent);
      stroke-width: 2;
      opacity: 0.1;
      vector-effect: non-scaling-stroke;
    }

    .prl-perspective-lines .prl-arc {
      fill: none;
      stroke: var(--prl-accent-light);
      stroke-width: 3;
      opacity: 0.16;
      vector-effect: non-scaling-stroke;
    }

    .prl-perspective-lines .prl-anchor {
      fill: var(--prl-accent);
      opacity: 0.5;
    }

    /* REPLACE: ghost number should match the number of rows */
    .prl-ghost-mark {
      position: absolute;
      right: 68px;
      bottom: -34px;
      color: rgba(124, 58, 237, 0.055);
      font-family: "Cabinet Grotesk", sans-serif;
      font-size: 310px;
      font-weight: 800;
      line-height: 0.8;
      letter-spacing: -0.075em;
      user-select: none;
      will-change: transform, opacity;
    }

    .prl-scene-content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      padding: 90px 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      perspective-origin: 50% 40%;
      will-change: transform, opacity;
    }

    .prl-plane {
      width: 940px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      list-style: none;
      transform:
        rotateX(10.5deg)
        rotateY(-1.4deg)
        rotateZ(-0.45deg);
      transform-origin: 50% 44%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .prl-row {
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr);
      align-items: center;
      gap: 24px;
      transform-style: preserve-3d;
      will-change: transform, opacity;
    }

    .prl-rank {
      color: var(--prl-accent);
      font-family: "Cabinet Grotesk", sans-serif;
      font-size: 60px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      text-align: right;
      text-shadow: 0 6px 17px rgba(124, 58, 237, 0.13);
      font-variant-numeric: tabular-nums;
      transform: translateZ(16px);
    }

    .prl-entry {
      position: relative;
      height: 104px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 40px;
      overflow: hidden;
      border: 3px solid var(--prl-accent-dark);
      border-radius: 22px;
      background: var(--prl-accent);
      box-shadow:
        0 6px 0 var(--prl-accent-dark),
        0 16px 34px rgba(124, 58, 237, 0.2),
        inset 0 3px 0 rgba(255, 255, 255, 0.14);
      color: var(--prl-white);
      font-family: "Cabinet Grotesk", sans-serif;
      font-size: 54px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.025em;
      text-align: center;
      white-space: nowrap;
      transform: translateZ(3px);
    }

    .prl-entry::before,
    .prl-entry::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.34);
      transform: translateY(-50%);
    }

    .prl-entry::before {
      left: 22px;
    }

    .prl-entry::after {
      right: 22px;
    }

    /* ── BOTTOM HALF: talking head ── */
    #talking-head {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0a0a0f;
      z-index: 1;
    }

    #talking-head video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <main
    id="prl-root"
    data-composition-id="mg-perspective-ranked-list-9x16"
    data-start="0"
    data-duration="6.3"
    data-width="1080"
    data-height="1920"
    data-fps="30"
    aria-label="Animated perspective ranked list"
  >
    <div id="graphic-zone" data-layout-allow-overflow>
      <div class="prl-background" id="prl-background">
        <div class="prl-glow" id="prl-glow" data-layout-ignore></div>

        <svg
          class="prl-perspective-lines"
          id="prl-lines"
          viewBox="0 0 820 500"
          preserveAspectRatio="none"
          aria-hidden="true"
          data-layout-ignore
        >
          <path class="prl-ray" d="M-35 500 L560 48"></path>
          <path class="prl-ray" d="M82 500 L588 102"></path>
          <path class="prl-ray" d="M206 500 L620 169"></path>
          <path class="prl-ray" d="M343 500 L654 248"></path>
          <path class="prl-arc" d="M-96 416 C117 452 317 377 456 257"></path>
          <path class="prl-arc" d="M-90 455 C153 488 378 402 524 279"></path>
          <circle class="prl-anchor" cx="456" cy="257" r="5"></circle>
          <circle class="prl-anchor" cx="524" cy="279" r="3"></circle>
        </svg>

        <div class="prl-ghost-mark" id="prl-ghost-mark" aria-hidden="true" data-layout-ignore>03</div>
      </div>

      <section class="prl-scene-content" id="prl-scene-content">
        <ol class="prl-plane" id="prl-plane">
          <!-- REPLACE: rank and label text. Keep unique prl-prefixed ids when adding or removing rows. -->
          <li class="prl-row" id="prl-row-1">
            <span class="prl-rank" aria-hidden="true">1.</span>
            <div class="prl-entry">Whop</div>
          </li>
          <li class="prl-row" id="prl-row-2">
            <span class="prl-rank" aria-hidden="true">2.</span>
            <div class="prl-entry">Reach.cat</div>
          </li>
          <li class="prl-row" id="prl-row-3">
            <span class="prl-rank" aria-hidden="true">3.</span>
            <div class="prl-entry">Vyro</div>
          </li>
        </ol>
      </section>
    </div>

    <!-- REPLACE: swap src/poster for your own talking-head footage -->
    <div id="talking-head">
      <video
        id="source-video"
        class="clip"
        src="assets/placeholder-video.mp4"
        poster="assets/talking-head-placeholder.png"
        muted
        playsinline
        preload="auto"
        data-start="0"
        data-duration="6.3"
        data-track-index="0"
      ></video>
    </div>
  </main>

  <script>
    window.__timelines = window.__timelines || {};

    const prlTimeline = gsap.timeline({
      paused: true,
      defaults: { ease: "power3.out" },
    });
    gsap.set("#graphic-zone", { autoAlpha: 1, y: -864 });
    prlTimeline.to(
      "#graphic-zone",
      { autoAlpha: 1, y: 0, duration: 0.8, ease: "expo.out" },
      0.14,
    );
    /* ── SPLIT FRAMING — REPLACE per project ──────────────────────────────
       This is a 45/55 split: the graphic covers the top 864px of the canvas; the footage shows
       through the 1080×864 window below it. SPLIT_SHIFT slides the footage
       down so the speaker's face lands inside that window.

       SPLIT_SCALE must stay at 1. Any value below 1 narrows the footage
       inside its 1080px frame and exposes bars down both sides.
       SPLIT_SHIFT must stay within 0…864, which is the range that keeps
       the window fully covered — outside it the footage pulls off an edge.

       For real footage, read both values off the actual face position:
         python3 scripts/face-frame.py <video> --window 864:1920
       ────────────────────────────────────────────────────────────────── */
    const SPLIT_SHIFT = 700;   /* px the footage travels down (0…864) */
    const SPLIT_SCALE = 1;     /* never below 1 — see above */

    prlTimeline.fromTo(
      "#talking-head video",
      { y: 0, scale: 1 },
      { y: SPLIT_SHIFT, scale: SPLIT_SCALE, duration: 0.8, ease: "expo.out" },
      0.14,
    );

    prlTimeline.fromTo(
      "#prl-glow",
      { opacity: 0, x: 48, y: -18, scale: 0.88 },
      { opacity: 1, x: 0, y: 0, scale: 1, duration: 1.05, ease: "power2.out" },
      0.08,
    );

    prlTimeline.fromTo(
      "#prl-ghost-mark",
      { opacity: 0, y: 28 },
      { opacity: 1, y: 0, duration: 0.9, ease: "sine.out" },
      0.16,
    );

    prlTimeline.fromTo(
      "#prl-lines",
      { opacity: 0, x: -22, y: 14 },
      { opacity: 1, x: 0, y: 0, duration: 0.9, ease: "power2.out" },
      0.18,
    );

    prlTimeline.fromTo(
      "#prl-plane",
      {
        y: 40,
        scale: 0.96,
        rotationX: 15.5,
        rotationY: -4.2,
        rotationZ: -1.1,
      },
      {
        y: 0,
        scale: 1,
        rotationX: 10.5,
        rotationY: -1.4,
        rotationZ: -0.45,
        duration: 1.15,
        ease: "power3.out",
      },
      0.12,
    );

    const prlRows = [
      "#prl-row-1",
      "#prl-row-2",
      "#prl-row-3",
    ];

    prlTimeline.set(prlRows, { opacity: 0 }, 0);
    prlRows.forEach(function (row, index) {
      const rowStart = 0.34 + index * 0.28;
      prlTimeline.set(
        row,
        {
          opacity: 1,
          x: 82,
          y: 16,
          z: -95,
          rotationY: -4,
        },
        rowStart,
      );
      prlTimeline.to(
        row,
        {
          x: 0,
          y: 0,
          z: 0,
          rotationY: 0,
          duration: 0.62,
          ease: "power4.out",
        },
        rowStart,
      );
    });

    /* Smooth camera-like plane movement across the hold. */
    prlTimeline.to(
      "#prl-plane",
      {
        y: -8,
        rotationX: 8.9,
        rotationY: 0.8,
        rotationZ: 0.22,
        duration: 1.6,
        ease: "sine.inOut",
      },
      1.9,
    );

    prlTimeline.to(
      "#prl-plane",
      {
        y: 3,
        rotationX: 11.2,
        rotationY: -1.8,
        rotationZ: -0.3,
        duration: 1.3,
        ease: "sine.inOut",
      },
      3.6,
    );

    /* Independent atmospheric drift keeps the background gently alive. */
    prlTimeline.to(
      "#prl-glow",
      {
        x: -30,
        y: 20,
        scale: 1.055,
        duration: 2.4,
        ease: "sine.inOut",
      },
      1.0,
    );

    prlTimeline.to(
      "#prl-glow",
      {
        x: 9,
        y: -7,
        scale: 0.985,
        duration: 2.0,
        ease: "sine.inOut",
      },
      3.3,
    );

    prlTimeline.to(
      "#prl-lines",
      {
        x: 12,
        y: -6,
        duration: 4.0,
        ease: "sine.inOut",
      },
      1.1,
    );

    /* Reverse cascade: rows recede into the plane before disappearing. */
    const prlExitRows = prlRows.slice().reverse();
    prlExitRows.forEach(function (row, index) {
      const exitStart = 5.22 + index * 0.06;
      prlTimeline.to(
        row,
        {
          x: -50,
          y: -10,
          z: -210,
          rotationY: 4.5,
          duration: 0.58,
          ease: "power3.inOut",
        },
        exitStart,
      );
      prlTimeline.set(row, { autoAlpha: 0 }, exitStart + 0.58);
    });

    prlTimeline.to(
      "#prl-plane",
      {
        y: -24,
        scale: 0.975,
        rotationX: 15,
        rotationY: -4.2,
        rotationZ: -0.7,
        duration: 0.92,
        ease: "sine.inOut",
      },
      5.12,
    );

    prlTimeline.to(
      "#prl-ghost-mark, #prl-lines, #prl-glow",
      {
        opacity: 0,
        y: -12,
        duration: 0.5,
        ease: "power2.inOut",
      },
      5.6,
    );

    prlTimeline.set("#prl-scene-content", { autoAlpha: 0 }, 6.08);
    prlTimeline.to(
      "#graphic-zone",
      { autoAlpha: 1, y: -864, duration: 0.62, ease: "power3.in" },
      5.58,
    );
    prlTimeline.to(
      "#talking-head video",
      { y: 0, scale: 1, duration: 0.62, ease: "power3.in" },
      5.58,
    );

    window.__timelines["mg-perspective-ranked-list-9x16"] = prlTimeline;
  </script>

  <!-- hf-autoplay -->
  <script>
    (function () {
      if (window.self === window.top) return;
      function play() {
        var timelines = window.__timelines || {};
        var ids = Object.keys(timelines);
        if (!ids.length) {
          setTimeout(play, 150);
          return;
        }
        ids.forEach(function (id) {
          var timeline = timelines[id];
          timeline.eventCallback("onComplete", function () {
            setTimeout(play, 1200);
          });
          timeline.restart();
        });
      }
      setTimeout(play, 200);
    })();
  </script>
</body>
</html>
