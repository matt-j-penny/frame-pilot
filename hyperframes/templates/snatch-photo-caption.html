<!DOCTYPE html>
<html lang="en" data-composition-variables="[
    {&quot;id&quot;:&quot;year&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Handwritten year&quot;,&quot;default&quot;:&quot;2018&quot;},
    {&quot;id&quot;:&quot;label&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Label&quot;,&quot;default&quot;:&quot;Doctor&quot;},
    {&quot;id&quot;:&quot;subLabel&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Handwritten sub-label&quot;,&quot;default&quot;:&quot;United Kingdom&quot;},
    {&quot;id&quot;:&quot;photoA&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Portrait photo&quot;,&quot;default&quot;:&quot;assets/snatched/photo-portrait.svg&quot;},
    {&quot;id&quot;:&quot;photoB&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Landscape photo&quot;,&quot;default&quot;:&quot;assets/snatched/photo-landscape.svg&quot;},
    {&quot;id&quot;:&quot;bgColor&quot;,&quot;type&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Background&quot;,&quot;default&quot;:&quot;#f8f6f3&quot;},
    {&quot;id&quot;:&quot;swooshColor&quot;,&quot;type&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Swoosh&quot;,&quot;default&quot;:&quot;#ece6e2&quot;},
    {&quot;id&quot;:&quot;inkColor&quot;,&quot;type&quot;:&quot;color&quot;,&quot;label&quot;:&quot;Ink&quot;,&quot;default&quot;:&quot;#111111&quot;}
  ]">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script>
      window.__timelines = window.__timelines || {};
      if (!window.__hyperframes) {
        const decl = JSON.parse(document.documentElement.getAttribute("data-composition-variables") || "[]");
        const vals = Object.fromEntries(decl.map((d) => [d.id, d.default]));
        decl.forEach((d) => document.documentElement.style.setProperty("--" + d.id, d.default));
        window.__hyperframes = { getVariables: () => vals };
      }
    </script>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces.ttf") format("truetype"); font-weight: 100 900; }
      @font-face { font-family: "Caveat"; src: url("assets/fonts/Caveat.ttf") format("truetype"); font-weight: 400 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bgColor); }
      #root { position: relative; width: 100%; height: 100%; background: var(--bgColor); color: var(--inkColor); }
      #swoosh { position: absolute; inset: 0; }
      #swoosh path { fill: var(--swooshColor); }
      .photo { position: absolute; object-fit: cover; }
      #pa { left: 311px; top: 192px; width: 532px; height: 709px; }
      #pb { left: 885px; top: 532px; width: 725px; height: 368px; }
      .hand { position: absolute; font-family: "Caveat", cursive; font-weight: 500; white-space: nowrap; }
      #year { left: 318px; top: 88px; font-size: 96px; }
      #sub { right: 282px; top: 905px; font-size: 64px; }
      #label { position: absolute; left: 884px; top: 395px; font-family: "Fraunces", serif; font-weight: 800; font-size: 118px; letter-spacing: -0.01em; }
      .ch { display: inline-block; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.2" data-width="1920" data-height="1080">
      <svg id="swoosh" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <path d="M560 1080 C 980 700, 1300 330, 1920 150 L 1920 640 C 1500 760, 1200 950, 1080 1080 Z" />
      </svg>
      <img class="photo" id="pa" data-var-src="photoA" src="assets/snatched/photo-portrait.svg" alt="">
      <img class="photo" id="pb" data-var-src="photoB" src="assets/snatched/photo-landscape.svg" alt="">
      <div class="hand" id="year"></div>
      <div id="label" data-var-text="label">Doctor</div>
      <div class="hand" id="sub"></div>
    </div>
    <script>
      const { year, subLabel } = window.__hyperframes.getVariables();
      const chars = (id, text) =>
        [...text].map((c) => {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = c;
          s.style.opacity = 0;
          document.getElementById(id).appendChild(s);
          return s;
        });
      const yc = chars("year", year);
      const sc = chars("sub", subLabel);

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#swoosh", { x: -60 }, { x: 0, duration: 3.2, ease: "none" }, 0);
      tl.fromTo("#pa", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 0);
      tl.to(yc, { opacity: 1, duration: 0.05, stagger: 0.06 }, 0.35);
      tl.fromTo("#label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 0.4);
      tl.fromTo("#pb", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 0.6);
      tl.to(sc, { opacity: 1, duration: 0.05, stagger: 0.045 }, 1.0);
      tl.to(["#pa", "#pb", "#year", "#label", "#sub"], { opacity: 0, duration: 0.25, ease: "power1.in" }, 2.95);
      window.__timelines["main"] = tl;
    </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
