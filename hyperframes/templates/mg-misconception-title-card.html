<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin="">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <script src="vendor/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f8f9fb; }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #f8f9fb;
      background-image:
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clip { position: absolute; }

    .card {
      text-align: center;
      padding: 40px 120px;
      max-width: 1440px;
      will-change: transform, opacity;
    }

    .eyebrow {
      font-family: 'Satoshi', sans-serif;
      font-size: 28px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #7c3aed;
      margin-bottom: 28px;
      display: block;
    }

    .rule {
      width: 64px;
      height: 4px;
      background: #7c3aed;
      border-radius: 2px;
      margin: 0 auto 32px;
    }

    .headline {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 120px;
      font-weight: 800;
      color: #111111;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="mg-misconception-title-card" data-start="0" data-duration="5" data-width="1920" data-height="1080">

    <div class="card" id="card">
      <!-- REPLACE: eyebrow text, e.g. "Misconception 1 of 7" -->
      <span class="eyebrow" id="eyebrow">Misconception 1 of 7</span>
      <div class="rule" id="rule"></div>
      <!-- REPLACE: headline text -->
      <h2 class="headline" id="headline">The Time-Saving Fallacy</h2>
    </div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.from('#eyebrow',   { opacity: 0, y: 20,  duration: 0.5, ease: 'power2.out'  }, 0);
    tl.from('#rule',      { scaleX: 0,          duration: 0.4, ease: 'expo.out', transformOrigin: 'left center' }, 0.3);
    tl.from('#headline',  { opacity: 0, y: 40,  duration: 0.7, ease: 'power3.out'  }, 0.4);
    tl.to('#card',        { opacity: 0, y: -28, scale: 0.96, duration: 0.45, ease: 'power2.in', transformOrigin: 'center center' }, 4.1);

    window.__timelines['mg-misconception-title-card'] = tl;
  </script>
<!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
