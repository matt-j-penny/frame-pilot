<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin="">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800&f[]=satoshi@400,600,700&display=swap" rel="stylesheet">
  <script src="vendor/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f8f9fb; }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #f8f9fb;
      background-image:
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clip { position: absolute; }

    .checklist-fs {
      text-align: center;
      padding: 40px 120px;
      max-width: 1200px;
      will-change: transform, opacity;
    }

    .checklist-label {
      font-family: 'Satoshi', sans-serif;
      font-size: 28px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #7c3aed;
      margin-bottom: 48px;
      display: block;
      will-change: transform, opacity;
    }

    .checklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 28px;
      margin: 0;
      padding: 0;
      text-align: left;
    }

    .checklist li {
      font-family: 'Satoshi', sans-serif;
      font-size: 44px;
      font-weight: 600;
      color: #111111;
      display: flex;
      align-items: center;
      gap: 20px;
      line-height: 1.25;
      will-change: transform, opacity;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #7c3aed;
      flex-shrink: 0;
    }
    /* REPLACE: .dot-red or .dot-green for different bullet colours */
    .dot-red   { background: #dc2626; }
    .dot-green { background: #10b981; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="mg-staggered-checklist" data-start="0" data-duration="7" data-width="1920" data-height="1080">

    <div class="checklist-fs" id="checklist-fs">
      <!-- REPLACE: label -->
      <span class="checklist-label" id="cl-label">Fix this before switching models</span>
      <ul class="checklist">
        <!-- REPLACE: list items — add/remove <li> as needed, each gets its own id for staggered timing -->
        <li id="cl-i1"><span class="dot"></span>Are your prompts optimised?</li>
        <li id="cl-i2"><span class="dot"></span>Are you giving enough context?</li>
        <li id="cl-i3"><span class="dot"></span>Are outputs feeding back in?</li>
      </ul>
    </div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.from('#cl-label', { opacity: 0, y: 20, duration: 0.45, ease: 'power2.out' }, 0);
    // REPLACE: adjust timestamps to match transcript timing if synced to voiceover
    tl.from('#cl-i1', { opacity: 0, y: 28, duration: 0.45, ease: 'power3.out' }, 0.3);
    tl.from('#cl-i2', { opacity: 0, y: 28, duration: 0.45, ease: 'power3.out' }, 1.4);
    tl.from('#cl-i3', { opacity: 0, y: 28, duration: 0.45, ease: 'power3.out' }, 3.0);
    tl.to('#checklist-fs', { opacity: 0, y: -28, scale: 0.96, duration: 0.45, ease: 'power2.in', transformOrigin: 'center center' }, 6.1);

    window.__timelines['mg-staggered-checklist'] = tl;
  </script>
<!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
