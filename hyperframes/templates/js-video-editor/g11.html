@font-face{font-family:'Inter';src:url('assets/fonts/Inter-Bold.otf') format('opentype');font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box;}
:root{--txt:#e8f0ff;--muted:#8fa6d4;}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Inter',sans-serif;}
#float{position:absolute;inset:0;will-change:transform;}
.panel{position:absolute;left:120px;top:150px;width:620px;height:380px;

.row{position:absolute;left:40px;width:540px;height:70px;opacity:0;}
.row .chip{position:absolute;left:0;top:9px;width:52px;height:52px;border-radius:50%;overflow:hidden;}

#r1{top:106px;} #r2{top:186px;} #r3{top:266px;}
/* Google chip: 4-quadrant real-sampled colours, glow in each quadrant's own hue */
.gq{position:absolute;width:26px;height:26px;}
.gq.blue{left:0;top:0;background:#4285F4;box-shadow:-6px -6px 14px rgba(66,133,244,0.55);}

.gq.green{left:26px;top:26px;background:#34A853;box-shadow:6px 6px 14px rgba(52,168,83,0.55);}
/* Brave chip: solid sampled orange + white shield glyph */
.chip.brave{background:#FF2000;box-shadow:0 0 12px rgba(255,32,0,0.60), 0 0 24px rgba(255,32,0,0.30);}
.chip.brave svg{position:absolute;left:14px;top:12px;}
/* YouTube chip: solid sampled red + white play glyph */
.chip.yt{background:#FF0000;box-shadow:0 0 12px rgba(255,0,0,0.60), 0 0 24px rgba(255,0,0,0.30);}
.chip.yt svg{position:absolute;left:18px;top:15px;}
