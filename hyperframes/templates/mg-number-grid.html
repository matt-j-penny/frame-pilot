<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin="">
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800&f[]=satoshi@700&display=swap" rel="stylesheet">
  <script src="vendor/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f8f9fb; }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #f8f9fb;
      background-image:
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clip { position: absolute; }

    .num-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
      will-change: transform, opacity;
    }

    /* REPLACE: eyebrow text */
    .grid-eyebrow {
      font-family: 'Satoshi', sans-serif;
      font-size: 38px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #7c3aed;
      text-align: center;
      will-change: transform, opacity;
    }

    .num-row { display: flex; gap: 26px; align-items: center; }

    .num-box {
      width: 190px;
      height: 228px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.13), 0 2px 8px rgba(0,0,0,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 5px solid #7c3aed;
      will-change: transform, opacity;
    }

    .num-box-n {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 108px;
      font-weight: 800;
      color: #7c3aed;
      line-height: 1;
      letter-spacing: -0.04em;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="mg-number-grid" data-start="0" data-duration="4" data-width="1920" data-height="1080">

    <div class="num-grid" id="num-grid">
      <!-- REPLACE: eyebrow text -->
      <div class="grid-eyebrow" id="grid-head">7 Misconceptions About AI</div>
      <div class="num-row">
        <!-- REPLACE: numbers and count. Add/remove .num-box divs to change count (up to ~9 fits at this size). -->
        <div class="num-box" id="n1"><span class="num-box-n">1</span></div>
        <div class="num-box" id="n2"><span class="num-box-n">2</span></div>
        <div class="num-box" id="n3"><span class="num-box-n">3</span></div>
        <div class="num-box" id="n4"><span class="num-box-n">4</span></div>
        <div class="num-box" id="n5"><span class="num-box-n">5</span></div>
        <div class="num-box" id="n6"><span class="num-box-n">6</span></div>
        <div class="num-box" id="n7"><span class="num-box-n">7</span></div>
      </div>
    </div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.set('#grid-head',     { opacity: 0, y: 12 }, 0);
    tl.set('.num-box', { opacity: 0, y: 36, scale: 0.85 }, 0);

    tl.to('#grid-head', { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 0.1);

    // Boxes pop in one by one — REPLACE timestamps per box to match voiceover
    ['n1','n2','n3','n4','n5','n6','n7'].forEach((id, i) => {
      tl.to(`#${id}`, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: 'back.out(1.8)', transformOrigin: 'center bottom' }, 0.3 + i * 0.13);
    });

    tl.to('#num-grid', { opacity: 0, y: -28, scale: 0.96, duration: 0.45, ease: 'power2.in', transformOrigin: 'center center' }, 3.2);

    window.__timelines['mg-number-grid'] = tl;
  </script>
<!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
