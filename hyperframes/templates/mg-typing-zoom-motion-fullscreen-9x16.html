<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>MG: Typing Zoom Motion — Fullscreen — 9:16</title>
  <script src="vendor/gsap.min.js"></script>
  <style>
    :root {
      --field: #fafaf8;
      --paper: #ffffff;
      --ink: #2f302e;
      --muted: #858581;
      --line: #d7d7d4;
      --coral: #da7655;
      --black: #080808;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      overflow: hidden;
      background: var(--field);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    /* ── FULLSCREEN: typing/zoom UI mockup ── */
    #graphic-zone {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      z-index: 2;
      will-change: transform, opacity;
      background: var(--field);
    }

    #stage {
      position: absolute;
      left: -228px;
      top: 528px;
      width: 1536px;
      height: 864px;
      overflow: visible;
      background: var(--field);
    }

    .scene-bg {
      position: absolute;
      inset: 0;
      background: var(--field);
    }

    #ui-clip {
      position: absolute;
      inset: 0;
      overflow: visible;
    }

    #world {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }

    .greeting {
      position: absolute;
      top: 136px;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .sunburst {
      position: relative;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
    }

    .sunburst i {
      position: absolute;
      top: 18px;
      left: 0;
      width: 38px;
      height: 3px;
      border-radius: 999px;
      background: var(--coral);
      transform: rotate(calc(var(--n) * 22.5deg));
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 51px;
      font-weight: 400;
      line-height: .95;
      letter-spacing: -2.4px;
      white-space: nowrap;
    }

    .workspace {
      position: absolute;
      left: 348px;
      top: 264px;
      width: 840px;
    }

    .composer {
      position: relative;
      height: 152px;
      padding: 27px 29px 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 25px;
      background: var(--paper);
      box-shadow: 0 8px 24px rgba(43, 43, 37, .06);
    }

    .prompt-viewport {
      position: absolute;
      top: 27px;
      left: 29px;
      right: 29px;
      height: 26px;
      overflow: hidden;
      white-space: nowrap;
      font-size: 20px;
      line-height: 1;
      letter-spacing: -.56px;
    }

    #placeholder {
      position: absolute;
      inset: 0 auto auto 0;
      color: var(--muted);
    }

    #placeholder strong { color: #5f5f5b; font-weight: 700; }

    #typed-line {
      position: relative;
      display: inline-block;
      height: 22px;
      color: var(--ink);
      white-space: nowrap;
    }

    .word {
      display: inline-block;
      transform-origin: 50% 60%;
    }

    .char {
      display: inline-block;
      opacity: 0;
    }

    .space { width: .31em; }

    #caret {
      position: absolute;
      top: 1px;
      left: 0;
      width: 2px;
      height: .9em;
      border-radius: 2px;
      background: var(--coral);
      opacity: 0;
      transform-origin: 50% 50%;
    }

    .composer-row {
      position: absolute;
      right: 29px;
      bottom: 25px;
      left: 32px;
      display: flex;
      align-items: center;
    }

    .plus {
      border: 0;
      padding: 0;
      background: transparent;
      color: #111;
      font: 300 26px/1 Arial, sans-serif;
    }

    .composer-controls {
      display: flex;
      align-items: center;
      gap: 34px;
      margin-left: auto;
      color: var(--black);
      font-size: 18px;
    }

    .model, .round-icon { display: flex; align-items: center; }
    .model { gap: 10px; }
    .model .weight { color: #777772; }

    .chevron {
      width: 9px;
      height: 9px;
      border-right: 1.5px solid #777;
      border-bottom: 1.5px solid #777;
      transform: rotate(45deg) translateY(-2.4px);
    }

    .round-icon { gap: 34px; }

    .mic {
      position: relative;
      width: 14px;
      height: 21px;
      border: 2px solid #111;
      border-radius: 10px;
    }

    .mic::before {
      content: "";
      position: absolute;
      left: -5px;
      top: 8px;
      width: 20px;
      height: 12px;
      border: 2px solid #111;
      border-top: 0;
      border-radius: 0 0 14px 14px;
    }

    .mic::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 20px;
      width: 2px;
      height: 6px;
      background: #111;
      box-shadow: -5px 6px 0 -1px #111, 5px 6px 0 -1px #111;
    }

    .wave { display: flex; align-items: center; gap: 3px; height: 23px; }
    .wave i { width: 2px; height: var(--h); border-radius: 3px; background: #111; }

    .quick-actions {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin-top: 16px;
    }

    .quick-actions button {
      display: flex;
      align-items: center;
      height: 40px;
      padding: 0 10px;
      border: 2px solid #e1e1de;
      border-radius: 9px;
      background: var(--paper);
      color: #111;
      box-shadow: 0 2px 3px rgba(0,0,0,.07);
      font: 17px/1 Arial, sans-serif;
      white-space: nowrap;
    }

    .quick-actions .ico {
      width: 20px;
      margin-right: 6px;
      color: var(--muted);
      text-align: center;
      font-size: 20px;
    }

    .quick-actions .drive { color: #168b45; }
    .quick-actions .calendar { color: #1a73e8; }

    /* ── UNDERLAY: talking head revealed after fullscreen graphic exits ── */
    #talking-head {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0a0a0f;
      z-index: 1;
    }
    #talking-head video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="mg-typing-zoom-motion-fullscreen-9x16" data-start="0" data-duration="8" data-fps="30" data-width="1080" data-height="1920">
    <div id="graphic-zone" data-layout-allow-overflow>
      <div id="stage">
        <div class="scene-bg"></div>
        <div id="ui-clip" class="clip" data-start="0" data-duration="8" data-track-index="1" data-layout-allow-overflow="true">
          <main id="world">
            <header class="greeting">
              <span class="sunburst" aria-hidden="true">
                <i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i>
                <i style="--n:4"></i><i style="--n:5"></i><i style="--n:6"></i><i style="--n:7"></i>
              </span>
              <h1>Afternoon, Matt</h1>
            </header>

            <section class="workspace" aria-label="Assistant prompt">
              <div class="composer">
                <div class="prompt-viewport">
                  <div id="placeholder">Type <strong>/</strong> for skills</div>
                  <div id="typed-line" aria-label="Plan a bold launch for tomorrow" data-layout-allow-occlusion></div>
                  <span id="caret" aria-hidden="true"></span>
                </div>
                <div class="composer-row">
                  <button class="plus" aria-label="Add attachment">+</button>
                  <div class="composer-controls">
                    <div class="model"><span>Sonnet 5</span><span class="weight">Medium</span><span class="chevron"></span></div>
                    <div class="round-icon">
                      <span class="mic" aria-label="Microphone"></span>
                      <span class="wave" aria-label="Voice mode">
                        <i style="--h:10px"></i><i style="--h:19px"></i><i style="--h:25px"></i><i style="--h:17px"></i><i style="--h:23px"></i><i style="--h:19px"></i><i style="--h:12px"></i>
                      </span>
                    </div>
                  </div>
                </div>
              </div>

              <nav class="quick-actions" aria-label="Quick actions">
                <button><span class="ico">✎</span>Write</button>
                <button><span class="ico">◇</span>Learn</button>
                <button><span class="ico">‹/›</span>Code</button>
                <button><span class="ico drive">▲</span>From Drive</button>
                <button><span class="ico calendar">▣</span>From Calendar</button>
              </nav>
            </section>
          </main>
        </div>
      </div>
    </div>

    <!-- REPLACE: swap src/poster for your own talking-head footage -->
    <div id="talking-head">
      <video
        id="source-video"
        class="clip"
        src="assets/placeholder-video.mp4"
        poster="assets/talking-head-placeholder.png"
        muted
        playsinline
        preload="auto"
        data-start="0"
        data-duration="8"
        data-track-index="0"
      ></video>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};

    const copy = "Plan a bold launch for tomorrow";
    const words = copy.split(" ");
    const typedLine = document.getElementById("typed-line");
    const chars = [];
    let globalIndex = 0;

    words.forEach((word, wordIndex) => {
      const wordSpan = document.createElement("span");
      wordSpan.className = "word";
      wordSpan.id = `word-${word.toLowerCase()}`;
      for (const letter of word) {
        const char = document.createElement("span");
        char.className = "char";
        char.textContent = letter;
        char.dataset.index = String(globalIndex++);
        wordSpan.appendChild(char);
        chars.push(char);
      }
      typedLine.appendChild(wordSpan);
      if (wordIndex < words.length - 1) {
        const space = document.createElement("span");
        space.className = "char space";
        space.innerHTML = "&nbsp;";
        space.dataset.index = String(globalIndex++);
        typedLine.appendChild(space);
        chars.push(space);
      }
    });

    const caret = document.getElementById("caret");
    const origin = typedLine.getBoundingClientRect().left;
    const caretPositions = [0];
    chars.forEach((char) => caretPositions.push(char.getBoundingClientRect().right - origin + 3));

    const tl = gsap.timeline({ paused: true });
    gsap.set(chars, { opacity: 0 });
    gsap.set(caret, { opacity: 0, x: 0 });
    gsap.set("#word-bold", { scale: 1 });

    gsap.set("#graphic-zone", { autoAlpha: 1, y: -1920 });
    tl.to("#graphic-zone", { autoAlpha: 1, y: 0, duration: 0.78, ease: "expo.out" }, 0.14);
    tl.to("#placeholder", { opacity: 0, duration: .18, ease: "power2.out" }, .5)
      .to("#world", { scale: 3.2, x: 768, y: 404, duration: .55, ease: "power2.inOut" }, .55)
      .to(caret, { opacity: 1, duration: .06, ease: "power1.out" }, 1.1);

    const milestones = [
      { start: 1.18, end: 1.41, count: 4 },
      { start: 1.45, end: 1.55, count: 6 },
      { start: 1.59, end: 1.81, count: 11 },
      { start: 1.87, end: 2.21, count: 18 },
      { start: 2.21, end: 2.26, count: 19 },
      { start: 2.30, end: 2.49, count: 22 },
      { start: 2.55, end: 3.01, count: 31 }
    ];

    let priorCount = 0;
    milestones.forEach((segment) => {
      const additions = segment.count - priorCount;
      for (let i = 0; i < additions; i++) {
        const index = priorCount + i;
        const at = additions === 1
          ? segment.end
          : segment.start + ((segment.end - segment.start) * i / (additions - 1));
        tl.to(chars[index], { opacity: 1, duration: .045, ease: "power1.out" }, at)
          .to(caret, { x: caretPositions[index + 1], duration: .065, ease: "power1.out" }, at);
      }
      priorCount = segment.count;
    });

    tl.to("#world", { x: 200, duration: 1.83, ease: "power1.inOut" }, 1.18)
      .to("#word-bold", { scale: 1.03, duration: .1, ease: "power2.out" }, 1.81)
      .to("#word-bold", { scale: 1, duration: .12, ease: "power2.inOut" }, 1.92)
      .to("#world", { scale: 1.15, x: -56, y: 28, duration: 1, ease: "power2.inOut" }, 5.8)
      .to("#world", { scale: 1.1, opacity: 0, duration: .6, ease: "power2.in" }, 7.4);

    tl.to("#graphic-zone", { autoAlpha: 1, y: -1920, duration: 0.62, ease: "power3.in" }, 7.2);
    window.__timelines["mg-typing-zoom-motion-fullscreen-9x16"] = tl;
    tl.seek(0);
  </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var timelines=window.__timelines||{};var ids=Object.keys(timelines);if(!ids.length){setTimeout(play,150);return;}ids.forEach(function(id){var timeline=timelines[id];timeline.eventCallback("onComplete",function(){setTimeout(play,1200)});timeline.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
