<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .preview-talking-head {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }
      #layout {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding: 72px;
        z-index: 1;
      }
      #glass-panel {
        width: 480px;
        height: 480px;
        flex-shrink: 0;
        background: rgba(124, 58, 237, 0.14);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.38);
        box-shadow:
          0 0 22px rgba(167, 139, 250, 0.35),
          0 0 44px rgba(124, 58, 237, 0.22),
          0 12px 36px rgba(76, 29, 149, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.28);
        padding: 36px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 22px;
        will-change: opacity;
      }
      #icon-wrap {
        will-change: transform, opacity;
      }
      #icon-wrap img {
        width: 280px;
        height: 280px;
        object-fit: contain;
        display: block;
        filter: brightness(0) invert(1);
      }
      #headline {
        width: 100%;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        font-weight: 700;
        font-size: 26px;
        color: #ffffff;
        line-height: 1.3;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <img class="preview-talking-head" data-preview-only src="assets/talking-head-placeholder.png" alt="" />
      <div id="layout">
        <div id="glass-panel">
          <div id="icon-wrap">
            <!-- REPLACE: swap src with path relative to this file, or assets/template-icons/your-icon.svg -->
            <img src="assets/template-icons/default-icon.svg" alt="" />
          </div>
          <!-- REPLACE: update headline text -->
          <div id="headline">SMARTER WORKFLOWS</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Panel fade — spring { damping:26, mass:0.52, stiffness:220 } → power4.out ~0.45s
      gsap.set("#glass-panel", { opacity: 0 });
      gsap.set(["#icon-wrap", "#headline"], { opacity: 0, y: 12 });

      tl.to("#glass-panel", { opacity: 1, duration: 0.45, ease: "power4.out" }, 0);

      // Icon at ICON_START_FRAME=10 → 0.33s
      tl.to(
        "#icon-wrap",
        { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" },
        0.33
      );

      // Headline at HEADLINE_START_FRAME=28 → 0.93s
      tl.to(
        "#headline",
        { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" },
        0.93
      );

      window.__timelines["main"] = tl;
    </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
