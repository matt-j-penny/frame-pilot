<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>B-Roll Split — Talking Head — 9:16</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0f;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* ── TOP HALF: b-roll ── */
      #broll-zone {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 864px;
        overflow: hidden;
        background: #0a0a0f;
        z-index: 2;
        will-change: transform, opacity;
      }

      #broll-zone video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ── BOTTOM HALF: talking head ── */
      #talking-head {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0a0a0f;
        z-index: 1;
      }

      #talking-head video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="broll-split-talking-head-9x16"
      data-start="0"
      data-duration="6.2"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- REPLACE: swap src for the b-roll clip that matches what's being said.
           Source it from `Assets/Videos & Images/` — either picked by hand, or later
           auto-selected by matching the spoken transcript against
           `Assets/Videos & Images/media-dictionary.json`. Placeholder shown for now. -->
      <div id="broll-zone" data-layout-allow-overflow>
        <video
          id="broll-video"
          class="clip"
          src="../Videos & Images/AI Data Network Illustration.mp4"
          muted
          playsinline
          preload="auto"
          data-start="0"
          data-duration="5.4"
          data-track-index="1"
        ></video>
      </div>

      <!-- REPLACE: swap src/poster for your own talking-head footage -->
      <div id="talking-head">
        <video
          id="source-video"
          class="clip"
          src="assets/placeholder-video.mp4"
          poster="assets/talking-head-placeholder.png"
          muted
          playsinline
          preload="auto"
          data-start="0"
          data-duration="6.2"
          data-track-index="0"
        ></video>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#broll-zone", { autoAlpha: 1, y: -864 });
      tl.to("#broll-zone", { autoAlpha: 1, y: 0, duration: 0.74, ease: "expo.out" }, 0.12);

      /* ── SPLIT FRAMING — REPLACE per project ──────────────────────────────
         This is a 45/55 split: the b-roll covers the top 864px of the canvas; the footage shows
         through the 1080×864 window below it. SPLIT_SHIFT slides the footage
         down so the speaker's face lands inside that window.

         SPLIT_SCALE must stay at 1. Any value below 1 narrows the footage
         inside its 1080px frame and exposes bars down both sides.
         SPLIT_SHIFT must stay within 0…864, which is the range that keeps
         the window fully covered — outside it the footage pulls off an edge.

         For real footage, read both values off the actual face position:
           python3 scripts/face-frame.py <video> --window 864:1920

         Then ADD ~100–150px to the shift it returns. The detector's box starts
         at the eyebrows and excludes hair, so its value clips the top of the
         head even when it reports faceFullyVisible: true. Confirm on a real
         frame (npx hyperframes snapshot --at <t>) — too much shift leaves the
         subject floating, so tune the last ~30px by eye.
         ────────────────────────────────────────────────────────────────── */
      const SPLIT_SHIFT = 700;   /* px the footage travels down (0…864) */
      const SPLIT_SCALE = 1;     /* never below 1 — see above */

      tl.fromTo("#talking-head video", { y: 0, scale: 1 }, { y: SPLIT_SHIFT, scale: SPLIT_SCALE, duration: 0.74, ease: "expo.out" }, 0.12);

      // Slow drift on the b-roll so it never sits dead-still through the hold
      tl.fromTo("#broll-video", { scale: 1 }, { scale: 1.08, duration: 5.4, ease: "none" }, 0.12);

      // Exit — b-roll slides back up, footage resets to fullscreen
      const exitStart = 4.9;
      tl.to("#broll-zone", { autoAlpha: 1, y: -864, duration: 0.62, ease: "power3.in" }, exitStart);
      tl.to("#talking-head video", { y: 0, scale: 1, duration: 0.62, ease: "power3.in" }, exitStart);

      window.__timelines["broll-split-talking-head-9x16"] = tl;
    </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
</body>
</html>
