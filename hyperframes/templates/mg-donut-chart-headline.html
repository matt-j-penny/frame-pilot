<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Cabinet Grotesk';
        src: url('assets/fonts/CabinetGrotesk-ExtraBold.woff2') format('woff2');
        font-weight: 800;
        font-style: normal;
      }
      @font-face {
        font-family: 'Satoshi';
        src: url('assets/fonts/Satoshi-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
      }
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f8f9fb; }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f8f9fb;
        background-image:
          linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      #content {
        width: 100%;
        height: 100%;
        padding: 120px 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 150px;
        will-change: transform, opacity;
      }
      #donut-wrap {
        position: relative;
        width: 470px;
        height: 470px;
        flex: 0 0 470px;
        display: grid;
        place-items: center;
        filter: drop-shadow(0 20px 60px rgba(124, 58, 237, 0.15));
      }
      #donut {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
        overflow: visible;
      }
      .donut-track {
        fill: none;
        stroke: #ede9fe;
        stroke-width: 52;
      }
      #donut-progress {
        fill: none;
        stroke: #7c3aed;
        stroke-width: 52;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        will-change: stroke-dashoffset;
      }
      #percentage {
        position: relative;
        z-index: 2;
        font-family: 'Cabinet Grotesk', sans-serif;
        font-size: 122px;
        font-weight: 800;
        color: #111111;
        letter-spacing: -0.05em;
        font-variant-numeric: tabular-nums;
      }
      #headline {
        max-width: 760px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        font-family: 'Cabinet Grotesk', sans-serif;
        font-size: 112px;
        font-weight: 800;
        line-height: 0.94;
        letter-spacing: -0.04em;
        color: #111111;
      }
      .headline-word { display: block; will-change: transform, opacity, filter; }
      .headline-word:last-child { color: #7c3aed; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="mg-donut-chart-headline" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="content">
        <div id="donut-wrap">
          <svg id="donut" viewBox="0 0 470 470" aria-hidden="true">
            <circle class="donut-track" cx="235" cy="235" r="176"></circle>
            <circle id="donut-progress" pathLength="100" cx="235" cy="235" r="176"></circle>
          </svg>
          <div id="percentage">0%</div>
        </div>
        <div id="headline">
          <span class="headline-word">WORKFLOWS</span>
          <span class="headline-word">SUCCEED</span>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const counter = { value: 0 };
      const percentage = document.getElementById('percentage');

      gsap.set('#donut-wrap', { opacity: 0, scale: 0.86, rotation: -5 });
      gsap.set('.headline-word', { opacity: 0, x: 48, filter: 'blur(10px)' });

      tl.to('#donut-wrap', { opacity: 1, scale: 1, rotation: 0, duration: 0.68, ease: 'back.out(1.35)' }, 0.18);
      tl.to('#donut-progress', { strokeDashoffset: 10, duration: 1.3, ease: 'expo.out' }, 0.72);
      tl.to(counter, {
        value: 90,
        duration: 1.3,
        ease: 'expo.out',
        onUpdate: () => { percentage.textContent = `${Math.round(counter.value)}%`; },
      }, 0.72);
      tl.to('.headline-word', { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.62, stagger: 0.2, ease: 'power3.out' }, 2.05);

      tl.to('#content', { opacity: 0, y: -30, scale: 0.97, duration: 0.5, ease: 'power2.in' }, 5.08);

      window.__timelines['mg-donut-chart-headline'] = tl;
    </script>
  <!-- hf-autoplay --><script>(function(){if(window.self===window.top)return;function play(){var tl=window.__timelines||{};var k=Object.keys(tl);if(!k.length){setTimeout(play,150);return;}k.forEach(function(id){var t=tl[id];t.eventCallback("onComplete",function(){setTimeout(play,1200)});t.restart();});}setTimeout(play,200);}());</script>
  </body>
</html>
