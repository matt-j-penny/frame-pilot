async function viewJob(id, keepScroll) {
  let j;
  try { j = await api(`/api/jobs/${id}`); } catch (e) { $("#view").innerHTML = `<p>${esc(e.message)}</p>`; return; }
  const run = j.runs.at(-1);
  const active = j.status === "running" || j.status === "queued";
  const cancelling = active && !!run?.cancelling;
  const previousPreview = $("#jobLeft");
  const newVersion = keepScroll && previousPreview?.dataset.job === j.id && j.versions.length > Number(previousPreview.dataset.versionCount);
  if (newVersion || selectedVersion === null || (selectedVersion < 1 && j.versions.length) || selectedVersion > j.versions.length || (!keepScroll && j.versions.length)) selectedVersion = j.versions.length;
  const v = j.versions[selectedVersion - 1];
  const st = j.stages;
  const doneN = st.filter((s) => s.done).length;
  const pct = Math.round((doneN / Math.max(1, st.length)) * 100);
  const heading = cancelling ? "Stopping…" : j.status === "queued" ? `Queued${j.queuePosition ? ` · #${j.queuePosition} in line` : ""}` : j.status === "running" ? (run.kind === "edit" ? "Editing your video" : run.kind === "preview" ? "Creating your storyboard" : run.kind === "build" ? "Building your video" : run.kind === "lessons" ? "Learning from this edit" : "Applying your change") :
    j.status === "done" ? "Finished" : j.status === "cancelled" ? "Cancelled" : "Something went wrong";
  const view = $("#view");
  if (j.status === "preview" && j.storyboard) return viewStoryboard(j, run);
  const ap = j.approval;
  const leftKey = `${j.id}:${j.versions.length}:${selectedVersion}:${active}:${cancelling}:${ap?.state}:${ap?.version}:${ap?.superseded}`;
  const rightKey = `${j.status}:${cancelling}:${ap?.state}:${ap?.superseded}`;
  const partial = keepScroll && $("#jobLeft")?.dataset.key === leftKey;
  const reworking = active && run?.kind !== 'lessons' && !!v;
  const updatePreview = () => updatePreviewWorking(reworking,
    cancelling ? 'Stopping…' : j.status === 'queued' ? 'Change queued' : 'Reworking your video…',
    cancelling ? 'Stopping the editor and render' : j.status === 'queued' ? 'Waiting for the editor' : st.find(stage => stage.active)?.label || 'Applying your change',
    cancelling || j.status === 'queued' ? null : pct);
  const right = rightHtml(j, run, active, heading, pct, st);
  if (partial) { updatePreview(); if (active || $("#jobRight").dataset.status !== rightKey) { $("#jobRight").innerHTML = right; $("#jobRight").dataset.status = rightKey; bindJob(j, id); } return; }
  view.innerHTML = `
    <div class="page-title"><h2>${esc(j.title)}</h2>
      <div class="chips"><span class="chip">${esc(meta.editors?.find(e=>e.id===j.editor)?.label || "Native")}</span><span class="chip">${esc(j.style || "No style")}</span><span class="chip">${esc(meta.models.find(m => m.id === j.model)?.label || j.model)}</span><span class="chip">${esc(effortLabel(j.effort || "default"))} effort</span><span class="chip">${esc(j.aspectRatio || "9:16")}</span>${j.direction ? `<span class="chip" title="${esc(j.direction)}">has direction</span>` : ""}</div>
      <div class="toolbar">
        ${active ? `<button class="btn small" id="cancelBtn" ${cancelling ? "disabled" : ""}>${cancelling ? "Stopping…" : run?.kind === "revise" ? "Cancel changes" : "Cancel edit"}</button>` : ""}
        <button class="btn small" id="copyBtn">Copy for Claude</button>
      </div>
    </div>
    <div class="job">
      <div id="jobLeft" data-key="${leftKey}" data-job="${j.id}" data-version-count="${j.versions.length}">
        <div id="previewFrame" aria-label="Video preview" aria-busy="false" class="phone ${j.aspectRatio === '16:9' ? 'landscape' : ''}">${v ? `<video id="player" src="/files/${j.id}/${v.file}?t=${v.created}" controls playsinline></video>` :
          `<div class="empty"><div>${active ? '<div class="spinner"></div>' : ""}<b>${cancelling ? "Stopping…" : active ? (run?.kind === "preview" ? "Your storyboard is being created" : "Your video is being edited") : "No render yet"}</b><p style="font-size:12.5px;margin:6px 0 0">${cancelling ? "Stopping the editor and render" : active ? "Usually a few minutes for a 30-90s video." : esc(run?.summary?.slice(0, 160) || "")}</p></div></div>`}<div class="preview-working" id="previewWorking" hidden>
          <div class="preview-working-content"><div class="spinner" aria-hidden="true"></div><div role="status" aria-live="polite"><b id="previewWorkingTitle"></b><span id="previewWorkingDetail"></span></div>
          <div class="bar" id="previewWorkingProgress" role="progressbar" aria-label="Revision progress" aria-valuemin="0" aria-valuemax="100" hidden><i></i></div>
          <small>Previous version underneath</small></div>
        </div></div>
        ${active ? `<div class="preview-cancel"><button class="btn small" id="previewCancelBtn" ${cancelling ? "disabled" : ""}>${cancelling ? "Stopping…" : run?.kind === "revise" ? "Cancel changes" : "Cancel edit"}</button></div>` : ""}
        ${j.versions.length ? `<div class="versions">${j.versions.map((x) => `<button data-v="${x.n}" class="${x.n === selectedVersion ? "on" : ""}">v${x.n}</button>`).join("")}</div>
          <div class="vnote">${esc(v?.note || "")}${v ? ` · <a href="/files/${j.id}/${v.file}" download="${esc(j.title.replace(/\.\w+$/, ""))}-v${v.n}.mp4">Download</a>` : ""}</div>` : ""}
        ${j.editorProject && j.editorProject.editor === j.editor ? `<div class="editor-project"><b>${esc(meta.editors?.find(e=>e.id===j.editor)?.label || j.editor)} project</b><span>${esc(j.editorProject.projectName || j.editorProject.projectId || '')}</span>${j.editorProject.projectPath ? `<code>${esc(j.editorProject.projectPath)}</code>` : ''}</div>` : ''}
        ${approveHtml(j, active)}
      </div>
      <div id="jobRight" data-status="${rightKey}">${right}</div>
    </div>`;
  updatePreview();
  bindJob(j, id);
  $("#copyBtn").onclick = async () => { await navigator.clipboard.writeText(copyText(j)); toast("Copied: paste it into Claude and add your change"); };
  const cancelRun = async () => {
    const buttons = [$("#cancelBtn"), $("#previewCancelBtn")].filter(Boolean);
    buttons.forEach(button => { button.disabled = true; button.textContent = 'Stopping…'; });
    if (v) updatePreviewWorking(true, 'Stopping…', 'Stopping the editor and render');
    try {
      await api(`/api/jobs/${id}/cancel`, { method: "POST" });
      await viewJob(id, true);
    } catch (error) {
      buttons.forEach(button => { button.disabled = false; button.textContent = run?.kind === 'revise' ? 'Cancel changes' : 'Cancel edit'; });
      toast(error.message); await viewJob(id, true);
    }
  };
  if ($("#cancelBtn")) $("#cancelBtn").onclick = cancelRun;
  if ($("#previewCancelBtn")) $("#previewCancelBtn").onclick = cancelRun;
  view.querySelectorAll("[data-v]").forEach((b) => (b.onclick = () => { selectedVersion = Number(b.dataset.v); viewJob(id, true); }));
  if ($("#approveBtn")) $("#approveBtn").onclick = async () => {
    $("#approveBtn").disabled = true;
    try { await api(`/api/jobs/${id}/approve`, { method: "POST", body: { version: j.versions.length } }); viewJob(id, true); }
    catch (e) { toast(e.message); $("#approveBtn").disabled = false; }
  };
}

const storyPicks = {}, storyNotes = {};
const fmtTime = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
function viewStoryboard(j, run) {
  const picks = storyPicks[j.id] ??= {}, notes = storyNotes[j.id] ??= {}, sb = j.storyboard;
  const choices = sb.beats.filter(b => b.ideas.length > 1).length;
  $("#view").innerHTML = `

    <div class="storyboard ${j.aspectRatio === '16:9' ? 'landscape' : ''}">
      <div class="sb-head"><div><h3>Storyboard</h3><p>${choices ? `Pick an idea for ${choices} beat${choices === 1 ? "" : "s"}, then build the video.` : "Check every beat, then build the video."} Stills show each beat after its graphic has settled.</p></div><button class="btn primary" data-build>Build video</button></div>
      ${run?.summary ? `<details><summary>Editor notes</summary>${esc(run.summary)}</details>` : ""}
      ${sb.beats.map(b => `<section class="sb-beat"><div class="sb-meta"><b>${fmtTime(b.start)} – ${fmtTime(b.end)}</b><p>${esc(b.text)}</p></div>
        <div class="sb-ideas" role="radiogroup" aria-label="Ideas for ${fmtTime(b.start)}">${b.ideas.map((idea, k) => `<label class="sb-idea"><input type="radio" name="beat-${esc(String(b.id))}" data-beat="${esc(String(b.id))}" value="${k}" ${(picks[b.id] ?? 0) === k ? "checked" : ""}>
          <img src="/files/${encodeURIComponent(j.id)}/${idea.still}" alt="Beat at ${fmtTime(b.start)}, idea ${k + 1}" loading="lazy">
          <span>${b.ideas.length > 1 ? `<b>${k + 1}.</b> ` : ""}${esc(idea.label || (idea.type ? idea.type : "Talking head"))} <small>· ${esc(idea.layout.replace("_", " "))}</small></span></label>`).join("")}</div>
        <textarea class="sb-note" data-note="${esc(String(b.id))}" rows="2" placeholder="What should change on this beat?" aria-label="Changes for ${fmtTime(b.start)}">${esc(notes[b.id] || "")}</textarea></section>`).join("")}
      <div class="sb-foot"><button class="btn" data-revise>Revise storyboard</button><button class="btn primary" data-build>Build video</button></div>
    </div>`;
  document.querySelectorAll("[data-beat]").forEach(r => r.onchange = () => { picks[r.dataset.beat] = Number(r.value); });
  document.querySelectorAll("[data-note]").forEach(t => t.oninput = () => { notes[t.dataset.note] = t.value; });
  $("[data-revise]").onclick = async () => {
    if (!Object.values(notes).some(n => n.trim())) return toast("Add a note to at least one beat.");
    document.querySelectorAll("[data-build], [data-revise]").forEach(b => b.disabled = true);
    try { await api(`/api/jobs/${j.id}/storyboard-revise`, { method: "POST", body: { notes } }); delete storyNotes[j.id]; delete storyPicks[j.id]; viewJob(j.id); }
    catch (e) { toast(e.message); document.querySelectorAll("[data-build], [data-revise]").forEach(b => b.disabled = false); }
  };
  document.querySelectorAll("[data-build]").forEach(btn => btn.onclick = async () => {
    document.querySelectorAll("[data-build]").forEach(b => b.disabled = true);
    try { await api(`/api/jobs/${j.id}/build`, { method: "POST", body: { choices: picks } }); delete storyPicks[j.id]; viewJob(j.id); }

}

function approveHtml(j, active) {
  const ap = j.approval, latest = j.versions.length;

  if (ap && !ap.superseded && ap.state === "done") return `<div class="approve"><span class="approved">✓ Approved v${ap.version}</span><small>${j.style ? `Saved as an example for ${esc(j.style)}.` : "Edit approved."}</small></div>`;
  if (ap && !ap.superseded && ap.state === "review") return `<div class="approve"><span class="approved">✓ Approved v${ap.version}</span><small>Review the lessons on the right.</small></div>`;

function lessonsHtml(j) {
  const ap = j.approval;

    const n = ap.applied?.length || 0, w = ap.watched?.length || 0;

      ${n ? `<span class="muted">${ap.applied.map(esc).join("<br>")}</span><br>` : ""}${w ? `<span class="muted">Watching for: ${ap.watched.map(esc).join(", ")}</span><br>` : ""}

  const ls = j.lessons.lessons || [];
  const item = (l, box, checked) => `<label class="lesson ${box ? "" : "muted"}">${box ? `<input type="checkbox" data-lesson="${esc(l.id)}" data-kind="${l.kind}" ${checked ? "checked" : ""}>` : ""}
    <span><b>${esc(l.title)}</b>${l.why ? `<small>${esc(l.why)}</small>` : ""}${l.setting?.path ? `<code>${esc(l.setting.path)}: ${esc(JSON.stringify(l.setting.from))} → ${esc(JSON.stringify(l.setting.to))}</code>` : ""}${l.rule ? `<small>Rule: ${esc(l.rule)}</small>` : ""}</span></label>`;

    <div class="row">${ls.some((l) => l.kind !== "specific") ? '<button class="btn small" id="skipLessons">Skip</button><button class="btn small primary" id="applyLessons">Apply to style</button>' : '<button class="btn small primary" id="skipLessons">Done</button>'}</div></div>`;
}

const revisionDrafts = new Map();
function revisionDraft(id) {
  if (!revisionDrafts.has(id)) {
    let files = [];
    try { files = JSON.parse(sessionStorage.getItem('rev-files-' + id) || '[]').filter(file => typeof file.path === 'string'); } catch {}
    revisionDrafts.set(id,{files,uploading:false,submitting:false});
  }
  return revisionDrafts.get(id);
}
function saveRevisionFiles(id) {
  sessionStorage.setItem('rev-files-' + id,JSON.stringify(revisionDraft(id).files.filter(file=>file.path).map(({id,name,path,kind})=>({id,name,path,kind}))));
}
function clearRevisionFiles(id) {
  const state=revisionDraft(id);
  for(const file of state.files)if(file.preview)URL.revokeObjectURL(file.preview);
  revisionDrafts.delete(id);sessionStorage.removeItem('rev-files-' + id);
}
function renderRevisionFiles(id, active=false) {
  const composer=$('#revisionComposer');
  if (!composer || composer.dataset.job !== id) return;
  const state=revisionDraft(id), list=$('#revisionAttachments');
  list.innerHTML=state.files.map(file=>`<div class="revision-file">
    ${file.preview ? file.kind==='video' ? `<video src="${esc(file.preview)}" muted playsinline preload="metadata"></video>` : `<img src="${esc(file.preview)}" alt="">` : `<span class="revision-file-icon" aria-hidden="true">${file.kind==='video'?'▷':'▧'}</span>`}
    <span class="revision-file-info"><b>${esc(file.name)}</b>${file.path ? `<small>${file.kind==='video'?'Video':'Image'}</small>` : `<small>Uploading ${Math.round((file.progress || 0)*100)}%</small><span class="bar"><i style="width:${(file.progress || 0)*100}%"></i></span>`}</span>
    <button class="btn small" data-remove-revision-file="${file.id}" aria-label="Remove ${esc(file.name)}" ${active || state.submitting ? 'disabled':''}>×</button></div>`).join('');
  list.querySelectorAll('[data-remove-revision-file]').forEach(button=>button.onclick=()=>{
    const item=state.files.find(file=>file.id===button.dataset.removeRevisionFile);
    if(item?.preview)URL.revokeObjectURL(item.preview);
    state.files=state.files.filter(file=>file!==item);saveRevisionFiles(id);renderRevisionFiles(id,active);
  });
  const busy=active || state.uploading || state.submitting;
  $('#revisionFiles').disabled=busy;$('#revisionBrowse').disabled=busy;
  $('#reviseText').disabled=active || state.submitting;
  $('#reviseModelBtn').disabled=active || state.submitting;
  $('#reviseProvider').disabled=active || state.submitting;
  $('#reviseEffort').disabled=active || state.submitting || !meta.models.find(model=>model.id===state.model)?.efforts?.length;
  $('#revisionBrowse').textContent=state.uploading?'Uploading…':'Attach images or videos';
  $('#reviseBtn').disabled=busy || (!$('#reviseText').value.trim() && !state.files.some(file=>file.path));
  $('#revisionUploadStatus').textContent=state.uploading?'Uploading attachments…':'';
}
async function uploadRevisionFiles(id, selected, active) {
  const state=revisionDraft(id);
  if(active || state.submitting)return;
  if(state.uploading)return toast('Wait for the current attachments to finish uploading.');
  const files=Array.from(selected);
  if(!files.length)return;
  if(files.some(file=>!/\.(mp4|mov|m4v|webm|png|jpe?g|webp|gif)$/i.test(file.name)))return toast('Choose videos or PNG, JPG, WebP or GIF images.');
  if(state.files.length+files.length>30)return toast('Attach up to 30 images or videos per change.');
  state.uploading=true;
  const pending=files.map(file=>({id:crypto.randomUUID(),name:file.name,kind:/\.(mp4|mov|m4v|webm)$/i.test(file.name)?'video':'image',preview:URL.createObjectURL(file),progress:0,file}));
  state.files.push(...pending);renderRevisionFiles(id,active);
  try {
    for(const item of pending) {
      if(!state.files.includes(item))continue;
      try {
        const result=await uploadFile(item.file,progress=>{item.progress=progress;renderRevisionFiles(id,active);});
        if(state.files.includes(item)){item.path=result.path;delete item.file;saveRevisionFiles(id);}
      } catch(error) {
        URL.revokeObjectURL(item.preview);state.files=state.files.filter(file=>file!==item);toast(`${item.name}: ${error.message}`);
      }
      renderRevisionFiles(id,active);
    }
  } finally {state.uploading=false;saveRevisionFiles(id);renderRevisionFiles(id,active);}
}

function rightHtml(j, run, active, heading, pct, st) {

  return `${status}${lessonsHtml(j)}

        <button class="send" id="reviseBtn" ${active ? "disabled" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 4v5h-5M20 12a8 8 0 0 1-14 5.3M4 20v-5h5"/></svg>Apply</button>
      </div>
    </div>`;

function bindJob(j, id) {
  const sendLessons = async (accept, watch) => {
    try { await api(`/api/jobs/${id}/lessons`, { method: "POST", body: { accept, watch } }); toast(accept.length ? "Style updated" : "Approved"); viewJob(id); }
    catch (e) { toast(e.message); }
  };
  if ($("#applyLessons")) $("#applyLessons").onclick = () => {
    const ticked = [...document.querySelectorAll("[data-lesson]:checked")];
    sendLessons(ticked.filter((x) => x.dataset.kind === "style").map((x) => x.dataset.lesson), ticked.filter((x) => x.dataset.kind === "observation").map((x) => x.dataset.lesson));
  };
  if ($("#skipLessons")) $("#skipLessons").onclick = () => sendLessons([], []);
  const ta = $("#reviseText");
  const state=revisionDraft(id), active=j.status === 'running' || j.status === 'queued';
  let model = state.model || j.model; state.model=model;
  $('#reviseModelBtn b').textContent=modelName(model);
  if(state.effort)$('#reviseEffort').innerHTML=effortOptions(model,state.effort);
  ta.oninput = () => { sessionStorage.setItem("rev-" + j.id, ta.value); ta.style.height = "auto"; ta.style.height = `${ta.scrollHeight}px`; renderRevisionFiles(id,active); };
  const composer=$('#revisionComposer'), fileInput=$('#revisionFiles');
  $('#revisionBrowse').onclick=()=>fileInput.click();
  fileInput.onchange=()=>{uploadRevisionFiles(id,fileInput.files,active);fileInput.value='';};
  composer.ondragover=e=>{e.preventDefault();e.stopPropagation();if(!active && !state.uploading && !state.submitting)composer.classList.add('over');};
  composer.ondragleave=e=>{if(!composer.contains(e.relatedTarget))composer.classList.remove('over');};
  composer.ondrop=e=>{e.preventDefault();e.stopPropagation();composer.classList.remove('over');uploadRevisionFiles(id,e.dataTransfer.files,active);};
  $('#reviseEffort').onchange=e=>{state.effort=e.target.value;};
  renderRevisionFiles(id,active);
  ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#reviseBtn").click(); } };
  const pickModel = (id) => {
    model = id; state.model = model;
    $("#reviseEffort").innerHTML = effortOptions(model, localStorage.getItem("se-effort:" + model) || "default");
    $("#reviseEffort").disabled = !meta.models.find(m => m.id === model)?.efforts?.length;
    state.effort = $("#reviseEffort").value;
    $("#reviseModelBtn b").textContent = modelName(model);
    $("#reviseProvider").innerHTML = providerOptions(providerOf(model));
    modelMenu($("#reviseModelMenu"), model);
  };
  $("#reviseProvider").innerHTML = providerOptions(providerOf(model));
  modelMenu($("#reviseModelMenu"), model);
  $("#reviseProvider").onchange = e => pickModel(firstModel(e.target.value));
  $("#reviseModelBtn").onclick = (e) => { e.stopPropagation(); $("#reviseModelMenu").classList.toggle("open"); openModelMenu($("#reviseModelMenu")); };
  document.onclick = () => document.querySelectorAll(".menu").forEach((m) => m.classList.remove("open"));
  $("#reviseModelMenu").onclick = (e) => {
    e.stopPropagation();
    const it = e.target.closest("[data-model]");
    if (!it) return;
    pickModel(it.dataset.model);
    $("#reviseModelMenu").classList.remove("open");
  };
  $("#reviseBtn").onclick = async () => {
    const button = $("#reviseBtn");
    if (button.disabled || state.uploading || state.submitting) return;
    if (!ta.value.trim() && !state.files.some(file=>file.path)) return ta.focus();
    state.submitting=true;
    renderRevisionFiles(id,active);
    const previousLabel = button.innerHTML;
    button.disabled = true; button.textContent = 'Submitting…';
    updatePreviewWorking(true, 'Preparing your change…', 'Sending instructions to the editor');
    try {
      await api(`/api/jobs/${id}/revise`, { method: "POST", body: { text: ta.value, attachments: state.files.filter(file=>file.path).map(file=>file.path), model, effort: $("#reviseEffort").value } });
      sessionStorage.removeItem("rev-" + j.id);
      clearRevisionFiles(id);
      await viewJob(id, true);
    } catch (e) {
      updatePreviewWorking(false);
      state.submitting=false;
      button.disabled = false; button.innerHTML = previousLabel;
      renderRevisionFiles(id,active);
      toast(e.message);
    }
  };
}


// ---------- style editor ----------

const RANGE = {
  size: [12, 220, 1], weight: [100, 900, 100], letter_spacing: [-8, 8, 0.5], ratio: [0.3, 0.7, 0.01], face_y: [0, 1, 0.01],
  avg_beat_s: [0.8, 8, 0.1], max_static_s: [1, 10, 0.5], punch_in_every_s: [0, 15, 0.5], punch_in_scale: [1, 1.5, 0.01],
  anim_in_frames: [1, 30, 1], anim_out_frames: [1, 30, 1], stagger_frames: [1, 20, 1], spring_damping: [4, 40, 1],
  radius: [0, 60, 1], padding: [0, 80, 1], padding_x: [0, 40, 1], padding_y: [0, 30, 1], words_per_line: [1, 8, 1],
  emphasis_scale: [1, 1.5, 0.01], scale: [1, 1.5, 0.01], pop_frames: [0, 15, 1], duration_frames: [1, 30, 1], width: [0, 20, 1],
  music_volume: [0, 0.5, 0.01], duck_volume: [0, 0.3, 0.01], sfx_volume: [0, 1, 0.01], sfx_per_10s: [0, 6, 0.5], lufs: [-24, -8, 0.5],
  music_fade_out_s: [0, 3, 0.1], top: [0, 500, 5], bottom: [0, 700, 5], right: [0, 300, 5], opacity: [0, 1, 0.01],
};
const FRACTION_PARENTS = new Set(["layouts", "y", "weights"]);
const ENUMS = { entrance: ["pop", "slide-up", "fade", "scale"], exit: ["fade", "scale", "slide-down"], punch_style: ["cut", "ease"], speaker: ["top", "bottom"], mode: ["word", "phrase"], "highlight.type": ["none", "color", "box", "scale", "underline"] };
const GROUP_TITLES = { canvas: "Canvas", safe_zone: "Instagram safe zone", fonts: "Fonts", colors: "Colours", background: "Background", backgrounds: "Background variants", ui: "UI mockups", layouts: "Layout mix (share of runtime)", split: "Split screen", pacing: "Pacing", motion: "Motion", cards: "Cards", captions: "Captions", transitions: "Transitions", graphics: "Graphics", audio: "Audio" };
const HINTS = { face_y: "Where the face sits in the crop (0 = top)", ratio: "Speaker's share of the screen height", duck_volume: "Music level while you're talking", lufs: "Final loudness (-14 is standard for social)", words_per_line: "Max words per caption line", "captions.y": "Vertical centre of captions, 0 = top, 1 = bottom" };
const human = (k) => k.replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());
const isHex = (v) => typeof v === "string" && /^#[0-9a-f]{3,8}$/i.test(v);

let se = null; // { name, kind, prose, config, saved, assets, tab, mode }

function getAt(obj, path) { return path.split(".").reduce((o, k) => o?.[k], obj); }
function setAt(obj, path, v) { const ks = path.split("."); const last = ks.pop(); ks.reduce((o, k) => o[k], obj)[last] = v; }

function fieldHtml(key, val, path, parent) {
  const label = `<span title="${esc(HINTS[key] || HINTS[parent] || path)}">${esc(human(key))}</span>`;
  const enumKey = ENUMS[`${parent}.${key}`] ? `${parent}.${key}` : ENUMS[key] && !(key === "type" && parent !== "highlight") ? key : null;
  if (typeof val === "boolean")
    return `<label class="field">${label}<span class="ctl"><span class="switch"><input type="checkbox" data-path="${path}" data-kind="bool" ${val ? "checked" : ""}><i></i></span></span></label>`;
  if (enumKey)
    return `<label class="field">${label}<span class="ctl"><select data-path="${path}" data-kind="str">${ENUMS[enumKey].map((o) => `<option ${o === val ? "selected" : ""}>${o}</option>`).join("")}</select></span></label>`;
  if (typeof val === "number") {
    const r = FRACTION_PARENTS.has(parent) ? [0, 1, 0.01] : parent === "canvas" ? null : RANGE[key];
    return `<label class="field">${label}<span class="ctl">${r ? `<input type="range" min="${Math.min(r[0], val)}" max="${Math.max(r[1], val)}" step="${r[2]}" value="${val}" data-path="${path}" data-kind="num">` : ""}<input class="num" type="number" step="any" value="${val}" data-path="${path}" data-kind="num"></span></label>`;
  }
  if (key === "file" && parent && path.startsWith("fonts.")) {
    const fonts = se.assets.filter((a) => /\.(ttf|otf|woff2?)$/i.test(a.path)).map((a) => a.path);
    return `<label class="field">${label}<span class="ctl"><select data-path="${path}" data-kind="str">${[...new Set([val, ...fonts])].map((f) => `<option ${f === val ? "selected" : ""}>${esc(f)}</option>`).join("")}</select></span></label>`;
  }
  if (key === "file" && path.startsWith("background")) {
    const files = se.assets.filter((a) => /\.(png|jpe?g|webp|mp4|mov|webm)$/i.test(a.path)).map((a) => a.path);
    return `<label class="field">${label}<span class="ctl"><select data-path="${path}" data-kind="nullable"><option value="">None</option>${files.map((f) => `<option ${f === val ? "selected" : ""}>${esc(f)}</option>`).join("")}</select></span></label>`;
  }
  if (isHex(val))
    return `<label class="field">${label}<span class="ctl"><input type="color" value="${val.length === 4 ? "#" + [...val.slice(1)].map((c) => c + c).join("") : val.slice(0, 7)}" data-path="${path}" data-kind="color"><input type="text" value="${esc(val)}" data-path="${path}" data-kind="str" style="max-width:130px"></span></label>`;
  if (Array.isArray(val) && val.every((x) => typeof x === "string"))
    return `<label class="field">${label}<span class="ctl" style="flex-direction:column;align-items:stretch;gap:4px"><input type="text" value="${esc(val.join(", "))}" data-path="${path}" data-kind="list">${val.some(isHex) ? `<span>${val.filter(isHex).map((c) => `<i class="chipsw" style="background:${c}"></i>`).join("")}</span>` : ""}</span></label>`;
  if (val === null || typeof val === "string")
    return `<label class="field">${label}<span class="ctl">${typeof val === "string" && /rgba?\(|gradient/.test(val) && !/gradient/.test(val) ? `<i class="chipsw" style="background:${esc(val)}"></i>` : ""}<input type="text" value="${esc(val ?? "")}" placeholder="none" data-path="${path}" data-kind="nullable"></span></label>`;
  if (typeof val === "object") return groupHtml(key, val, path, true);
  return "";
}

function groupHtml(key, obj, path, nested) {
  let extra = "";
  if (key === "layouts") {
    const sum = Object.values(obj).reduce((a, b) => a + b, 0);
    extra = `<span id="layoutSum" class="${Math.abs(sum - 1) > 0.05 ? "sumbad" : "sumok"}">Total ${Math.round(sum * 100)}%</span>`;
  }
  return `<div class="group"><h4>${esc(nested ? human(key) : GROUP_TITLES[key] || human(key))}${extra}</h4>${Object.entries(obj).map(([k, v]) => fieldHtml(k, v, path ? `${path}.${k}` : k, key)).join("")}</div>`;
}

function settingsHtml(cfg) {
  const basics = { name: cfg.name, description: cfg.description, locked: !!cfg.locked };
  const top = `<div class="group"><h4>Basics</h4>${fieldHtml("description", basics.description ?? "", "description", "")}${fieldHtml("locked", basics.locked, "locked", "")}</div>`;
  return top + Object.entries(cfg).filter(([k, v]) => v && typeof v === "object" && !Array.isArray(v)).map(([k, v]) => groupHtml(k, v, k, false)).join("") +
    `<div class="group"><h4>Raw JSON <span class="muted" style="font-weight:400">read-only view</span></h4><details><summary>Show</summary><pre style="font-size:11.5px;overflow:auto;max-height:300px">${esc(JSON.stringify(cfg, null, 2))}</pre></details></div>`;
}

const fontsLoaded = new Set();
function loadStyleFonts() {
  for (const f of Object.values(se.config.fonts || {})) {
    const key = `${se.name}:${f.family}:${f.file}`;
    if (!f?.file || fontsLoaded.has(key)) continue;
    fontsLoaded.add(key);

  }
}

function previewHtml() {
  const c = se.config, k = 254 / 1080, H = 464, mode = se.mode;

  const bgStyle = `background-color:${bg.color};background-image:${bg.css || "none"};background-size:${bg.size || "auto"}`;

  const gRect = mode === "split" ? (top ? `top:${ratio * 100}%;bottom:0` : `top:0;bottom:${ratio * 100}%`) : "top:0;bottom:0";
  const hf = f.heading || {}, cf = f.caption || {}, lf = f.label || {};
  const graphic = mode === "talking_head" ? "" : `<div class="pv-graphic" style="${gRect};${bgStyle}">
    <div style="background:${cards.background};color:${cards.text};border-radius:${(cards.radius || 0) * k * 1.6}px;box-shadow:${cards.shadow};border:${cards.border};padding:${(cards.padding || 20) * k * 1.4}px ${(cards.padding || 20) * k * 1.8}px;text-align:center">
      <div style="font-family:'${hf.family}';font-weight:${hf.weight};font-size:${(hf.size || 80) * k * 0.9}px;letter-spacing:${(hf.letter_spacing || 0) * k}px;text-transform:${hf.uppercase ? "uppercase" : "none"};line-height:1.05">Big <span style="color:${col.accent}">idea</span></div>
      <div style="font-family:'${lf.family}';font-weight:${lf.weight};font-size:${(lf.size || 34) * k}px;opacity:.75;margin-top:4px;text-transform:${lf.uppercase ? "uppercase" : "none"};letter-spacing:${(lf.letter_spacing || 0) * k}px">supporting label</div>
    </div></div>`;
  const words = ["This", "is", "your", "caption"].slice(0, Math.max(1, Math.min(4, cap.words_per_line || 3)));
  const hl = cap.highlight || {};
  const capHtml = cap.enabled === false ? "" : `<div class="pv-cap" style="top:${(cap.y?.[mode] ?? 0.7) * 100}%"><div style="gap:${(cf.size || 60) * k * 0.28}px;background:${cap.box?.color || "transparent"};border-radius:${(cap.box?.radius || 0) * k * 1.4}px;padding:${cap.box ? `${cap.box.padding_y * k * 1.4}px ${cap.box.padding_x * k * 1.4}px` : 0}">${words.map((w, i) => {
    const active = i === 1, t = cap.uppercase ? w.toUpperCase() : w;
    let color = cap.color, bgc = "", sc = 1;
    if (active && hl.type === "color") color = hl.color;
    if (active && hl.type === "scale") { color = hl.color; sc = hl.scale || 1.1; }
    if (active && hl.type === "box") { color = hl.color; bgc = hl.box_color; }
    return `<span style="font-family:'${cf.family}';font-weight:${cf.weight};font-size:${(cf.size || 60) * k}px;color:${color};background:${bgc || "none"};border-radius:3px;padding:${bgc ? "0 3px" : 0};transform:scale(${sc});display:inline-block;-webkit-text-stroke:${cap.stroke ? `${cap.stroke.width * k}px ${cap.stroke.color}` : "0"};paint-order:stroke fill;text-shadow:${cap.shadow || "none"};line-height:1.15">${esc(t)}</span>`;
  }).join("")}</div></div>`;
  const safe = c.safe_zone || { top: 220, bottom: 420, right: 130 };
  const bands = `<div style="position:absolute;inset:0 0 auto 0;height:${safe.top * k}px;background:rgba(255,0,0,.12)"></div><div style="position:absolute;inset:auto 0 0 0;height:${safe.bottom * k}px;background:rgba(255,0,0,.12)"></div>`;
  return `<div class="pv-phone"><div class="pv-screen" style="${bgStyle}">${mode === "fullscreen" ? "" : `<div class="pv-foot" style="${footRect}"></div>`}${graphic}${capHtml}${se.bands ? bands : ""}</div></div>`;
}

function markDirty() {
  const dirty = JSON.stringify([se.prose, se.config]) !== se.saved;
  $("#dirtyFlag").textContent = dirty ? "Unsaved changes" : "";
  $("#saveBtn").disabled = !dirty;
}

function renderTab() {
  const body = $("#seBody");
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === se.tab));
  if (se.tab === "rules") {
    body.innerHTML = `<p class="hint" style="margin:0 0 10px">The written rules Claude follows when it plans each edit: layout choices, hook, ending, graphics, do's and don'ts. The <code>&lt;&lt;SETTINGS&gt;&gt;</code> line is where the Settings tab is saved; leave it in place.</p><textarea class="rules" id="rulesText" spellcheck="true">${esc(se.prose)}</textarea>`;
    $("#rulesText").oninput = (e) => { se.prose = e.target.value; markDirty(); };
  } else if (se.tab === "settings") {
    body.innerHTML = `<p class="hint" style="margin:0 0 10px">Exact values the renderer uses. Changes show in the preview straight away.</p>` + settingsHtml(se.config);
    body.oninput = (e) => {
      const t = e.target, path = t.dataset.path;
      if (!path) return;
      let v = t.value;
      if (t.dataset.kind === "num") { v = parseFloat(v); if (Number.isNaN(v)) return; body.querySelectorAll(`[data-path="${path}"]`).forEach((x) => x !== t && (x.value = v)); }
      if (t.dataset.kind === "bool") v = t.checked;
      if (t.dataset.kind === "color") { body.querySelectorAll(`[data-path="${path}"]`).forEach((x) => x !== t && (x.value = v.toUpperCase())); v = v.toUpperCase(); }
      if (t.dataset.kind === "list") v = v.split(",").map((x) => x.trim()).filter(Boolean);
      if (t.dataset.kind === "nullable") v = v === "" ? null : v;
      setAt(se.config, path, v);
      if (path.startsWith("layouts.")) { const sum = Object.values(se.config.layouts).reduce((a, b) => a + b, 0); const el = $("#layoutSum"); el.textContent = `Total ${Math.round(sum * 100)}%`; el.className = Math.abs(sum - 1) > 0.05 ? "sumbad" : "sumok"; }
      if (path.startsWith("fonts.")) loadStyleFonts();
      renderPreview();
      markDirty();
    };
  } else if (se.tab === "examples") {
    const L = se.learning || {};
    body.innerHTML = `<p class="hint" style="margin:0 0 10px">Edits you approved for this style. New edits read the three most recent before planning, so the style learns what "good" looks like.</p>
      <div class="stats"><div class="stat"><b>${L.approved ?? 0}</b><span>approved videos</span></div>
        <div class="stat"><b>${L.avgChanges ?? "–"}</b><span>avg changes before approval</span></div>
        <div class="stat"><b>${L.recentAvgChanges ?? "–"}</b><span>last 5 videos${L.recentAvgChanges != null && L.avgChanges != null ? (L.recentAvgChanges < L.avgChanges ? " · improving" : L.recentAvgChanges > L.avgChanges ? " · rising" : "") : ""}</span></div></div>
      ${se.examples?.length ? `<div class="excards">${se.examples.map((e) => `<div class="excard"><a href="#/job/${e.job}"><img src="/api/styles/${se.name}/examples/${e.job}/poster" alt=""></a>
        <div><b>${esc(e.title)}</b><span class="muted">v${e.version} · ${e.revisions} change${e.revisions === 1 ? "" : "s"} · ${ago(e.at)}</span><br><button class="btn small ghost" data-unex="${e.job}" style="padding:2px 0">Remove</button></div></div>`).join("")}</div>`
        : '<p class="muted">No examples yet. Approve a finished video that uses this style to add one.</p>'}
      <div class="group" style="margin-top:16px"><h4>Watching for</h4>
        ${L.observations?.length ? L.observations.map((o) => `<div class="frow"><span><b>${esc(o.title)}</b><small>Seen in ${o.count} video${o.count > 1 ? "s" : ""}${o.count >= 2 ? " · will be suggested for the style next time" : ""}</small></span><button class="btn small del" data-unobs="${esc(o.key)}">Forget</button></div>`).join("")
          : '<p class="muted" style="margin:0;font-size:13px">Nothing yet. Possible preferences from approved edits show here until they repeat.</p>'}</div>`;
    body.onclick = async (e) => {
      const ex = e.target.closest("[data-unex]"), ob = e.target.closest("[data-unobs]");
      if (!ex && !ob) return;
      if (ex && !confirm("Remove this example? Future edits won't learn from it.")) return;
      const r = await api(ex ? `/api/styles/${se.name}/examples/${ex.dataset.unex}` : `/api/styles/${se.name}/observations/${ob.dataset.unobs}`, { method: "DELETE" });
      Object.assign(se, { examples: r.examples, learning: r.learning });
      renderTab();
    };
  } else if (se.tab === "history") {
    body.innerHTML = `<p class="hint" style="margin:0 0 10px">A copy of the style is saved before every change: hand edits, Ask-Claude changes and lessons from approved videos. Restore one to undo.</p>
      <div class="files">${se.history?.length ? se.history.map((h) => `<div class="frow"><span><b>${esc(h.reason)}</b><small>${new Date(h.at).toLocaleString()}</small></span><button class="btn small del" data-restore="${esc(h.file)}">Restore</button></div>`).join("")
        : '<p class="muted">No saved versions yet. One is created automatically before the next change.</p>'}</div>`;
    body.onclick = async (e) => {
      const b = e.target.closest("[data-restore]");
      if (!b || !confirm("Restore this version? The current style is saved to History first, so you can undo this too.")) return;
      try {
        const r = await api(`/api/styles/${se.name}/history/${b.dataset.restore}/restore`, { method: "POST" });
        toast("Style restored");
        se = { ...se, ...r, saved: JSON.stringify([r.prose, r.config]) };
        renderTab(); renderPreview();
      } catch (err) { toast(err.message); }
    };
  } else {
    const groups = { fonts: [], backgrounds: [], logos: [] };
    se.assets.forEach((a) => (groups[a.path.includes("/") ? a.path.split("/")[0] : "other"] ||= []).push(a));
    const blurb = { fonts: "Font files (.ttf, .otf, .woff2) for headings, captions and labels", backgrounds: "Images or videos that sit behind graphics", logos: "Logos used in this style's graphics" };
    const accept = { fonts: ".ttf,.otf,.woff,.woff2", backgrounds: "image/*,video/*", logos: "image/*" };
    body.innerHTML = `<p class="hint" style="margin:0 0 10px">Fonts, backgrounds and logos for this style. They're copied into every edit that uses it.</p>
      ${Object.entries(groups).map(([g, list]) => `<div class="group"><h4><span>${esc(human(g))} <span class="muted" style="font-weight:400">${list.length}</span></span>
        <label class="btn small">+ Add<input type="file" data-folder="${esc(g)}" accept="${accept[g] || ""}" multiple hidden></label></h4>
        ${blurb[g] ? `<p class="hint" style="margin:-6px 0 10px">${blurb[g]}</p>` : ""}
        <div class="files">${list.map((a) => {
        const url = `/api/styles/${se.name}/assets?path=${encodeURIComponent(a.path)}`;
        const ext = a.path.split(".").pop().toLowerCase();
        const thumb = /png|jpe?g|webp|gif|svg/.test(ext) ? `<img src="${url}">` : /mp4|mov|webm/.test(ext) ? `<video src="${url}" muted></video>` : /ttf|otf|woff/.test(ext) ? `<span style="font-family:'${esc(Object.values(se.config.fonts || {}).find((f) => f.file === a.path)?.family || "inherit")}'">Aa</span>` : "📄";
        const usedBy = Object.entries(se.config.fonts || {}).filter(([, f]) => f.file === a.path).map(([r]) => r);
        const bgUse = se.config.background?.file === a.path ? ["background"] : [];
        return `<div class="frow"><span class="thumb">${thumb}</span><span><b>${esc(a.path.split("/").pop())}</b><small>${(a.size / 1024).toFixed(0)} KB${[...usedBy, ...bgUse].length ? ` · used for ${[...usedBy, ...bgUse].join(", ")}` : ""}</small></span><button class="btn small del" data-del="${esc(a.path)}">Delete</button></div>`;
      }).join("") || '<p class="muted" style="margin:0;font-size:13px">Nothing here yet.</p>'}</div></div>`).join("")}`;
    body.onchange = async (e) => {
      const input = e.target.closest("[data-folder]");
      if (!input) return;
      for (const file of input.files) {
        toast(`Uploading ${file.name}…`);
        const r = await fetch(`/api/styles/${se.name}/assets?path=${encodeURIComponent(`${input.dataset.folder}/${file.name}`)}`, { method: "POST", body: file });
        se.assets = (await r.json()).assets;
      }
      toast("Uploaded");
      renderTab();
    };
    body.onclick = async (e) => {
      const d = e.target.closest("[data-del]");
      if (!d) return;
      const inUse = JSON.stringify(se.config).includes(`"${d.dataset.del}"`);
      if (!confirm(inUse ? `${d.dataset.del} is used by this style's settings. Delete it anyway? The style won't validate until you pick another file.` : `Delete ${d.dataset.del}?`)) return;
      const r = await api(`/api/styles/${se.name}/assets?path=${encodeURIComponent(d.dataset.del)}`, { method: "DELETE" });
      se.assets = r.assets;
      renderTab();
    };
  }
}


function nameDialog(action, name) {
  if (!$("#saveBtn").disabled) return toast("Save or discard your changes first");
  const d = $("#styleDlg");
  d.innerHTML = `<form method="dialog" id="nmForm">
    <h3>${action === "rename" ? `Rename ${esc(name)}` : `Duplicate ${esc(name)}`}</h3>
    <p class="muted" style="margin:0">${action === "rename" ? "Past edits keep working; their history label updates to the new name." : "Makes an unlocked copy you can change without touching the original."}</p>
    <label>New name<input type="text" name="to" required value="${action === "rename" ? esc(name) : `${esc(name)}-copy`}"></label>
    <p class="muted" style="margin:0;font-size:12.5px">Lowercase letters, numbers and dashes. Spaces become dashes.</p>
    <div class="actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">${action === "rename" ? "Rename" : "Duplicate"}</button></div>
  </form>`;
  d.showModal();
  const input = $("#nmForm [name=to]");
  input.select();
  $("#nmForm").onsubmit = async (e) => {
    if (e.submitter?.value !== "ok") return;
    e.preventDefault();
    try {
      const r = await api(`/api/styles/${name}/${action}`, { method: "POST", body: { to: input.value } });
      d.close();
      if (localStorage.getItem("se-style") === name && action === "rename") localStorage.setItem("se-style", r.name);
      if (draft.style === name && action === "rename") draft.style = r.name;
      toast(action === "rename" ? `Renamed to ${r.name}` : `Created ${r.name}`);
      se = null;
      location.hash = `#/style/${r.name}`;
    } catch (err) { toast(err.message); }
  };
}

  $("#view").innerHTML = `
    <div class="se-head"><a href="#/new" class="btn small ghost">← Back</a><h2>${esc(st.name)}</h2>
      <span class="tag">${st.kind}</span>${st.config.locked ? '<span class="tag lock">Locked</span>' : ""}
      <div class="tabs"><button data-tab="settings">Settings</button><button data-tab="rules">Rules</button><button data-tab="files">Files</button><button data-tab="examples">Examples${st.examples?.length ? ` ${st.examples.length}` : ""}</button><button data-tab="history">History</button></div>

        <label style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted)"><input type="checkbox" id="bandsTgl" ${se.bands ? "checked" : ""}> Show Instagram UI zones</label>
        <p class="hint" style="text-align:center;margin-top:8px">Approximate preview. Renders use the same values.</p>
      </div></div>`;
  document.querySelectorAll(".tabs [data-tab]").forEach((b) => (b.onclick = () => { se.tab = b.dataset.tab; renderTab(); }));
  document.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => { se.mode = b.dataset.mode; document.querySelectorAll("[data-mode]").forEach((x) => x.classList.toggle("on", x === b)); renderPreview(); }));
  $("#bandsTgl").onchange = (e) => { se.bands = e.target.checked; renderPreview(); };
  $("#claudeRefine").onclick = () => openRefine(name);
  if ($("#renameBtn")) $("#renameBtn").onclick = () => nameDialog("rename", name);
  $("#dupBtn").onclick = () => nameDialog("duplicate", name);
  $("#saveBtn").onclick = async () => {
    $("#saveBtn").disabled = true;
    try {
      const r = await api(`/api/styles/${name}`, { method: "PUT", body: { prose: se.prose, config: se.config } });
      se.prose = r.prose; se.config = r.config; se.assets = r.assets; se.history = r.history; se.saved = JSON.stringify([r.prose, r.config]);
      markDirty();
      toast("Style saved");
      if (se.tab === "rules") renderTab();
    } catch (e) { toast(e.message); markDirty(); }
  };
  renderTab();
  loadStyleFonts();
  renderPreview();
  updateRunBanner();
}

async function updateRunBanner() {
  if (!se || !$("#runBanner")) return;
  const list = await api("/api/styles").catch(() => []);
  const run = list.find((x) => x.name === se.name)?.run;
  const busy = run && /queued|running/.test(run.status);
  const last = run?.log?.filter((l) => l.t === "say").at(-1)?.text;
  if (se.runStatus && /queued|running/.test(se.runStatus) && !busy) {
    se.runStatus = run?.status;
    if (run?.status === "done") { toast("Style updated"); se.tab = se.tab; return viewStyle(se.name); }
  }
  se.runStatus = run?.status;
  $("#runBanner").innerHTML = busy
    ? `<div class="group" style="display:flex;gap:12px;align-items:center;border-color:var(--brand)"><span class="dot running"></span><div style="flex:1;min-width:0"><b>AI editor is ${run.kind === "refine" ? "changing" : "building"} this style${run.status === "queued" ? " (queued)" : ""}…</b><div class="muted" style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(last || "Starting…")}</div></div><button class="btn small" id="runLog">Details</button></div>`
    : run?.status === "error" ? `<div class="group" style="border-color:var(--err)"><b style="color:var(--err)">The last change failed.</b> <span class="muted">${esc((run.summary || "").slice(0, 200))}</span></div>` : run?.warning ? `<div class="group"><b>Style saved and validated.</b> <span class="muted">The connection interrupted final confirmation.</span></div>` : "";
  if ($("#runLog")) $("#runLog").onclick = () => openStyleRun({ name: se.name, run });
  if ($("#saveBtn")) $("#saveBtn").title = busy ? "Wait for the AI editor to finish" : "";
}

function hfPreviews(root, wide) {
  const [w, h] = wide ? [1920, 1080] : [1080, 1920];
  hfObserver?.disconnect();
  // ponytail: only iframes in view play, unloads off-screen ones so ~80 GSAP pages don't run at once
  hfObserver = new IntersectionObserver((es) => es.forEach(({ target: f, isIntersecting }) => {
    f.style.cssText = `width:${w}px;height:${h}px;transform:scale(${f.parentElement.clientWidth / w})`;
    if (isIntersecting) { if (!f.src || f.src === "about:blank") f.src = f.dataset.src; } else if (f.src) f.src = "about:blank";
  }), { rootMargin: "200px" });
  root.querySelectorAll(".gl-hf iframe").forEach((f) => hfObserver.observe(f));
}

function pickTemplate(aspect) {
  return new Promise(async (resolve) => {
    const d = $("#tplDlg"), list = (await loadHf()).filter((t) => t.aspect === aspect);
    d.innerHTML = `<div class="body tpl-pick"><div class="tpl-pick-head"><h3>Choose a template</h3><input id="tplSearch" type="search" placeholder="Search ${list.length} ${aspect} templates" aria-label="Search templates"><button class="btn" id="tplCancel">Cancel</button></div>
      <div class="gl-grid ${aspect === "16:9" ? "wide" : ""}" id="tplGrid">${list.map((t) => hfCard(t, `<button class="btn small primary" data-pick="${esc(t.id)}" style="margin-top:8px">Use this</button>`)).join("")}</div></div>`;
    const done = (t) => { hfObserver?.disconnect(); d.close(); resolve(t); };
    d.onclose = () => resolve(null);
    $("#tplCancel").onclick = () => done(null);
    d.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => done(list.find((t) => t.id === b.dataset.pick))));
    $("#tplSearch").oninput = (e) => { const q = e.target.value.toLowerCase(); d.querySelectorAll("[data-tpl]").forEach((c) => (c.hidden = !c.textContent.toLowerCase().includes(q))); };
    d.showModal();
    hfPreviews(d, aspect === "16:9");
  });
}
const runRows = (runs) => runs.filter((r) => r.status !== "done").map((r) => `<div class="group" style="display:flex;gap:12px;align-items:center;margin:12px 0"><span class="dot ${r.status === "error" ? "" : "running"}"></span><div style="flex:1;min-width:0"><b>${esc(r.name)}</b> <span class="muted">${r.aspect} · ${r.status === "error" ? "failed" : r.status === "queued" ? "queued" : "building…"}</span><div class="muted" style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.status === "error" ? r.summary : r.log?.filter((l) => l.text).at(-1)?.text || "Starting…")}</div></div>${r.status === "error" ? `<button class="btn small" data-del-tpl="${esc(r.id)}">Dismiss</button>` : ""}</div>`).join("");
async function viewGraphics(poll) {
  if (!poll) styles = await api("/api/styles");
  const usable = styles.filter((s) => !isBusy(s) && !isFailed(s));
  glStyle = usable.some((s) => s.name === glStyle) ? glStyle : usable.some((s) => s.name === draft.style) ? draft.style : usable[0]?.name ?? "";
  const { items, run } = await api(`/api/graphics?style=${encodeURIComponent(glStyle)}&aspect=${glAspect}`);
  const running = run?.status === "running";
  const runs = await api("/api/templates/runs").catch(() => []);
  const building = runs.some((r) => /queued|running/.test(r.status)), wasBuilding = $("#view").dataset.building === "1";
  if (poll && !running && $("#glRender")?.dataset.running !== "1") {
    if (building) { $("#glRuns").innerHTML = runRows(runs); return; }
    if (!wasBuilding) return;
    hfList = null;
  }
  const hf = (await loadHf()).filter((t) => t.aspect === glAspect);
  const rendered = items.some((g) => g.still), wide = glAspect === "16:9";
  $("#view").dataset.building = building ? 1 : 0;
  $("#view").innerHTML = `
    <div class="se-head"><h2>Graphics library</h2><span class="grow"></span>
      <div class="tabs">${["9:16", "16:9"].map((a) => `<button data-gl-aspect="${a}" class="${a === glAspect ? "on" : ""}">${a}</button>`).join("")}</div>
      <select id="glStyle" aria-label="Preview style" style="width:auto">${usable.map((s) => `<option ${s.name === glStyle ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select>
      <button class="btn small primary" id="glRender" data-running="${running ? 1 : 0}" ${running || !glStyle ? "disabled" : ""}>${running ? "Rendering…" : rendered ? "Re-render previews" : "Render previews"}</button></div>
    <div style="display:flex;align-items:center;gap:12px"><h3 style="margin:0">Templates <span class="muted" style="font-weight:400">${items.length + hf.length}</span></h3><span class="grow" style="flex:1"></span><button class="btn small" id="glNewTemplate">+ New template</button></div>
    <div id="glRuns">${runRows(runs)}</div>
    <p class="hint">Pick one for any part of the transcript when you start an edit, or build your own with New template. Built-in graphics preview in the selected style${run?.status === "error" ? ` · <span style="color:var(--danger,#d33)">${esc(run.error)}</span>` : ""}.</p>
    <div class="gl-grid ${wide ? "wide" : ""}">${items.map((g) => `<div class="gl-card"><div class="gl-still">${g.still ? `<img src="${g.still}" alt="${esc(g.name)} preview" loading="lazy">` : running ? "Rendering…" : "No preview yet"}</div>
      <div class="gl-meta"><b>${esc(g.name)}</b><code>${esc(g.type)}</code>${g.media ? " · uses your media" : ""}<p>${esc(g.about)}</p></div></div>`).join("")}${hf.map((t) => hfCard(t, t.custom ? `<button class="btn small ghost" data-del-tpl="${esc(t.id)}" style="padding:2px 0;margin-top:6px">Delete</button>` : "")).join("")}</div>`;
  $("#glNewTemplate").onclick = newTemplate;
  $("#view").onclick = async (e) => {
    const b = e.target.closest("[data-del-tpl]");
    if (!b || (b.textContent === "Delete" && !confirm("Delete this template?"))) return;
    await api(`/api/templates/${b.dataset.delTpl}`, { method: "DELETE" });
    hfList = null; viewGraphics();
  };
  document.querySelectorAll("[data-gl-aspect]").forEach((b) => (b.onclick = () => { glAspect = b.dataset.glAspect; viewGraphics(); }));
  $("#glStyle").onchange = (e) => { glStyle = e.target.value; viewGraphics(); };
  $("#glRender").onclick = async () => { await api("/api/graphics", { method: "POST", body: { style: glStyle, aspect: glAspect } }).catch((e) => toast(e.message)); viewGraphics(); };
  hfPreviews($("#view"), wide);
}

let lastHash = location.hash;
async function route() {
  if (se && $("#saveBtn") && !$("#saveBtn").disabled && !location.hash.startsWith(`#/style/${se.name}`) && !confirm("Leave without saving your style changes?")) { history.replaceState(null, "", lastHash); return; }
  lastHash = location.hash;
  clearInterval(timer);
  const [, view, id] = location.hash.split("/");
  refreshSide();
  $("#graphicsLink").classList.toggle("active", view === "graphics");
  if (view !== "graphics") hfObserver?.disconnect();
  if (view === "graphics") {
    await viewGraphics();
    timer = setInterval(() => viewGraphics(true), 3000);
  } else if (view === "style" && id) {
    await viewStyle(id);
    timer = setInterval(() => { refreshSide(); updateRunBanner(); }, 3000);
  } else if (view === "job" && id) {
    selectedVersion = null;
    await viewJob(id);
    let last = null;
    timer = setInterval(async () => {
      const j = await api(`/api/jobs/${id}`).catch(() => null);
      if (!j) return;
      if (j.status === "running" || j.status === "queued" || j.status !== last) viewJob(id, true);
      last = j.status;
      refreshSide();
    }, 2000);
  } else {
    await viewNew();
    timer = setInterval(async () => {
      refreshSide();
      const next = await api("/api/styles").catch(() => styles);
      if (JSON.stringify(next.map((s) => [s.name, s.run?.status])) !== JSON.stringify(styles.map((s) => [s.name, s.run?.status])) && !$("#styleDlg").open && !document.querySelector(".menu.open")) {
        styles = next;
        pickerLabels();
      }
    }, 3000);
  }
}
window.onhashchange = route;
$("#sideNewStyle").onclick = () => openNewStyle();
api("/api/meta").then(async (m) => {
  meta = m; await route();
  try {
    setup = await checkSetup();
    const provider = meta.models.find(m => m.id === draft.model)?.provider;
    if (!setup.providers.some(p => p.id === provider && p.ready)) await openSetup();
  } catch { await openSetup(); }
});
</script>
