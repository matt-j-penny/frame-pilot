<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame Pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F5F9; --panel: #FFFFFF; --ink: #0D0F14; --muted: #6B7183; --line: #E2E5EE; --soft: #EEF0F6;
    --brand: #2F5BFF; --brand-ink: #FFFFFF; --brand-soft: #E6ECFF; --grad: linear-gradient(135deg, #2F5BFF 0%, #8B3DFF 55%, #FF3D8B 100%); --ok: #1F9D55; --warn: #C2410C; --err: #D92D3A;
    --radius: 14px; --shadow: 0 1px 2px rgba(16,20,30,.05), 0 6px 24px rgba(16,20,30,.06);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B0D12; --panel: #141821; --ink: #EEF1F8; --muted: #8A91A5; --line: #232836; --soft: #1B202B; --brand: #5B7CFF; --brand-soft: #1C2546; --shadow: 0 1px 2px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.45; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 6px; }
  .mark { width: 24px; height: 38px; border-radius: 7px; background: var(--grad); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(47,91,255,.35); }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: -.2px; }
  .brand small { display: block; color: var(--muted); font-size: 12px; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 14px; font-weight: 600; }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .side-head { display: flex; align-items: center; justify-content: space-between; padding-right: 4px; }
  .side-add { width: 24px; height: 24px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 16px; line-height: 1; display: grid; place-items: center; padding: 0; }
  .side-add:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .history-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 8px 0; }
  .history { overflow: auto; display: flex; flex-direction: column; gap: 2px; }
  .hitem { display: block; text-decoration: none; color: inherit; padding: 9px 10px; border-radius: 10px; }
  .hitem:hover { background: var(--soft); }
  .hitem.active { background: var(--brand-soft); }
  .hitem b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hitem span { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.running, .dot.queued { background: var(--brand); animation: pulse 1.2s infinite; }
  .dot.done { background: var(--ok); } .dot.preview { background: var(--warn); } .dot.error { background: var(--err); } .dot.cancelled { background: var(--muted); }
  @keyframes pulse { 50% { opacity: .35; } }
  .claude-status { margin-top: auto; font-size: 12px; color: var(--muted); padding: 8px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  main { padding: 28px 36px 60px; max-width: 1180px; width: 100%; }
  .page-title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-title h2 { margin: 0; font-size: 26px; letter-spacing: -.4px; }
  .page-title p { margin: 0; color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; display: flex; align-items: center; gap: 10px; }
  .card .hint { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
  .num { width: 22px; height: 22px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .drop { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; border: 2px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center; color: var(--muted); transition: .15s; }
  .drop p { margin: 6px 0 0; }
  .drop .bar { width: 60%; }
  .drop.over { border-color: var(--brand); background: var(--brand-soft); }
  .drop strong { color: var(--ink); }
  .uploaded { display: flex; gap: 18px; align-items: center; }
  .uploaded video { width: 120px; aspect-ratio: 9/16; object-fit: cover; border-radius: 10px; background: #000; }
  .bar { height: 6px; background: var(--soft); border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--brand); width: 0; transition: width .3s; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg label { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .seg input { display: none; }
  .seg label:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
  .seg b { display: block; } .seg small { color: var(--muted); }
  .styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .style { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; background: var(--panel); position: relative; text-align: left; padding: 0; }
  .style.sel { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand); }
  .style.busy { cursor: default; opacity: .8; }
  .swatch { height: 64px; display: flex; align-items: flex-end; gap: 6px; padding: 10px; }
  .swatch i { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.08); }
  .style .meta { padding: 10px 12px 12px; }
  .style .meta b { display: block; }
  .style .meta small { color: var(--muted); display: block; font-size: 12px; min-height: 32px; }
  .tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 99px; background: var(--soft); color: var(--muted); }
  .tag.lock { background: #E7F6EC; color: var(--ok); }
  .tag.build { background: var(--brand-soft); color: var(--brand); }
  .style .refine { position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 3px 9px; border-radius: 99px; border: none; background: rgba(255,255,255,.85); color: #222; display: none; }
  .style:hover .refine { display: block; }
  .newstyle { border: 2px dashed var(--line); border-radius: 12px; display: grid; place-items: center; min-height: 150px; color: var(--muted); font-weight: 600; background: transparent; }
  .newstyle:hover { border-color: var(--brand); color: var(--brand); }
  textarea, input[type=text], select { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; outline: none; }
  textarea:focus, input[type=text]:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  textarea { resize: vertical; min-height: 84px; }
  .go { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
  .go .btn { padding: 12px 22px; font-size: 15px; }
  .hero { min-height: calc(100vh - 140px); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 26px; }
  .hero h2 { font-weight: 800; font-size: 46px; letter-spacing: -2px; margin: 0; display: flex; align-items: center; gap: 16px; }
  .hero h2 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand); background: var(--brand-soft); padding: 5px 12px; border-radius: 99px; margin-bottom: -10px; }
  .hero h2 svg { flex: none; }
  .hero .sub { color: var(--muted); margin: -14px 0 0; font-size: 15px; text-align: center; }
  .composer-wrap { width: min(760px, 100%); }
  .composer { background: var(--panel); border: 1.5px solid var(--line); border-radius: 16px; box-shadow: 0 1px 0 rgba(13,15,20,.04), 0 18px 40px -18px rgba(47,91,255,.25); padding: 14px 14px 10px; transition: .15s; }
  .composer:focus-within { border-color: var(--brand); }
  .composer.over { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .composer textarea { border: none; box-shadow: none !important; padding: 4px 6px; min-height: 58px; max-height: 240px; resize: none; font-size: 16px; background: transparent; }
  .composer-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .iconbtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid transparent; background: transparent; display: grid; place-items: center; color: var(--ink); }
  .iconbtn:hover { background: var(--soft); }
  .send { height: 38px; padding: 0 16px 0 14px; border-radius: 99px; border: none; background: var(--grad); color: #fff; display: inline-flex; align-items: center; gap: 6px; margin-left: auto; font-weight: 700; font-size: 14px; }
  .send svg { width: 16px; height: 16px; }
  .send:disabled { opacity: .35; cursor: not-allowed; }
  .attach { display: inline-flex; align-items: center; gap: 10px; background: var(--soft); border-radius: 12px; padding: 6px 8px 6px 6px; margin: 0 0 10px 4px; max-width: 100%; }
  .attach video { width: 34px; height: 60px; object-fit: cover; border-radius: 6px; background: #000; }
  .attach .thumb { width: 34px; height: 60px; border-radius: 6px; background: linear-gradient(160deg, #3a3936, #141413); display: grid; place-items: center; }
  .attach b { display: block; font-size: 13px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach small { color: var(--muted); font-size: 12px; }
  .attach .x { border: none; background: none; color: var(--muted); font-size: 18px; padding: 0 4px; }
  .attach .bar { width: 120px; margin-top: 4px; }
  .vdrop { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 34px 20px; border: 2px dashed var(--line); border-radius: 12px; cursor: pointer; text-align: center; transition: .15s; }
  .vdrop:hover, .composer.over .vdrop { border-color: var(--brand); background: var(--brand-soft); }
  .vdrop-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--grad); color: #fff; display: grid; place-items: center; margin-bottom: 6px; box-shadow: 0 10px 24px -8px rgba(47,91,255,.5); }
  .vdrop b { font-size: 17px; }
  .vdrop small { color: var(--muted); font-size: 13px; }
  .vfile { display: flex; align-items: center; gap: 14px; padding: 8px; border-radius: 12px; background: var(--soft); }
  .vfile video, .vfile .thumb { width: 54px; height: 96px; border-radius: 8px; object-fit: cover; background: #000; flex: none; display: grid; place-items: center; }
  .vfile .vmeta { flex: 1; min-width: 0; }
  .vfile b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vfile small { color: var(--muted); font-size: 12.5px; }
  .vfile .bar { margin: 6px 0 2px; max-width: 240px; }
  .vfile .x { border: none; background: none; color: var(--muted); font-size: 20px; padding: 0 6px; }
  .direction-row { margin-top: 12px; border-top: none; padding-top: 0; }
  .composer .direction-row textarea { min-height: 96px !important; font-size: 14px !important; padding: 12px 14px !important; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); }
  .composer .direction-row textarea:focus { border-color: var(--brand); }
  #goBtn { width: 180px; max-width: 100%; height: 42px; justify-content: center; }
  .pickers { display: flex; justify-content: center; gap: 10px; padding: 14px 0 0; }
  .dd { position: relative; }
  .ddbtn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--panel); color: var(--muted); padding: 7px 12px; border-radius: 99px; font-size: 13.5px; }
  .ddbtn:hover { border-color: var(--brand); color: var(--ink); }
  .ddbtn .lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .ddbtn b { color: var(--ink); font-weight: 500; }
  .ddbtn .sw { width: 16px; height: 16px; border-radius: 5px; border: 1px solid rgba(0,0,0,.1); }
  .menu { position: absolute; top: calc(100% + 6px); z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 16px 50px rgba(20,20,19,.16); padding: 6px; width: min(400px, 90vw); max-height: 420px; overflow: auto; display: none; }
  .menu.open { display: block; }
  .menu.right { right: 0; }
  .model-search { position: sticky; top: -6px; z-index: 1; width: 100%; margin: -6px 0 6px; padding: 10px; border: none; border-bottom: 1px solid var(--line); border-radius: 0; background: var(--panel); font-size: 13.5px; outline: none; }
  .pickers .dd:first-child .menu { left: 0; }
  .mi { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: none; background: transparent; border-radius: 10px; padding: 9px 10px; }
  .mi:hover { background: var(--soft); }
  .mi .sw3 { display: flex; gap: 3px; flex: none; padding: 5px; border-radius: 8px; }
  .mi .sw3 i { width: 10px; height: 18px; border-radius: 3px; }
  .mi b { display: block; font-weight: 600; font-size: 14px; }
  .mi small { display: block; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mi > span:not(.sw3):not(.edit) { min-width: 0; flex: 1; }
  .mi .tick { margin-left: auto; color: var(--brand); visibility: hidden; flex: none; }
  .mi.on .tick { visibility: visible; }
  .mi .edit { margin-left: auto; font-size: 12px; color: var(--muted); padding: 2px 8px; border-radius: 6px; }
  .mi .edit:hover { background: var(--line); color: var(--ink); }
  .mi.dim { opacity: .55; }
  .menu hr { border: none; border-top: 1px solid var(--line); margin: 6px 4px; }
  .job { display: grid; grid-template-columns: 380px minmax(0, 560px); gap: 40px; align-items: center; justify-content: center; min-height: calc(100vh - 160px); }
  #jobRight { display: flex; flex-direction: column; gap: 12px; }
  .jstatus { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; flex-wrap: wrap; }
  .jstatus .bar { flex-basis: 100%; height: 3px; }
  .jstatus.err { color: var(--err); }
  .phone { width: 100%; max-width: 360px; aspect-ratio: 9/16; border-radius: 34px; background: #0B0C10; padding: 10px; box-shadow: 0 20px 50px rgba(16,20,30,.25); margin: 0 auto; }
  .phone video, .phone .empty { width: 100%; height: 100%; border-radius: 26px; object-fit: cover; background: #000; display: block; }
  .phone .empty { display: grid; place-items: center; color: #8C93A3; text-align: center; padding: 30px; background: radial-gradient(circle at 50% 35%, #23263A, #0B0C10); }
  .spinner { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,.15); border-top-color: #9B8CFF; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .versions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 14px 0 6px; }
  .versions button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
  .versions button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .vnote { text-align: center; color: var(--muted); font-size: 12.5px; min-height: 18px; }
  .checklist { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .checklist li { display: flex; align-items: center; gap: 10px; padding: 7px 4px; color: var(--muted); }
  .checklist li.done { color: var(--ink); }
  .checklist li.active { color: var(--ink); font-weight: 600; }
  .ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
  li.done .ck { background: var(--ok); border-color: var(--ok); }
  li.active .ck { border-color: var(--brand); border-top-color: transparent; animation: spin .9s linear infinite; }
  .progress-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .progress-head b { font-size: 15px; }
  .log { max-height: 260px; overflow: auto; font-size: 12.5px; display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .log .say { white-space: pre-wrap; }
  .log .tool { font-family: ui-monospace, Menlo, monospace; color: var(--muted); font-size: 11.5px; }
  .summary { white-space: pre-wrap; background: var(--soft); border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-top: 12px; }
  .summary.err { background: #FDECEC; color: var(--err); }
  .toolbar { display: flex; gap: 8px; margin-left: auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--soft); border-radius: 99px; padding: 3px 10px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .revise { display: flex; flex-direction: column; gap: 10px; }
  .revise .row { display: flex; gap: 10px; align-items: center; }
  .revise select { width: auto; }
  dialog { border: none; border-radius: 16px; padding: 0; width: min(560px, 92vw); background: var(--panel); color: var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(10,12,20,.45); }
  dialog form, dialog .body { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  dialog h3 { margin: 0; }
  dialog label { font-weight: 600; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 10px; font-weight: 600; opacity: 0; transition: .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  .muted { color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }


  /* approve & learning */
  .approve { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 14px; }
  .approve .btn.primary { background: var(--grad); border: none; padding: 10px 20px; border-radius: 99px; }
  .approve small { color: var(--muted); font-size: 12px; text-align: center; max-width: 320px; }
  .approved { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: var(--ok); background: #E7F6EC; border-radius: 99px; padding: 5px 12px; }
  .lessons { background: var(--panel); border: 1.5px solid var(--brand); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .lessons h3 { margin: 0; font-size: 16px; }
  .lessons .lsum { color: var(--muted); font-size: 13.5px; margin: -4px 0 0; }
  .lgroup h5 { margin: 6px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .lesson { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 6px; }
  .lesson input { margin-top: 3px; accent-color: var(--brand); width: 16px; height: 16px; flex: none; }
  .lesson b { display: block; font-weight: 600; font-size: 13.5px; }
  .lesson small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .lesson code { font-size: 11.5px; background: var(--soft); border-radius: 6px; padding: 1px 6px; margin-top: 4px; display: inline-block; }
  .lesson.muted { opacity: .65; }
  .lessons .row { display: flex; gap: 8px; justify-content: flex-end; }
  .learned { background: var(--soft); border-radius: 14px; padding: 12px 14px; font-size: 13px; }
  .learned b { display: block; margin-bottom: 4px; }
  .excards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .excard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .excard img { width: 100%; aspect-ratio: 9/14; object-fit: cover; display: block; background: #111; }
  .excard div { padding: 8px 10px; font-size: 12.5px; }
  .excard b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .excard .muted { font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 22px; letter-spacing: -.5px; }
  .stat span { color: var(--muted); font-size: 12px; }
  /* style editor */
  .se-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; position: sticky; top: 0; background: var(--bg); padding: 12px 0; z-index: 4; }
  .se-head h2 { margin: 0; font-size: 24px; letter-spacing: -.6px; }
  .se-head .grow { flex: 1; }

  /* ===== redesign layer ===== */
  :root {
    --bg: #F7F7F8; --panel: #FFFFFF; --side: #FBFBFC; --ink: #111114; --ink-2: #3A3A42; --muted: #6E6E78; --faint: #9A9AA3;
    --line: #E6E6EA; --line-2: #D9D9DF; --soft: #F2F2F4;
    --brand: #7C3AED; --brand-ink: #FFFFFF; --brand-soft: #F3EDFE; --brand-line: #D6C4FB; --brand-hover: #6D28D9;
    --grad: linear-gradient(135deg, #8B3DFF 0%, #6D3BFF 100%);
    --grad-text: linear-gradient(120deg, #6D3BFF 0%, #A855F7 60%, #C04BEA 100%);
    --ok: #15803D; --ok-soft: #E8F5EC; --warn: #B45309; --err: #DC2626; --err-soft: #FDEEEE;
    --radius: 12px; --r-sm: 8px;
    --shadow-sm: 0 1px 2px rgba(17,17,20,.05);
    --shadow: 0 1px 2px rgba(17,17,20,.04), 0 8px 24px -10px rgba(17,17,20,.10);
    --shadow-lg: 0 2px 4px rgba(17,17,20,.04), 0 24px 60px -16px rgba(17,17,20,.22);
    --ring: 0 0 0 3px rgba(124,58,237,.16);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-feature-settings: "cv11", "ss01", "ss03";
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0B0D; --panel: #131316; --side: #0F0F12; --ink: #EDEDF0; --ink-2: #C5C5CC; --muted: #8C8C96; --faint: #63636C;
      --line: #232328; --line-2: #2E2E35; --soft: #1A1A1F;
      --brand: #A78BFA; --brand-soft: rgba(139,61,255,.16); --brand-line: rgba(167,139,250,.45); --brand-hover: #9A6BFF;
      --grad: linear-gradient(135deg, #9452FF 0%, #7444FF 100%);
      --grad-text: linear-gradient(120deg, #A78BFA 0%, #C084FC 60%, #E879F9 100%);
      --ok: #4ADE80; --ok-soft: rgba(74,222,128,.12); --err: #F87171; --err-soft: rgba(248,113,113,.12);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6); --shadow-lg: 0 24px 60px -12px rgba(0,0,0,.7);
      --ring: 0 0 0 3px rgba(139,61,255,.3);
    }
  }
  body { font-size: 13.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; letter-spacing: -.003em; }
  ::selection { background: var(--brand-soft); }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  a { color: var(--brand); }

    <nav class="history" id="history"></nav>
    <div class="side-foot">
      <button class="btn small" id="setupBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Setup</button>
      <div class="claude-status" id="claudeStatus"><span class="dot"></span><span>Ready</span></div>
    </div>
  </aside>
  <main id="view"></main>
</div>

<dialog id="styleDlg"></dialog>
<dialog id="setupDlg" aria-labelledby="setupTitle"></dialog>
<dialog id="tplDlg" class="tpl-dlg" aria-label="Choose a template"></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = async (url, opts = {}) => {
  const r = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opts, body: opts.body && typeof opts.body !== "string" ? JSON.stringify(opts.body) : opts.body });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Request failed");
  return d;
};
const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600); };
const ago = (ms) => { const s = (Date.now() - ms) / 1000; return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : `${Math.floor(s / 86400)}d ago`; };
const draft = { upload: null, editor: localStorage.getItem("se-editor") || "native", model: localStorage.getItem("se-model") || "opus", effort: localStorage.getItem("se-effort:" + (localStorage.getItem("se-model") || "opus")) || "default", style: localStorage.getItem("se-style") || "", direction: "", aspectRatio: "9:16", advanced: false, inspiration: null, references: [], features: { roughCut: true, subtitles: true, motionGraphics: true, sfx: true, music: true }, preview: false, ideas: 1, transcript: null, transcriptionId: null, transcriptEdits: [], selection: null, transcribing: false, attachmentsBusy: false };
let meta = { models: [] }, styles = [], timer = null;

async function refreshSide() {
  try {
    meta = await api("/api/meta");
    const jobs = await api("/api/jobs");
    const cur = location.hash.split("/")[2];
    $("#history").innerHTML = jobs.length ? jobs.map((j) => `
      <a class="hitem ${j.id === cur ? "active" : ""}" href="#/job/${j.id}">
        <b>${esc(j.title)}</b>
        <span><i class="dot ${j.status}"></i>${esc(j.style || "No style")} · ${j.versions ? `v${j.versions}` : j.status === "preview" ? "storyboard ready" : j.status}${j.approved ? ' · <b style="color:var(--ok);display:inline;font-weight:700">✓ approved</b>' : ""} · ${ago(j.created)}</span>
      </a>`).join("") : `<p class="muted" style="padding:0 8px">No edits yet.</p>`;
    const sl = await api("/api/styles");
    $("#styleNav").innerHTML = sl.map((x) => {
      const building = x.description === "Building…";
      const busy = x.run && /queued|running/.test(x.run.status);
      if (building) return `<a class="navlink" href="javascript:void 0" data-run="${esc(x.name)}"><i class="dot ${busy ? "running" : "error"}"></i>${esc(x.name)} <span class="muted" style="font-size:11px">${busy ? "building…" : "failed"}</span></a>`;
      return `<a class="navlink ${location.hash === "#/style/" + x.name ? "active" : ""}" href="#/style/${x.name}"><span class="sw" style="background:${esc(x.colors?.primary || x.background || "#ccc")}"></span>${esc(x.name)}${busy ? ' <span class="muted" style="font-size:11px">updating…</span>' : x.kind === "preset" ? ' <span class="muted" style="font-size:11px">preset</span>' : ""}</a>`;
    }).join("");
    $("#styleNav").onclick = (e) => { const a = e.target.closest("[data-run]"); if (a) { e.preventDefault(); openStyleRun(sl.find((x) => x.name === a.dataset.run)); } };
    const busy = meta.busy, q = meta.queued.length;
    $("#claudeStatus").innerHTML = busy ? `<span class="dot running"></span><span>Editing${q ? ` · ${q} queued` : ""}</span>` : `<span class="dot done"></span><span>Ready</span>`;
  } catch {}
}

// ---------- provider setup ----------
let setup = null;
async function checkSetup() {
  try { return await api("/api/setup"); }
  catch (error) {
    if (error.message === "not found") throw new Error("The app server is running an older version. Restart it with node app/server.mjs from the project folder, then click Try again.");
    throw error;
  }
}
async function openSetup() {
  const d = $("#setupDlg");
  d.innerHTML = `<div class="body"><h3 id="setupTitle">Set up your AI editor</h3><p>Checking installed tools and sign-in…</p></div>`;
  if (!d.open) d.showModal();
  try {
    setup = await checkSetup();
    const selected = meta.models.find(m => m.id === draft.model)?.provider;
    d.innerHTML = `<div class="body"><h3 id="setupTitle">Setup</h3>
      <h4 class="setup-section-title">AI provider</h4><p>Choose Claude, Codex / ChatGPT or OpenCode. You only need one. Run the commands below in Terminal on the computer running this app.</p>
      ${setup.providers.map(p => `<section style="border:1px solid var(--line);border-radius:10px;padding:14px">
        <h3>${esc(p.label)}</h3><p>${p.ready ? "✓ Ready" : p.status === "missing" ? "Installation needed" : p.status === "login" ? "Sign-in needed" : "Check failed"} · ${esc(p.message)}</p>
        ${!p.ready ? `${p.status === "missing" ? `<p>1. Install (requires Node.js/npm):</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere"><code>${esc(p.install)}</code></pre>` : ""}
        <p>${p.status === "missing" ? "2. " : ""}Sign in and complete the browser prompts:</p><pre><code>${esc(p.login)}</code></pre>` :
        `<button class="btn ${selected === p.id ? "primary" : ""}" data-use-provider="${p.id}">${selected === p.id ? "Selected" : "Use " + esc(p.label)}</button>`}
      </section>`).join("")}
      <h4 class="setup-section-title">Editing app</h4>
      <div class="editor-connections">${(setup.editors || []).map(editor => `<section class="editor-connection" data-editor-card="${editor.id}">
        <div class="editor-connection-heading"><h3>${esc(editor.label)}</h3><span class="tag ${editor.ready ? 'lock' : ''}">${editor.id === 'native' ? 'Ready' : editor.status === 'configured' ? 'Configured' : editor.ready ? 'Connected' : 'Not connected'}</span></div>
        <p class="muted" data-editor-message>${esc(editor.message)}</p>
        ${editor.id === 'native' ? `<button class="btn small ${draft.editor === editor.id ? 'primary' : ''}" data-use-editor="${editor.id}">${draft.editor === editor.id ? 'Selected' : 'Use Native'}</button>` : `
        <details><summary>Connection settings</summary><div class="editor-config-fields">
          ${editor.id === 'capcut' ? `<label>Bridge script<input type="text" data-config="bridge" value="${esc(editor.config.bridge)}" placeholder="/path/to/capcut-bridge.py"></label><label>uv command<input type="text" data-config="command" value="${esc(editor.config.command)}"></label>` : `
          <label>Transport<select data-config="type"><option value="http" ${editor.config.type === 'http' ? 'selected' : ''}>Local MCP URL</option><option value="stdio" ${editor.config.type !== 'http' ? 'selected' : ''}>MCP command</option></select></label>
          <label>MCP URL<input type="text" data-config="url" value="${esc(editor.config.url)}" placeholder="http://127.0.0.1:19789/mcp"></label>
          <label>Command<input type="text" data-config="command" value="${esc(editor.config.command)}" placeholder="/path/to/python"></label>
          <label>Arguments (JSON)<textarea data-config="args" rows="2">${esc(JSON.stringify(editor.config.args))}</textarea></label>`}
        </div></details>
        <div class="editor-connection-actions"><button class="btn small" data-connect-editor="${editor.id}">Save & connect</button><button class="btn small ${draft.editor === editor.id ? 'primary' : ''}" data-use-editor="${editor.id}" ${editor.ready ? '' : 'disabled'}>${draft.editor === editor.id ? 'Selected' : 'Use ' + esc(editor.label)}</button></div>`}
      </section>`).join('')}</div>
      <p class="muted">After installing, restart the server if it still cannot find the command. This check confirms local sign-in; account access is checked when an edit runs.</p>
      <div class="actions"><button class="btn" id="setupClose">Close</button><button class="btn primary" id="setupCheck">Check again</button></div></div>`;
    meta.editors = setup.editors || [];
    d.querySelectorAll('[data-use-editor]').forEach(button => button.onclick = () => {
      draft.editor = button.dataset.useEditor; localStorage.setItem('se-editor', draft.editor);
      if ($("#editorSelect")) { $("#editorSelect").value = draft.editor; updateGo(); }
      d.close(); toast('Editor selected');
    });
    d.querySelectorAll('[data-connect-editor]').forEach(button => button.onclick = async () => {
      const card = button.closest('[data-editor-card]'), id = button.dataset.connectEditor;
      button.disabled = true; button.textContent = 'Connecting…';
      try {
        const config = {};
        card.querySelectorAll('[data-config]').forEach(field => { config[field.dataset.config] = field.dataset.config === 'args' ? JSON.parse(field.value || '[]') : field.value; });
        const result = await api(`/api/editors/${id}`, {method:'POST',body:{config}});
        meta.editors = result.editors;
        const message = card.querySelector('[data-editor-message]'); message.textContent = result.editor.message;
        card.querySelector('.tag').textContent = result.editor.status === 'configured' ? 'Configured' : result.editor.ready ? 'Connected' : 'Not connected';
        card.querySelector('.tag').classList.toggle('lock',result.editor.ready);
        card.querySelector('[data-use-editor]').disabled = !result.editor.ready;
        updateGo();
      } catch(error) { card.querySelector('[data-editor-message]').textContent = error.message; }
      finally { button.disabled = false; button.textContent = 'Save & connect'; }
    });
    $("#setupCheck").onclick = openSetup;
    $("#setupClose").onclick = () => d.close();
    d.querySelectorAll('[data-use-provider]').forEach(button => button.onclick = () => {
      const provider = button.dataset.useProvider;
      if (meta.models.find(m => m.id === draft.model)?.provider !== provider)
        draft.model = meta.models.find(m => m.provider === provider && m.cliModel)?.id || setup.providers.find(p => p.id === provider).model;
      localStorage.setItem("se-model", draft.model);
      draft.effort = localStorage.getItem("se-effort:" + draft.model) || "default";
      if ($("#modelBtn")) pickerLabels();
      d.close(); toast("AI editor selected");
    });
  } catch (error) {
    d.innerHTML = `<div class="body"><h3 id="setupTitle">Setup check failed</h3><p>${esc(error.message)}</p><div class="actions"><button class="btn" id="setupClose">Close</button><button class="btn primary" id="setupCheck">Try again</button></div></div>`;
    $("#setupClose").onclick = () => d.close();
    $("#setupCheck").onclick = openSetup;
  }
}
$("#setupBtn").onclick = openSetup;

// ---------- new short ----------

const MARK = `<span class="mark" style="width:34px;height:54px;border-radius:10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>`;
const chev = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>`;
const tickSvg = `<svg class="tick" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>`;

const isBusy = (s) => s.run && /queued|running/.test(s.run.status);
const isFailed = (s) => s.run?.status === "error" && s.description === "Building…";
const sw3 = (s) => { const c = s.colors || {}; return `<span class="sw3" style="background:${esc(s.background || c.background || "#ddd")}">${[c.primary, c.accent, c.text].filter(Boolean).map((x) => `<i style="background:${esc(x)}"></i>`).join("")}</span>`; };

function styleMenu() {
  return `<button class="mi ${!draft.style ? "on" : ""}" data-style=""><span><b>No style</b><small>Follow your brief and references without a saved style</small></span>${tickSvg}</button><hr>` + styles.map((s) => {
    const note = isBusy(s) ? `${s.run.kind === "refine" ? "Refining" : "Building"}… (click for progress)` : isFailed(s) ? "Build failed (click for details)" : s.description;
    return `<button class="mi ${s.name === draft.style ? "on" : ""} ${isBusy(s) || isFailed(s) ? "dim" : ""}" data-style="${esc(s.name)}">
      ${sw3(s)}<span><b>${esc(s.name)}${s.locked ? " 🔒" : ""}</b><small>${esc(note)}${s.kind === "preset" ? " · preset" : ""}</small></span>
      ${isBusy(s) || isFailed(s) ? "" : `<span class="edit" data-editstyle="${esc(s.name)}">Edit</span>`}${tickSvg}</button>`;
  }).join("") + `<hr><button class="mi" data-newstyle><span class="sw3" style="background:var(--soft)"><b style="width:28px;text-align:center">+</b></span><span><b>New style</b><small>Document, references, or guided questions</small></span></button>`;
}

const PROVIDER_LABELS = { claude: "Claude", codex: "ChatGPT", opencode: "OpenCode" };
const modelName = id => (meta.models.find(m => m.id === id)?.label || id).replace(/^[^·]+·\s*/, "");
const providerOf = id => meta.models.find(m => m.id === id)?.provider || "claude";
const firstModel = provider => meta.models.find(m => m.provider === provider)?.id;
function providerOptions(selected) {
  return [...new Set(meta.models.map(m => m.provider))].map(p => `<option value="${esc(p)}" ${p === selected ? "selected" : ""}>${esc(PROVIDER_LABELS[p] || p)}</option>`).join("");
}
function modelItems(selected, query = "") {
  const words = query.toLowerCase().split(/\s+/).filter(Boolean), provider = providerOf(selected);
  const list = meta.models.filter(m => m.provider === provider && words.every(w => `${m.label} ${m.note} ${m.id}`.toLowerCase().includes(w)));
  return list.map(m => `<button class="mi ${m.id === selected ? "on" : ""}" data-model="${esc(m.id)}"><span><b>${esc(m.label.replace(/^[^·]+·\s*/, ""))}</b><small>${esc(m.note)}</small></span>${tickSvg}</button>`).join("")
    || `<p class="muted" style="padding:9px 10px;margin:0">No models match.</p>`;
}
function modelMenu(menu, selected) {
  menu.innerHTML = `<input class="model-search" type="search" placeholder="Search models…" aria-label="Search models" autocomplete="off"><div class="model-list">${modelItems(selected)}</div>`;
  const input = menu.querySelector(".model-search");
  input.onclick = e => e.stopPropagation();
  input.oninput = () => menu.querySelector(".model-list").innerHTML = modelItems(selected, input.value);
  input.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); menu.querySelector("[data-model]")?.click(); } };
}
const openModelMenu = menu => {
  const input = menu.querySelector(".model-search");
  if (!menu.classList.contains("open") || !input) return;
  input.value = ""; input.oninput(); input.focus();
  menu.style.left = "";
  const overflow = menu.getBoundingClientRect().right - (innerWidth - 8);
  if (overflow > 0) menu.style.left = `${-overflow}px`;
};

const effortLabel = value => ({ default: 'Default', none: 'None', minimal: 'Minimal', low: 'Low', medium: 'Medium', high: 'High', xhigh: 'Extra high', max: 'Max', ultra: 'Ultra' }[value] || value);
function effortOptions(model, selected = 'default') {
  const config = meta.models.find(m => m.id === model);
  const levels = ['default', ...(config?.efforts || [])];
  if (!levels.includes(selected)) selected = 'default';
  return levels.map(value => `<option value="${esc(value)}" ${value === selected ? 'selected' : ''}>${value === 'default' && config?.defaultEffort ? `Default (${effortLabel(config.defaultEffort)})` : effortLabel(value)}</option>`).join('');
}
function bindFormEffort(form, model) {
  const picker = form.querySelector('[name=model]'), effort = form.querySelector('[name=effort]');
  if (meta.models.some(m => m.id === model)) picker.value = model;
  const refresh = () => {
    effort.innerHTML = effortOptions(picker.value, localStorage.getItem('se-effort:' + picker.value) || 'default');
    effort.disabled = !(meta.models.find(m => m.id === picker.value)?.efforts?.length);
  };
  picker.onchange = refresh; refresh();
}

function pickerLabels() {
  const s = styles.find((x) => x.name === draft.style);
  const c = s?.colors || {};
  $("#styleBtn").innerHTML = `<span class="lbl">Style</span>` + (s ? `<span class="sw" style="background:${esc(c.primary || s.background)}"></span><b>${esc(s.name)}</b>` : `<b>No style</b>`) + chev;
  $("#modelBtn").innerHTML = `<span class="lbl">Model</span><b>${esc(modelName(draft.model))}</b>${chev}`;
  $("#styleMenu").innerHTML = styleMenu();
  modelMenu($("#modelMenu"), draft.model);
  $("#providerSelect").innerHTML = providerOptions(providerOf(draft.model));
  if ($("#effortSelect")) {
    const model = meta.models.find(m => m.id === draft.model);
    if (draft.effort !== 'default' && !model?.efforts?.includes(draft.effort)) draft.effort = 'default';
    $("#effortSelect").innerHTML = effortOptions(draft.model, draft.effort);
    $("#effortSelect").disabled = !model?.efforts?.length;
  }
}

let helpTipId = 0;
function helpTip(text) {
  const id = `help-tip-${++helpTipId}`;
  return `<span class="help-tip"><button type="button" class="help-icon" aria-label="Help: ${esc(text)}" aria-describedby="${id}">?</button><span class="help-content" role="tooltip" id="${id}">${esc(text)}</span></span>`;
}

async function viewNew() {
  styles = await api("/api/styles");
  if (draft.style && !styles.some((s) => s.name === draft.style && !isBusy(s) && !isFailed(s))) draft.style = "";
  $("#view").innerHTML = `
    <div class="hero">
      <span class="eyebrow">Your footage. Your direction.</span>
      <h2>${MARK}<span>Frame <em>Pilot</em></span></h2>
      <p class="sub">Start with your footage. Tell us what you want to make.</p>
      <div class="composer-wrap">
        <div class="composer" id="composer">
          <input type="file" accept="video/*" hidden id="file">
          <div id="attachArea"></div>
          <div class="composer-row direction-row">
            <textarea id="direction" aria-label="Editing brief" rows="1" placeholder="Describe your video and how you want it edited…">${esc(draft.direction)}</textarea>
          </div>
          <button class="btn advanced-toggle" id="advancedBtn" aria-expanded="${draft.advanced}" aria-controls="advancedPanel">${draft.advanced ? '−' : '+'} Advanced options</button>
          <section id="advancedPanel" class="advanced-panel" ${draft.advanced ? '' : 'hidden'}>
            <div class="reference-grid">
              <section class="reference-upload" data-upload-target="inspirationFile"><h3>Inspiration ${helpTip('Upload a video to guide pacing, mood and visual style. It is not used as source footage.')}</h3><label class="upload-label reference-dropzone" tabindex="0" role="button" aria-label="Upload inspiration video"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><span class="drop-caption">Drop a video</span><small>or browse</small><input type="file" id="inspirationFile" accept="video/*" hidden></label><div id="inspirationList"></div></section>
              <section class="reference-upload" data-upload-target="referenceFiles"><h3>References ${helpTip('Add images and videos the editor can use as visual references or assets in this edit.')}</h3><label class="upload-label reference-dropzone" tabindex="0" role="button" aria-label="Upload reference images or videos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></svg><span class="drop-caption">Drop images or videos</span><small>or browse</small><input type="file" id="referenceFiles" accept="image/png,image/jpeg,image/webp,image/gif,video/*" multiple hidden></label><div id="referenceList"></div></section>
            </div>
            <section class="feature-section"><div class="feature-toggles">${Object.entries({roughCut:['Rough cut','Automatically remove silences, fillers and retakes. Turn off to preserve the original timing; explicit transcript cuts still apply.'],subtitles:['Subtitles','Add captions timed to the speech, using the selected style or your brief.'],motionGraphics:['Motion graphics','Add animated graphics, callouts, transitions and camera moves where appropriate.'],sfx:['SFX','Add sound effects to support graphics and transitions.'],music:['Music','Add background music and lower its volume under speech.']}).map(([key,[label,help]]) => `<div class="feature-option"><label class="feature-toggle"><span>${label}</span><span class="switch-control"><input type="checkbox" role="switch" data-feature="${key}" ${draft.features[key] ? 'checked' : ''}><span class="switch-track" aria-hidden="true"></span></span></label>${helpTip(help)}</div>`).join('')}</div></section>
            <section class="feature-section preview-option"><div class="feature-option"><label class="feature-toggle"><span>Preview before building</span><span class="switch-control"><input type="checkbox" role="switch" id="previewToggle" ${draft.preview ? 'checked' : ''}><span class="switch-track" aria-hidden="true"></span></span></label>${helpTip('Plan the edit and show a still of every beat with its motion graphic first. Pick the ideas you like, then build the video. Needs Motion graphics on.')}</div>
              <label class="effort-picker" id="ideasPicker" ${draft.preview ? '' : 'hidden'}><span class="lbl">Ideas per beat</span><select id="ideasSelect" aria-label="Ideas per beat">${[1,2,3].map(n => `<option value="${n}" ${draft.ideas === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label></section>
            <section class="transcript-section"><div class="transcript-heading"><h3>Edit by transcript ${helpTip('Transcribe your source video with your configured Deepgram key. Drag across words, or click then Shift-click to select a passage. Add instructions for what should happen there; they are applied when you start the edit.')}</h3><button class="btn small" id="transcribeBtn" title="Upload a source video first">Transcribe video</button></div><p id="transcriptStatus" role="status" class="muted" hidden></p><div id="transcriptEditor"></div></section>
          </section>
          <div class="composer-row" style="justify-content:flex-end"><span class="muted" id="goHint" style="font-size:13px;margin-right:auto"></span>
            <button class="send" id="goBtn" style="margin-left:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 8-4 8M14 4l4 8-4 8"/></svg><span id="goLabel">Edit</span></button>
          </div>
        </div>
        <div class="pickers">
          <label class="effort-picker"><span class="lbl">Editor</span><select id="editorSelect" aria-label="Editing app">${[{id:'native',label:'Native'},{id:'capcut',label:'CapCut'},{id:'palmier',label:'Palmier Pro'},{id:'davinci',label:'DaVinci Resolve'}].map(editor=>`<option value="${editor.id}" ${draft.editor === editor.id ? 'selected' : ''}>${editor.label}</option>`).join('')}</select></label>
          <button class="btn small" id="connectEditorBtn" hidden>Connect editor</button>
          <fieldset class="format-picker" aria-label="Aspect ratio"><legend class="sr-only">Aspect ratio</legend>
            <label><input type="radio" name="aspect" value="9:16" ${draft.aspectRatio === '9:16' ? 'checked' : ''}>9:16 <small>Portrait</small></label>
            <label><input type="radio" name="aspect" value="16:9" ${draft.aspectRatio === '16:9' ? 'checked' : ''}>16:9 <small>Landscape</small></label>
          </fieldset>
          <div class="dd"><button class="ddbtn" id="styleBtn"></button><div class="menu" id="styleMenu"></div></div>
          <label class="effort-picker"><span class="lbl">Provider</span><select id="providerSelect" aria-label="AI provider"></select></label>
          <div class="dd"><button class="ddbtn" id="modelBtn"></button><div class="menu" id="modelMenu"></div></div>
          <label class="effort-picker"><span class="lbl">Effort</span><select id="effortSelect" aria-label="Reasoning effort" title="How much reasoning the model uses. Higher levels can take longer."></select></label>
        </div>

      </div>
    </div>`;
  pickerLabels();
  renderUpload();
  bindNew();
  bindAdvanced();
  renderReferences();
  renderTranscript();
  updateGo();
}

function renderUpload() {
  const el = $("#attachArea");
  if (!el) return;
  const u = draft.upload;
  if (!u) {
    el.innerHTML = `<label class="vdrop" for="file" tabindex="0" role="button">
      <span class="vdrop-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></span>
      <b>Upload your video</b></label>`;
    el.querySelector('.vdrop').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $("#file").click(); } };
    return;
  }
  el.innerHTML = `<div class="vfile">${u.preview ? `<video src="${u.preview}" muted playsinline></video>` : `<span class="thumb"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>`}
    <span class="vmeta"><b>${esc(u.name)}</b>${u.progress != null ? `<div class="bar"><i style="width:${u.progress * 100}%"></i></div><small>Uploading…</small>` : `<small>Raw video ready to edit</small>`}</span>
    <label class="btn small" for="file">Replace</label><button class="x" id="removeVid" title="Remove">×</button></div>`;
  $("#removeVid").onclick = () => { draft.upload = null; clearTranscript(); renderUpload(); updateGo(); };
}

function uploadFile(file, onProgress, kind = "media") {
  return new Promise((ok, bad) => {
    const x = new XMLHttpRequest();
    x.open("POST", `/api/upload?name=${encodeURIComponent(file.name)}&kind=${encodeURIComponent(kind)}`);
    x.upload.onprogress = (e) => onProgress?.(e.loaded / e.total);
    x.onload = () => { const d = JSON.parse(x.responseText); x.status === 200 ? ok(d) : bad(new Error(d.error)); };
    x.onerror = () => bad(new Error("Upload failed"));
    x.send(file);
  });
}

async function upload(file) {
  if (!/\.(mp4|mov|m4v|webm)$/i.test(file.name)) return toast("Choose an MP4, MOV, M4V or WebM video.");
  clearTranscript();
  if (draft.upload?.preview) URL.revokeObjectURL(draft.upload.preview);
  const preview = URL.createObjectURL(file);
  draft.upload = { name: file.name, preview, progress: 0 };
  const pending = draft.upload;
  renderUpload(); updateGo();
  try {
    const d = await uploadFile(file, (p) => { if (draft.upload === pending) { draft.upload.progress = p; const i = $("#attachArea .bar i"); if (i) i.style.width = `${p * 100}%`; } });
    if (draft.upload !== pending) return URL.revokeObjectURL(preview);
    draft.upload = { ...d, preview };
  } catch (e) { if (draft.upload !== pending) return; toast(e.message); draft.upload = null; }
  renderUpload(); updateGo();
}

function bindNew() {
  const comp = $("#composer"), input = $("#file"), ta = $("#direction");
  input.onchange = () => { input.files[0] && upload(input.files[0]); input.value = ""; };
  comp.ondragover = (e) => { e.preventDefault(); comp.classList.add("over"); };
  comp.ondragleave = () => comp.classList.remove("over");
  comp.ondrop = (e) => { e.preventDefault(); comp.classList.remove("over"); e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]); };
  ta.oninput = () => { draft.direction = ta.value; ta.style.height = "auto"; ta.style.height = `${ta.scrollHeight}px`; };
  ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !$("#goBtn").disabled) { e.preventDefault(); $("#goBtn").click(); } };
  const toggle = (btn, menu) => (e) => { e.stopPropagation(); const open = !menu.classList.contains("open"); document.querySelectorAll(".menu").forEach((m) => m.classList.remove("open")); menu.classList.toggle("open", open); };
  $("#styleBtn").onclick = toggle($("#styleBtn"), $("#styleMenu"));
  $("#modelBtn").onclick = (e) => { toggle($("#modelBtn"), $("#modelMenu"))(e); openModelMenu($("#modelMenu")); };
  $("#providerSelect").onchange = e => {
    draft.model = firstModel(e.target.value); localStorage.setItem("se-model", draft.model);
    draft.effort = localStorage.getItem("se-effort:" + draft.model) || "default";
    pickerLabels();
  };
  document.onclick = () => document.querySelectorAll(".menu").forEach((m) => m.classList.remove("open"));
  $("#styleMenu").onclick = (e) => {
    e.stopPropagation();
    const ed = e.target.closest("[data-editstyle]");
    if (ed) { location.hash = `#/style/${ed.dataset.editstyle}`; return; }
    if (e.target.closest("[data-newstyle]")) { $("#styleMenu").classList.remove("open"); return openNewStyle(); }
    const it = e.target.closest("[data-style]");
    if (!it) return;
    if (!it.dataset.style) {
      draft.style = ""; localStorage.setItem("se-style", "");
      $("#styleMenu").classList.remove("open"); pickerLabels(); updateGo(); return;
    }
    const s = styles.find((x) => x.name === it.dataset.style);
    $("#styleMenu").classList.remove("open");
    if (isBusy(s) || isFailed(s)) return openStyleRun(s);
    draft.style = s.name; localStorage.setItem("se-style", s.name);
    pickerLabels(); updateGo();
  };
  $("#modelMenu").onclick = (e) => {
    e.stopPropagation();
    const it = e.target.closest("[data-model]");
    if (!it) return;
    draft.model = it.dataset.model; localStorage.setItem("se-model", draft.model);
    draft.effort = localStorage.getItem("se-effort:" + draft.model) || "default";
    $("#modelMenu").classList.remove("open");
    pickerLabels();
  };
  $("#editorSelect").onchange = e => { draft.editor = e.target.value; localStorage.setItem('se-editor',draft.editor); updateGo(); };
  $("#connectEditorBtn").onclick = openSetup;
  $("#effortSelect").onchange = e => {
    draft.effort = e.target.value; localStorage.setItem('se-effort:' + draft.model, draft.effort);
  };
  $("#goBtn").onclick = async () => {
    $("#goBtn").disabled = true;
    try {
      const { id } = await api("/api/jobs", { method: "POST", body: { source: draft.upload.path, name: draft.upload.name, editor: draft.editor, style: draft.style, model: draft.model, effort: draft.effort, direction: draft.direction, aspectRatio: draft.aspectRatio, features: draft.features, inspiration: draft.inspiration?.path, references: draft.references.map(r => r.path), transcriptionId: draft.transcriptionId, transcriptEdits: draft.transcriptEdits, previewIdeas: previewAvailable() && draft.preview ? draft.ideas : 0 } });
      if (draft.upload?.preview) URL.revokeObjectURL(draft.upload.preview);
      draft.upload = null; draft.direction = ""; draft.inspiration = null; draft.references = []; clearTranscript();
      location.hash = `#/job/${id}`;
    } catch (e) { toast(e.message); updateGo(); }
  };
}

const previewAvailable = () => draft.features.motionGraphics;

function updateGo() {
  const btn = $("#goBtn");
  if (!btn) return;
  if ($("#previewToggle")) $("#previewToggle").disabled = !previewAvailable();
  $("#goLabel").textContent = previewAvailable() && draft.preview ? 'Create preview' : 'Edit';
  const pendingInstruction = $("#transcriptInstruction")?.value.trim();
  const editor = meta.editors?.find(editor => editor.id === draft.editor);
  const editorReady = draft.editor === 'native' || editor?.ready;
  if ($("#connectEditorBtn")) $("#connectEditorBtn").hidden = !!editorReady;
  const ready = editorReady && draft.upload?.path && !draft.transcribing && !draft.attachmentsBusy && !pendingInstruction;
  btn.disabled = !ready;
  if ($("#transcribeBtn")) $("#transcribeBtn").disabled = !draft.upload?.path || draft.transcribing;
  $("#goHint").textContent = !editorReady ? `Connect ${editor?.label || draft.editor} in Setup` : pendingInstruction ? "Add or clear your transcript instruction first" : draft.attachmentsBusy ? "Uploading references…" : draft.transcribing ? "Transcribing…" : draft.upload && !draft.upload.path ? "Uploading…" : "";
}

let transcriptPoll = null, transcriptEpoch = 0;
function clearTranscript() {
  clearTimeout(transcriptPoll); transcriptEpoch++;
  draft.transcript = null; draft.transcriptionId = null; draft.transcriptEdits = []; draft.selection = null; draft.transcribing = false;
  renderTranscript();
}
function renderReferences() {
  if (!$("#referenceList")) return;
  const item = (r, i, kind) => `<div class="reference-item"><span>${esc(r.name)}</span><button class="btn small" data-remove-ref="${i}" data-kind="${kind}" aria-label="Remove ${esc(r.name)}">×</button></div>`;
  $("#inspirationList").innerHTML = draft.inspiration ? item(draft.inspiration, 0, 'inspiration') : '';
  $("#referenceList").innerHTML = draft.references.map((r,i) => item(r,i,'reference')).join('');
  document.querySelectorAll('[data-remove-ref]').forEach(b => b.onclick = () => {
    if (b.dataset.kind === 'inspiration') draft.inspiration = null;
    else draft.references.splice(Number(b.dataset.removeRef), 1);
    renderReferences();
  });
}
function bindAdvanced() {
  $("#advancedBtn").onclick = () => {
    draft.advanced = !draft.advanced;
    $("#advancedPanel").hidden = !draft.advanced;
    $("#advancedBtn").setAttribute('aria-expanded', String(draft.advanced));
    $("#advancedBtn").textContent = `${draft.advanced ? '−' : '+'} Advanced options`;
  };
  document.querySelectorAll('[name=aspect]').forEach(r => r.onchange = () => {
    draft.aspectRatio = r.value;
    const n = draft.transcriptEdits.length;
    draft.transcriptEdits = draft.transcriptEdits.filter(e => !e.aspect || e.aspect === r.value);
    if (draft.pendingTemplate?.aspect !== r.value) draft.pendingTemplate = null;
    if (draft.transcriptEdits.length < n) { toast(`Removed ${n - draft.transcriptEdits.length} template instruction${n - draft.transcriptEdits.length > 1 ? "s" : ""} made for the other format`); renderTranscript(); }
  });
  document.querySelectorAll('[data-feature]').forEach(r => r.onchange = () => { draft.features[r.dataset.feature] = r.checked; updateGo(); });
  $("#previewToggle").onchange = e => { draft.preview = e.target.checked; $("#ideasPicker").hidden = !draft.preview; updateGo(); };
  $("#ideasSelect").onchange = e => { draft.ideas = Number(e.target.value); };
  const addFiles = async (input, inspiration, selectedFiles = input.files) => {
    if (draft.attachmentsBusy) return;
    const files = Array.from(selectedFiles);
    if (!files.length) return;
    if (inspiration && files.length > 1) { input.value = ''; return toast('Drop one inspiration video.'); }
    if (files.some(file => !(inspiration ? /\.(mp4|mov|m4v|webm)$/i : /\.(mp4|mov|m4v|webm|png|jpe?g|webp|gif)$/i).test(file.name))) {
      input.value = ''; return toast(inspiration ? 'Choose an MP4, MOV, M4V or WebM video.' : 'Choose videos or PNG, JPG, WebP or GIF images.');
    }
    draft.attachmentsBusy = true; updateGo();
    document.querySelectorAll('.reference-dropzone').forEach(zone => zone.setAttribute('aria-disabled', 'true'));
    const caption = input.closest('.reference-dropzone').querySelector('.drop-caption');
    const previousCaption = caption.textContent; caption.textContent = 'Uploading…';
    $("#inspirationFile").disabled = $("#referenceFiles").disabled = true;
    try {
      for (const file of files) {
        if (inspiration && !/\.(mp4|mov|m4v|webm)$/i.test(file.name)) throw new Error('Choose a video for inspiration.');
        const result = await uploadFile(file);
        if (inspiration) draft.inspiration = result;
        else draft.references.push(result);
        renderReferences();
      }
    } catch (error) { toast(error.message); }
    finally {
      input.value = ''; draft.attachmentsBusy = false;
      caption.textContent = previousCaption;
      document.querySelectorAll('.reference-dropzone').forEach(zone => zone.removeAttribute('aria-disabled'));
      if ($("#inspirationFile")) $("#inspirationFile").disabled = $("#referenceFiles").disabled = false;
      updateGo();
    }
  };
  document.querySelectorAll('[data-upload-target]').forEach(section => {
    const input = document.getElementById(section.dataset.uploadTarget);
    const zone = section.querySelector('.reference-dropzone');
    section.ondragenter = section.ondragover = e => {
      e.preventDefault(); e.stopPropagation();
      $("#composer").classList.remove('over');
      if (!draft.attachmentsBusy) zone.classList.add('over');
      if (e.dataTransfer) e.dataTransfer.dropEffect = draft.attachmentsBusy ? 'none' : 'copy';
    };
    section.ondragleave = e => {
      e.stopPropagation();
      if (!section.contains(e.relatedTarget)) zone.classList.remove('over');
    };
    section.ondrop = e => {
      e.preventDefault(); e.stopPropagation(); zone.classList.remove('over');
      $("#composer").classList.remove('over');
      addFiles(input, input.id === 'inspirationFile', e.dataTransfer.files);
    };
  });
  document.querySelectorAll('.upload-label').forEach(label => label.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); label.querySelector('input').click(); } });
  $("#inspirationFile").onchange = e => addFiles(e.target, true);
  $("#referenceFiles").onchange = e => addFiles(e.target, false);
  $("#transcribeBtn").onclick = async () => {
    if (!draft.upload?.path || draft.transcribing) return;
    clearTranscript();
    const epoch = transcriptEpoch, source = draft.upload.path;
    draft.transcribing = true; renderTranscript(); updateGo();
    try {
      const { id } = await api('/api/transcriptions', { method: 'POST', body: { source } });
      if (epoch !== transcriptEpoch) return;
      const poll = async () => {
        if (epoch !== transcriptEpoch) return;
        try {
          const result = await api(`/api/transcriptions/${id}`);
          if (epoch !== transcriptEpoch) return;
          if (result.status === 'error') throw new Error(result.error);
          if (result.status !== 'done') { transcriptPoll = setTimeout(poll, 1500); return; }
          draft.transcript = result.transcript; draft.transcriptionId = id; draft.transcribing = false;
          renderTranscript(); updateGo();
        } catch (error) {
          if (epoch !== transcriptEpoch) return;
          draft.transcribing = false; renderTranscript(error.message); updateGo();
        }
      };
      poll();
    } catch (error) {
      if (epoch !== transcriptEpoch) return;
      draft.transcribing = false; renderTranscript(error.message); updateGo();
    }
  };
}
function renderTranscript(error = '') {
  if (!$("#transcriptEditor")) return;
  $("#transcriptStatus").textContent = error || (draft.transcribing ? 'Transcribing…' : '');
  $("#transcriptStatus").hidden = !error && !draft.transcribing;
  const words = draft.transcript?.words;
  $("#transcribeBtn").textContent = draft.transcribing ? 'Transcribing…' : draft.transcript ? 'Transcribe again' : 'Transcribe video';
  $("#transcribeBtn").disabled = !draft.upload?.path || draft.transcribing;
  if (!words) { $("#transcriptEditor").innerHTML = ''; return; }
  $("#transcriptEditor").innerHTML = `<div class="transcript-words" id="transcriptWords" tabindex="0" aria-label="Source transcript">${words.map((w,i) => `<span class="transcript-word" data-word="${i}" title="${w.start.toFixed(2)}s – ${w.end.toFixed(2)}s">${esc(w.word)}</span>`).join(' ')}</div>
    <div class="transcript-note"><p id="selectionLabel">Select a passage above.</p><textarea id="transcriptInstruction" aria-label="Instruction for selected passage" placeholder="What should happen here? With a template, what it should say (optional)."></textarea><div class="transcript-actions"><button class="btn small" id="pickTranscriptTemplate">Use a template</button><span id="templateChip"></span><button class="btn small primary" id="addTranscriptEdit" disabled>Add instruction</button></div></div>
    <div id="transcriptEdits"></div>`;
  const select = (from, to) => {
    draft.selection = { from: Math.min(from,to), to: Math.max(from,to) };
    document.querySelectorAll('[data-word]').forEach(el => el.classList.toggle('selected', Number(el.dataset.word) >= draft.selection.from && Number(el.dataset.word) <= draft.selection.to));
    $("#selectionLabel").textContent = `${words[draft.selection.from].start.toFixed(2)}s – ${words[draft.selection.to].end.toFixed(2)}s · “${words.slice(draft.selection.from,draft.selection.to+1).map(w=>w.word).join(' ')}”`;
    canAdd();
  };
  const box = $("#transcriptWords");
  let anchor = null;
  box.onpointerdown = e => { const word = e.target.closest('[data-word]'); if (word) anchor = e.shiftKey && draft.selection ? draft.selection.from : Number(word.dataset.word); };
  box.onpointerup = e => {
    const selection = window.getSelection();
    const wordNode = node => (node?.nodeType === 1 ? node : node?.parentElement)?.closest('[data-word]');
    const a = wordNode(selection?.anchorNode), b = wordNode(selection?.focusNode);
    if (selection && !selection.isCollapsed && a && b && box.contains(a) && box.contains(b)) select(Number(a.dataset.word), Number(b.dataset.word));
    else { const word = e.target.closest('[data-word]'); if (word) select(anchor ?? Number(word.dataset.word), Number(word.dataset.word)); }
  };
  box.onkeyup = () => {
    const selected = window.getSelection();
    const a = selected?.anchorNode?.parentElement?.closest('[data-word]'), b = selected?.focusNode?.parentElement?.closest('[data-word]');
    if (a && b && box.contains(a) && box.contains(b)) select(Number(a.dataset.word), Number(b.dataset.word));
  };
  const canAdd = () => { $("#addTranscriptEdit").disabled = !draft.selection || !($("#transcriptInstruction").value.trim() || draft.pendingTemplate); };
  const showChip = () => {
    $("#templateChip").innerHTML = draft.pendingTemplate ? `<span class="tpl-chip">${esc(draft.pendingTemplate.name.replace(/^MG: /, ""))}<button class="x" id="clearTemplate" aria-label="Remove template">×</button></span>` : "";
    if ($("#clearTemplate")) $("#clearTemplate").onclick = () => { draft.pendingTemplate = null; showChip(); };
    $("#pickTranscriptTemplate").textContent = draft.pendingTemplate ? "Change template" : "Use a template";
    canAdd(); updateGo();
  };
  $("#pickTranscriptTemplate").onclick = async () => { const t = await pickTemplate(draft.aspectRatio); if (t) { draft.pendingTemplate = t; showChip(); } };
  $("#transcriptInstruction").oninput = () => { canAdd(); updateGo(); };
  const renderEdits = () => {
    $("#transcriptEdits").innerHTML = draft.transcriptEdits.map((edit,i) => `<div class="transcript-edit"><blockquote>${esc(words.slice(edit.from, edit.to+1).map(w=>w.word).join(' '))}</blockquote>${edit.template ? `<span class="tpl-chip" style="padding-right:10px">Template: ${esc(edit.templateName || edit.template)}</span> ` : ''}<span>${esc(edit.instruction)}</span> <button class="btn small" data-delete-edit="${i}" aria-label="Remove instruction">Remove</button></div>`).join('');
    document.querySelectorAll('[data-delete-edit]').forEach(b => b.onclick = () => { draft.transcriptEdits.splice(Number(b.dataset.deleteEdit),1); renderEdits(); });
  };
  $("#addTranscriptEdit").onclick = () => {
    const t = draft.pendingTemplate;
    if (!draft.selection || !($("#transcriptInstruction").value.trim() || t)) return;
    draft.transcriptEdits.push({ ...draft.selection, instruction: $("#transcriptInstruction").value.trim(), ...(t ? { template: t.id, templateName: t.name.replace(/^MG: /, ""), aspect: t.aspect } : {}) });
    $("#transcriptInstruction").value = ''; draft.pendingTemplate = null; showChip(); renderEdits(); updateGo();
  };
  renderEdits();
  showChip();
  if (draft.selection) select(draft.selection.from, draft.selection.to);
}

    <div class="style-model-row"><label>Model<select name="model">${meta.models.map(model => `<option value="${esc(model.id)}">${esc(model.label)}</option>`).join('')}</select></label><label>Effort<select name="effort" aria-label="Reasoning effort"></select></label></div>
    <p id="styleBuilderError" class="style-builder-error" role="alert" hidden></p><div class="actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" id="nsGo" value="ok">Build style guide</button></div></form>`;
  const form = $("#nsForm");
  bindFormEffort(form,state.model);
  if ([...form.elements.effort.options].some(option => option.value === state.effort)) form.elements.effort.value = state.effort;
  form.addEventListener('input', e => { if (['name','links','notes'].includes(e.target.name)) state[e.target.name] = e.target.value; });
  form.addEventListener('change', e => { if (['base','model','effort'].includes(e.target.name)) { state[e.target.name] = e.target.value; if (e.target.name === 'model') state.effort = form.elements.effort.value; } });
  $("#styleMethodBack").onclick = () => { if (interview) state.review = false; else state.mode = ''; renderStyleBuilder(); };
  if (!interview) {
    const input = $("#styleSourceFiles"), drop = $("#styleSourceDrop");
    const add = selected => {
      const list = Array.from(selected), pattern = documentMode ? /\.(pdf|docx|txt|md)$/i : /\.(mp4|mov|m4v|webm|png|jpe?g|webp|gif)$/i;
      if (list.some(file => !pattern.test(file.name))) return toast(documentMode ? 'Choose PDF, DOCX, TXT or Markdown files.' : 'Choose videos or images.');
      for (const file of list) if (!state.files.some(item => item.mode === state.mode && item.file.name === file.name && item.file.size === file.size && item.file.lastModified === file.lastModified)) state.files.push({id:crypto.randomUUID(),mode:state.mode,file});
      renderStyleBuilder();
    };
    input.onchange = () => add(input.files);
    drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = e => { if (!drop.contains(e.relatedTarget)) drop.classList.remove('over'); };
    drop.ondrop = e => { e.preventDefault(); e.stopPropagation(); drop.classList.remove('over'); add(e.dataTransfer.files); };
    d.querySelectorAll('[data-remove-style-file]').forEach(button => button.onclick = () => { state.files = state.files.filter(item => item.id !== button.dataset.removeStyleFile); renderStyleBuilder(); });
  }
  form.onsubmit = async e => {
    if (e.submitter?.value !== 'ok') return;
    e.preventDefault();
    const errorBox = $("#styleBuilderError"), showError = message => { errorBox.hidden = false; errorBox.textContent = message; };
    const links = state.mode === 'references' ? state.links.split(/\s+/).filter(Boolean) : [];
    if (documentMode && !files.length) return showError('Upload a document first.');
    if (!interview && !documentMode && !files.length && !links.length && !state.base) return showError('Add a reference video, image or link.');
    if (interview && !questions.some(q => state.answers[q.key]?.trim())) return showError('Answer at least one question so we can shape your style.');
    errorBox.hidden = true;
    state.model = form.elements.model.value; state.effort = form.elements.effort.value;
    const controls = [...form.querySelectorAll('button,input,textarea,select')];
    const disabled = controls.map(control => control.disabled); controls.forEach(control => { control.disabled = true; });
    $("#nsGo").textContent = files.length ? 'Uploading…' : 'Creating…';
    try {
      const paths = [];
      for (const item of files) {
        if (!item.uploaded) item.uploaded = await uploadFile(item.file, null, documentMode ? 'style-document' : 'media');
        if (!d.open) return;
        paths.push(item.uploaded.path);
      }
      $("#nsGo").textContent = documentMode ? 'Reading document…' : 'Creating…';
      await api('/api/styles',{method:'POST',body:{method:state.mode,name:state.name,files:paths,links,base:state.base,notes:state.notes,answers:state.mode === 'interview' ? state.answers : undefined,model:state.model,effort:state.effort}});
      d.close(); toast('Creating your style guide…'); refreshSide();
      if (!location.hash || location.hash === '#/new') viewNew();
    } catch(error) {
      if (!d.open) return;
      showError(error.message);
      controls.forEach((control,i) => { control.disabled = disabled[i]; });
      $("#nsGo").textContent = 'Build style guide';
    }
  };
}

// The dialog has its own watcher: page/sidebar refreshes do not update modal contents.
function createStyleRunWatcher({ fetchRun, render, onError, isOpen, schedule = setTimeout, cancel = clearTimeout }) {
  let version = 0, timeout = null;
  function stop() { version++; cancel(timeout); timeout = null; }
  function watch(name) {
    stop();
    const token = version;
    async function poll() {
      if (token !== version || !isOpen()) return;
      let active = true;
      try {
        const style = await fetchRun(name);
        if (token !== version || !isOpen()) return;
        if (!style?.run) throw new Error("Style run no longer exists.");
        render(style);
        active = /^(queued|running)$/.test(style.run.status);
      } catch (error) {
        if (token !== version || !isOpen()) return;
        onError(error);
      }
      if (active) timeout = schedule(poll, 1500);
    }
    poll();
  }
  return { watch, stop };
}
const styleRunWatcher = createStyleRunWatcher({
  fetchRun: async name => (await api("/api/styles")).find(style => style.name === name),
  render: style => {
    const signature = JSON.stringify(style.run);
    if ($("#styleRunState")?.dataset.signature !== signature || $("#styleRunConnection")?.textContent) renderStyleRun(style);
  },
  isOpen: () => $("#styleDlg").open && !!$("#styleRunState"),
  onError: error => {
    if ($("#styleRunHeading")) $("#styleRunHeading").textContent = "Style status unavailable";
    if ($("#styleRunConnection")) $("#styleRunConnection").textContent = `${error.message} Retrying…`;
  },
});
$("#styleDlg").addEventListener("close", () => styleRunWatcher.stop());

function openStyleRun(s) {
  renderStyleRun(s);
  styleRunWatcher.watch(s.name);
}

function renderStyleRun(s) {
  const d = $("#styleDlg");
  const r = s.run || {};
  d.innerHTML = `<div class="body" id="styleRunState"><h3 id="styleRunHeading">${esc(s.name)}: ${r.kind === "refine" ? "refining" : "building"} (${esc(r.status)})</h3>
    <p id="styleRunConnection" role="status" class="muted"></p>
    <div class="log">${(r.log || []).slice(-40).map((l) => `<div class="${l.t}">${esc(l.text)}</div>`).join("") || `<span class="muted">${r.status === 'queued' ? 'Waiting in queue…' : r.status === 'running' ? 'Waiting for progress…' : 'No progress messages were recorded.'}</span>`}</div>
    ${r.summary ? `<div class="summary ${r.status === "error" ? "err" : ""}">${esc(r.summary)}</div>` : ""}
    ${r.warning ? `<p class="muted">${esc(r.warning)}</p>` : ""}
    ${r.status === "error" ? `<label>Continue with model<select id="continueStyleModel">${meta.models.map(m => `<option value="${esc(m.id)}" ${m.id === r.model ? "selected" : ""}>${esc(m.label)}</option>`).join("")}</select></label><label>Effort<select id="continueStyleEffort">${effortOptions(r.model, r.effort || "default")}</select></label>
    <p class="muted">Reuse the analysis and files already saved. Choose another provider if you have reached a usage limit.</p><p id="continueStyleError" role="alert" class="err"></p>` : ""}
    <div class="actions"><button class="btn" onclick="this.closest('dialog').close()">Close</button>${r.status === "error" ? '<button class="btn primary" id="continueStyle">Continue</button>' : ""}</div></div>`;
  $("#styleRunState").dataset.signature = JSON.stringify(r);
  if (!d.open) d.showModal();
  if ($("#continueStyleModel")) $("#continueStyleModel").onchange = e => {
    $("#continueStyleEffort").innerHTML = effortOptions(e.target.value, localStorage.getItem('se-effort:' + e.target.value) || 'default');
  };
  if ($("#continueStyle")) $("#continueStyle").onclick = async () => {
    const button = $("#continueStyle"); button.disabled = true; button.textContent = "Continuing…";
    try {
      await api(`/api/styles/${encodeURIComponent(s.name)}/continue`, { method: "POST", body: { model: $("#continueStyleModel").value, effort: $("#continueStyleEffort").value } });
      const latest = (await api("/api/styles")).find(style => style.name === s.name);
      openStyleRun(latest || { ...s, run: { ...r, status: "queued", log: [], summary: "" } });
      refreshSide();
    } catch (error) {
      $("#continueStyleError").textContent = error.message;
      button.disabled = false; button.textContent = "Continue";
    }
  };
}

let selectedVersion = null;
function updatePreviewWorking(working, label = '', detail = '', progress = null) {
  const overlay = $("#previewWorking"), frame = $("#previewFrame");
  if (!overlay || !frame) return;
  frame.classList.toggle('is-reworking', working);
  frame.setAttribute('aria-busy', String(working));
  overlay.hidden = !working;
  if (working) {
    $("#player")?.pause();
    if ($("#previewWorkingTitle").textContent !== label) $("#previewWorkingTitle").textContent = label;
    if ($("#previewWorkingDetail").textContent !== detail) $("#previewWorkingDetail").textContent = detail;
    const bar = $("#previewWorkingProgress");
    bar.hidden = progress === null;
    if (progress !== null) {
      bar.setAttribute('aria-valuenow', String(progress));
      bar.querySelector('i').style.width = `${progress}%`;
    }
  }
}


function copyText(j) {
  return `Use the reel-editor skill (${meta.root}) to keep working on my Frame Pilot job.
Job folder: ${j.jobDir}
Source video: ${j.source}
Style: ${j.style || "No style — follow my brief and references"}
